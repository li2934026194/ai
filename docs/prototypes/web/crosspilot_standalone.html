<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPilot · AI跨境电商智能工作台（SRS V6 · 27页完整交互版）</title>
  <style>
:root {
  --bg-outer: #f1f5f9;
  --bg-card: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-light: #eff6ff;
  --blue-border: #bfdbfe;
  --text-dark: #0f172a;
  --text-muted: #475569;
  --text-soft: #64748b;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --green-text: #047857;
  --amber: #f59e0b;
  --amber-bg: #fffbeb;
  --amber-text: #b45309;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-text: #b91c1c;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --purple-text: #5b21b6;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.07);
  --radius: 11px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg-outer);
  color: var(--text-dark);
  font-size: 13.5px;
  line-height: 1.5;
}

.shell { display: flex; min-height: 100vh; }

/* ========== Left Accordion Sidebar ========== */
.sidebar {
  width: 258px;
  flex-shrink: 0;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  padding: 14px 11px;
  border-right: 1px solid #1e293b;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 6px 12px;
  border-bottom: 1px solid #1e293b;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: #fff; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.brand-name { font-size: 15.5px; font-weight: 700; color: #fff; line-height: 1.2; }
.brand-sub { font-size: 10.5px; color: #94a3b8; }

.role-box {
  margin: 10px 0;
  padding: 9px 10px;
  background: #1e293b;
  border-radius: 9px;
  border: 1px solid #334155;
}
.role-label { display: block; font-size: 10.8px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
.role-select {
  width: 100%; padding: 6px 8px; border-radius: 6px;
  border: 1px solid #475569; background: #0f172a;
  color: #f8fafc; font-size: 12px; cursor: pointer;
}
.role-hint { margin-top: 6px; font-size: 11px; color: #93c5fd; line-height: 1.38; }

.nav-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
  padding-right: 2px;
}
.nav-group { display: flex; flex-direction: column; }
.nav-parent {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 12.8px;
  font-weight: 500;
  transition: background 0.14s, color 0.14s;
  user-select: none;
}
.nav-parent:hover { background: #1e293b; color: #fff; }
.nav-parent.open { background: #1e293b; color: #fff; font-weight: 600; }
.nav-parent.active-mod { background: rgba(37, 99, 235, 0.22); color: #fff; border: 1px solid rgba(96, 165, 250, 0.3); }
.nav-parent-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-parent-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.nav-caret { font-size: 10px; color: #94a3b8; transition: transform 0.16s; }
.nav-parent.open .nav-caret { transform: rotate(90deg); color: #93c5fd; }

.nav-todo {
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px;
  background: #ef4444; color: #fff;
  white-space: nowrap;
}
.nav-count {
  font-size: 10px; padding: 1px 5px; border-radius: 999px;
  background: rgba(255,255,255,0.1); color: #94a3b8;
}

.nav-children {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 4px 0 4px 14px;
  margin-left: 10px;
  border-left: 1px solid #334155;
}
.nav-group.open .nav-children { display: flex; }
.nav-child {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 6px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: #94a3b8;
  font-size: 12.2px;
  transition: all 0.14s;
}
.nav-child:hover { background: #1e293b; color: #f8fafc; }
.nav-child.active {
  background: var(--blue);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
}

.sidebar-footer {
  margin-top: 10px; padding-top: 9px;
  border-top: 1px solid #1e293b;
  font-size: 10.5px; color: #64748b; line-height: 1.45;
}

/* ========== Main Workspace ========== */
.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 22px 24px;
  gap: 14px;
}

.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.breadcrumb { font-size: 11px; font-weight: 700; color: var(--blue); letter-spacing: 0.3px; }
.page-title { margin: 2px 0 2px; font-size: 18.5px; font-weight: 700; color: var(--text-dark); }
.page-subtitle { margin: 0; font-size: 12.3px; color: var(--text-soft); }

.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.page-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

/* ========== Cards & Modern SaaS Components ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.card-blue { border-color: var(--blue-border); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-title {
  font-size: 14.2px; font-weight: 700; color: var(--text-dark);
  display: flex; align-items: center; gap: 8px;
}

.anno-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 50%;
  color: #fff; font-size: 10.5px; font-weight: 700; flex-shrink: 0;
}
.t-blue { background: var(--blue); }
.t-green { background: var(--green); }
.t-purple { background: var(--purple); }
.t-amber { background: var(--amber); }
.t-red { background: var(--red); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.split-left-form { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
.split-right-panel { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.split-3col-cs { display: grid; grid-template-columns: 235px minmax(0, 1fr) 265px; gap: 12px; align-items: stretch; }
.split-bi { display: grid; grid-template-columns: 205px minmax(0, 1fr) 250px; gap: 12px; align-items: stretch; }

@media (max-width: 1080px) {
  .grid-4, .grid-5, .grid-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split-3col-cs, .split-bi, .split-left-form, .split-right-panel { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* KPI Cards */
.kpi-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 15px;
  box-shadow: var(--shadow-sm);
}
.kpi-card.highlight-green { background: #f0fdf4; border-color: #86efac; }
.kpi-card.highlight-blue { background: #eff6ff; border-color: #93c5fd; }
.kpi-card.highlight-amber { background: #fffbeb; border-color: #fde68a; }
.kpi-label { font-size: 11.8px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.kpi-val { font-size: 22px; font-weight: 800; margin: 4px 0 2px; line-height: 1.25; }
.kpi-sub { font-size: 11.3px; color: var(--text-soft); }

/* Formula Callout Box */
.formula-box {
  background: #f8fafc;
  border: 1px dashed #93c5fd;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11.8px;
  color: #334155;
  line-height: 1.55;
}
.formula-box strong { color: #1d4ed8; }
.formula-inline {
  margin-top: 6px;
  padding: 5px 8px;
  border-radius: 6px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  font-size: 11px;
  color: #475569;
  line-height: 1.4;
}
.formula-inline code { color: #1d4ed8; font-weight: 600; background: transparent; }

/* Banners */
.banner {
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 12.3px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.banner-amber { background: var(--amber-bg); border: 1px solid #fcd34d; color: var(--amber-text); }
.banner-red { background: var(--red-bg); border: 1px solid #fca5a5; color: var(--red-text); }
.banner-blue { background: var(--blue-light); border: 1px solid var(--blue-border); color: var(--blue-hover); }
.banner-green { background: var(--green-bg); border: 1px solid #6ee7b7; color: var(--green-text); }

/* Buttons & Pills (No ugly vertical wrapping!) */
.btn {
  padding: 6px 13px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 12.3px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap;
  transition: all 0.14s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--blue-hover); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-danger { background: var(--red-bg); border-color: #fca5a5; color: var(--red-text); }
.btn-sm { padding: 4px 10px; font-size: 11.6px; }
.btn-anno-toggle { background: #1e293b; border-color: #1e293b; color: #f8fafc; }
.btn-anno-toggle:hover { background: #334155 !important; color: #fff !important; border-color: #334155 !important; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.p-green { background: var(--green-bg); color: var(--green-text); }
.p-blue { background: var(--blue-light); color: var(--blue-hover); }
.p-amber { background: var(--amber-bg); color: var(--amber-text); }
.p-red { background: var(--red-bg); color: var(--red-text); }
.p-purple { background: var(--purple-bg); color: var(--purple-text); }
.p-gray { background: #f1f5f9; color: var(--text-soft); }

/* Underlined Status Tabs (Reference Image 28) */
.utabs {
  display: flex; align-items: center; gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 0 4px;
  overflow-x: auto;
}
.utab {
  padding: 9px 2px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
  transition: all 0.14s;
}
.utab:hover { color: var(--text-dark); }
.utab.active { color: var(--blue); border-bottom-color: var(--blue); }
.utab-cnt {
  padding: 1px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
  background: #f1f5f9; color: var(--text-muted);
}
.utab.active .utab-cnt { background: var(--blue-light); color: var(--blue-hover); }

/* Filter Bar (Reference Image 27) */
.filter-bar {
  display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
}
.filter-item { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
.filter-item label { font-size: 11px; font-weight: 600; color: var(--text-soft); }

/* Product Grid Cards for M4 */
.prod-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px;
  display: flex; flex-direction: column; gap: 9px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.14s, box-shadow 0.14s;
}
.prod-card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-border); }
.prod-thumb {
  height: 92px; border-radius: 8px; background: #f8fafc;
  border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
}

/* M7 1-Large + 4-Small E-commerce Gallery (Reference Image 30) */
.gallery-1plus4 {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 10px;
}
.gallery-4small {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.gal-tile {
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #f8fafc;
  padding: 10px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  cursor: pointer;
}
.gal-tile.picked { border-color: var(--blue); background: #eff6ff; box-shadow: 0 0 0 1px var(--blue); }
.gal-canvas {
  border-radius: 7px;
  background: #fff;
  border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  min-height: 112px;
}
.gal-tile.large .gal-canvas { min-height: 266px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.4px; }
th {
  text-align: left; padding: 8px 10px;
  background: #f8fafc; color: var(--text-soft); font-weight: 700;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td {
  padding: 9px 10px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--text-dark);
  vertical-align: middle;
}
td.nowrap { white-space: nowrap; }
tr:hover td { background: #fafcff; }
tr.row-selected td { background: #eff6ff; }

/* Inputs */
.field { margin-bottom: 9px; }
.field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%; padding: 6px 10px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: #fff;
  color: var(--text-dark); font-size: 12.4px; font-family: inherit;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
.textarea { min-height: 64px; resize: vertical; }

/* Steppers */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stepper-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.step-item {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--text-soft); font-size: 11.8px; font-weight: 600; text-align: center;
}
.step-item.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }
.step-item.done { background: var(--blue); border-color: var(--blue); color: #fff; }

/* CS & Option Tiles */
.session-item {
  padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
  margin-bottom: 7px; cursor: pointer; background: #fff;
}
.session-item.active { background: var(--blue-light); border-color: var(--blue); }
.chat-bubble { padding: 9px 11px; border-radius: 8px; background: #f1f5f9; margin-bottom: 7px; }
.chat-bubble.user { background: var(--blue); color: #fff; margin-left: auto; max-width: 78%; }
.chat-bubble.assistant { background: #f8fafc; border: 1px solid var(--border); max-width: 88%; }
.chat-trans { font-size: 11.3px; color: var(--text-soft); margin-top: 4px; }

.option-tile { padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); cursor: pointer; background: #fff; text-align: center; }
.option-tile.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }

.media-card { border: 1px solid var(--border); border-radius: 9px; padding: 11px; background: #f8fafc; }
.media-card.picked { border-color: var(--blue); border-width: 1.5px; background: #fafcff; }
.media-preview.dark { height: 150px; border-radius: 7px; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; }

/* Slide-over Drawers (SRS Annotations & Detail Drawer) */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
  z-index: 8000;
}
.drawer-backdrop.hidden, .slide-drawer.hidden { display: none; }
.slide-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 440px; max-width: 94vw;
  background: #fff; z-index: 8100;
  box-shadow: -8px 0 30px rgba(15, 23, 42, 0.18);
  display: flex; flex-direction: column;
}
.drawer-head {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.drawer-head.dark { background: #1e293b; color: #fff; border-bottom-color: #334155; }
.drawer-title { font-size: 14.5px; font-weight: 700; }
.drawer-sub { font-size: 11.3px; opacity: 0.8; margin-top: 2px; }
.drawer-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
.drawer-sec-label { font-size: 12px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }

.anno-cards { display: flex; flex-direction: column; gap: 9px; }
.anno-card {
  background: #f8fafc; border: 1px solid var(--border); border-left-width: 4px;
  border-radius: 8px; padding: 9px 11px;
}
.anno-card-head { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12.6px; margin-bottom: 5px; }
.anno-line { font-size: 11.5px; margin-bottom: 3px; line-height: 1.45; }
.anno-k-step { color: var(--blue-hover); font-weight: 600; }
.anno-k-srs { color: var(--text-muted); }
.anno-k-tech { color: var(--green-text); }

.ledger-list { display: flex; flex-direction: column; gap: 6px; }
.ledger-row {
  background: #f8fafc; border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 10px; font-size: 11.5px;
}
.ledger-row-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.ledger-term { font-weight: 700; color: var(--text-dark); }
.ledger-kind-srs { color: var(--blue-hover); font-weight: 700; }
.ledger-kind-mock { color: var(--amber-text); font-weight: 700; }
.ledger-src { color: var(--text-muted); }

/* Toast & Modal */
.toast-container { position: fixed; bottom: 18px; right: 18px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 12.3px; box-shadow: 0 8px 20px rgba(15,23,42,0.22); }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 9000; padding: 16px;
}
.modal-box {
  background: #fff; border-radius: 12px; max-width: 560px; width: 100%;
  padding: 18px 20px; box-shadow: 0 20px 40px rgba(15,23,42,0.25);
}

</style>
</head>
<body>
  <div id="app" class="shell">
    <!-- Left Accordion Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">CP</div>
        <div>
          <div class="brand-name">CrossPilot</div>
          <div class="brand-sub">AI跨境电商 · SRS V6工作台</div>
        </div>
      </div>

      <div class="role-box">

function getRoleTodos(state) {
  const r = state.role;
  const todos = {};
  const pendTk = state.tickets.filter(t => t.status === "待主管审批").length;
  const pendSel = state.m4Pool.filter(x => x.stage === "已提交待审").length;
  const aiCand = state.m4Pool.filter(x => x.stage === "AI初筛候选").length;
  const pendRp = state.m6Plans.filter(p => p.status === "待主管审批").length;
  const lowInv = state.inventoryItems.filter(i => i.shopMode === "REAL" && i.avail < i.safety).length;
  const pendCs = state.csSessions.filter(s => s.mode === "PENDING_HUMAN").length;

  if (r === "approver") {
    if (pendTk) todos.m1c = `待审 ${pendTk}`;
    if (pendSel) todos.m4c = `待拍板 ${pendSel}`;
    if (pendRp) todos.m6c = `待批 ${pendRp}`;
    if (state.m7ComplianceStatus !== "主管已批准导出") todos.m7d = "待把关";
  } else if (r === "selector") {
    if (aiCand) todos.m4b = `初筛 ${aiCand}`;
  } else if (r === "cs") {
    if (pendCs) todos.m1a = `接管 ${pendCs}`;
    if (pendTk) todos.m1c = `跟进 ${pendTk}`;
  } else if (r === "warehouse") {
    if (lowInv) todos.m0c = `预警 ${lowInv}`;
    todos.m6d = "收货";
  } else if (r === "planner") {
    todos.m6a = "测算";
  } else if (r === "creator") {
    todos.m7d = "交付";
  } else if (r === "mock_buyer") {
    todos.m1d = "入口";
  }
  return todos;
}

function calcM4NetSales(x) { return x.paidQty - x.refundQty; }
function calcM4NetRev(x) { return +(x.grossRev - x.discount - x.refundAmt).toFixed(2); }
function calcM4Score(x, maxRev) {
  const revNorm = Math.min(100, (calcM4NetRev(x) / maxRev) * 100);
  const trendNorm = Math.max(0, Math.min(100, (x.trend + 20) * 1.6));
  if (x.marginKnown && x.margin !== null) {
    const mNorm = Math.min(100, x.margin * 4);
    const sc = 0.5 * revNorm + 0.4 * trendNorm + 0.1 * mNorm;
    return { score: sc.toFixed(1), formula: `0.5×${revNorm.toFixed(0)} + 0.4×${trendNorm.toFixed(0)} + 0.1×${mNorm.toFixed(0)} = ${sc.toFixed(1)}` };
  }
  const wR = (0.5 / 0.9), wT = (0.4 / 0.9);
  const sc = wR * revNorm + wT * trendNorm;
  return { score: sc.toFixed(1), formula: `缺利润率重归一：0.556×${revNorm.toFixed(0)} + 0.444×${trendNorm.toFixed(0)} = ${sc.toFixed(1)}` };
}

    const paged = tabFiltered.slice((state.m4Page - 1) * pageSize, state.m4Page * pageSize);

    return {
      headerActions: [

          <div class="formula-box" style="margin-top:10px;">

            净销量 = 支付件数 − 退款件数 ｜ 净收入 = 总额 − 折扣 − 退款金额 ｜ 趋势 = (后半均 − 前半均) ÷ 前半均 ｜ 均衡评分 = <strong>0.5×净收入 + 0.4×趋势 + 0.1×利润率</strong>（利润率未知时不按0算，按 0.5/0.9 与 0.4/0.9 重归一）

        document.querySelectorAll(".m4-utab").forEach(t => t.onclick = () => { state.m4Tab = t.dataset.t; state.m4Page = 1; rerender(); });

  if (pageId === "m4c") {

              <circle cx="${x}" cy="${y}" r="4.5" fill="#2563eb"/><text x="${x}" y="${y-10}" font-size="11.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">${Math.round(v*(mult>1?1.1:1))}件</text>

        document.getElementById("m5ModSel").onchange = (e) => { state.m5Model = e.target.value; rerender(); };
        document.getElementById("m5RunBtn").onclick = () => toast(`已运行 ${state.m5Model} 预测未来 ${state.m5Horizon} 天，并同步更新 M6-2 智能补货参考`);

    };
  }

  // ==================== M5c: WAPE Evaluation & Manual Override ====================
  if (pageId === "m5c") {
    const sumActual = state.m5Eval.reduce((a, r) => a + r.actual, 0);
    const sumAbs = state.m5Eval.reduce((a, r) => a + Math.abs(r.pred - r.actual), 0);
    const sumDiff = state.m5Eval.reduce((a, r) => a + (r.pred - r.actual), 0);
    const wape = sumActual ? ((sumAbs / sumActual) * 100).toFixed(1) : "0.0";
    const mae = (sumAbs / state.m5Eval.length).toFixed(1);
    const bias = sumActual ? ((sumDiff / sumActual) * 100).toFixed(1) : "0.0";
    const wNum = Number(wape);
    const rating = wNum <= 5 ? "非常优秀 (≤5%)" : wNum <= 10 ? "优秀 (5%–10%)" : wNum <= 20 ? "良好 (10%–20%)" : wNum <= 30 ? "一般 (20%–30%)" : "较差 (>30%)";

    return {
      headerActions: [{ label: "← 返回销量预测曲线", primary: false, onClick: () => goPage("m5b") }],
      html: `
        <div class="grid-3">
          <div class="kpi-card highlight-green">
            <div class="kpi-label">滚动回测 wAPE（业务评级：${rating}）</div>
            <div class="kpi-val" style="color:var(--green-text)">${wape}%</div>
            <div class="formula-inline"><code>Σ|实际-预测| ÷ Σ实际 = ${sumAbs} ÷ ${sumActual} = ${wape}%</code></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">MAE（平均绝对误差）</div>
            <div class="kpi-val" style="color:var(--blue-hover)">${mae} 件/天</div>
            <div class="formula-inline"><code>Σ|实际-预测| ÷ 天数 = ${sumAbs} ÷ ${state.m5Eval.length} = ${mae}</code></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Bias（整体偏差方向）</div>
            <div class="kpi-val" style="color:var(--purple-text)">${Number(bias)>=0?"+":""}${bias}%</div>
            <div class="formula-inline"><code>Σ(预测-实际) ÷ Σ实际 = ${sumDiff} ÷ ${sumActual} = ${bias}%</code></div>
          </div>
        </div>

        <div class="card card-blue">
          <div class="card-header">
            <div class="card-title"><span class="anno-tag t-purple">1</span> 逐日回测明细与人工实际值修正（直接修改数字并保存，上方算式实时重算）</div>

          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>日期</th><th>原模型预测</th><th>真实实际销量 (可人工修正)</th><th>绝对误差 |实际-预测|</th><th>是否缺货日 (FR-FC-11)</th><th>数值来源</th></tr></thead>
              <tbody>
                ${state.m5Eval.map((r, i) => `
                  <tr>
                    <td class="nowrap">${r.date}</td>
                    <td class="nowrap"><strong>${r.pred} 件</strong></td>
                    <td class="nowrap"><input type="number" class="input m5-act-inp" data-i="${i}" value="${r.actual}" style="width:88px;"/></td>
                    <td class="nowrap">${Math.abs(r.pred - r.actual)} 件</td>
                    <td class="nowrap"><button class="btn btn-sm m5-so-btn" data-i="${i}">${r.stockout ? '<span style="color:var(--red-text)">是 (库存受限日)</span>' : "否 (正常售卖)"}</button></td>
                    <td class="nowrap"><span class="pill ${r.edited?"p-amber":"p-gray"}">${r.edited?"人工修正(保留原单值)":"OrderItem 原始采集"}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        document.querySelectorAll(".m5-so-btn").forEach(b => b.onclick = () => {
          const r = state.m5Eval[Number(b.dataset.i)];

        });
        document.getElementById("recalcWapeBtn").onclick = () => {
          document.querySelectorAll(".m5-act-inp").forEach(inp => {
            const idx = Number(inp.dataset.i);
            const val = Math.max(0, Number(inp.value) || 0);
            if (val !== state.m5Eval[idx].actual) { state.m5Eval[idx].actual = val; state.m5Eval[idx].edited = true; }

  // ==================== M6a: Normal Replenishment (img_082 faithful) ====================
  if (pageId === "m6a") {
    const canSubmit = state.role === "planner" || state.role === "approver";
    const invRow = state.inventoryItems.find(i => i.sku === state.m6NormalSku && i.shopMode === "REAL") || state.inventoryItems[2];
    const prod = state.masterProducts.find(p => p.sku === state.m6NormalSku) || state.masterProducts[1];
    const baseDaily = 30;
    const adjFactor = 1 + (state.m6NormalSeasonPct + state.m6NormalPromoPct) / 100;
    const adjDaily = Math.max(1, Math.round(baseDaily * adjFactor));
    const targetInv = adjDaily * (state.m6NormalLeadDays + state.m6NormalSafetyDays);
    const gap = Math.max(0, targetInv - invRow.avail - state.m6NormalInTransit);
    const plans = [
      { name: "保守方案 (90%服务)", qty: Math.round(gap * 0.8), lost: "约 68 件" },
      { name: "平衡方案 (推荐 · 95%)", qty: gap, lost: "约 12 件" },
      { name: "激进方案 (99%备货)", qty: Math.round(gap * 1.25), lost: "0 件" },

    return {

              <div class="field"><label>安全备货 (天)</label><input id="m6nSafe" type="number" class="input" value="${state.m6NormalSafetyDays}"/></div>

            ${missingRef ? '<div class="banner banner-red" style="font-size:11.5px;">校验失败：非零调整百分比必须填写依据编号！</div>' : ""}
          </div>

          <div class="card card-blue">
            <div class="card-header"><div class="card-title"><span class="anno-tag t-green">3</span> 三方案定量比较 & 逐日基线代理明细</div></div>
            <div class="table-wrap" style="margin-bottom:12px;">
              <table>

                <tbody>
                  ${plans.map((p, i) => `
                    <tr class="${state.m6NormalPlanIdx===i?"row-selected":""}">
                      <td><strong>${p.name}</strong></td>
                      <td class="nowrap"><strong>${p.qty} 件</strong></td>
                      <td class="nowrap">${p.lost}</td>
                      <td class="nowrap"><strong>$${Math.round(p.qty * prod.cost).toLocaleString()}</strong></td>
                      <td class="nowrap"><button class="btn btn-sm ${state.m6NormalPlanIdx===i?"btn-primary":""} m6n-pick" data-i="${i}">${state.m6NormalPlanIdx===i?"已选中 ✓":"选中"}</button></td>

            <div class="table-wrap">

                  `).join("")}
                </tbody>

            </div>

      bind: () => {

        document.getElementById("m6nSafe").oninput = (e) => { state.m6NormalSafetyDays = Math.max(0, Number(e.target.value)||0); rerender(); };
        document.getElementById("m6nSea").oninput = (e) => { state.m6NormalSeasonPct = Number(e.target.value)||0; rerender(); };

        document.getElementById("m6nProRef").oninput = (e) => { state.m6NormalPromoRef = e.target.value; };
        document.getElementById("m6nTr").oninput = (e) => { state.m6NormalInTransit = Math.max(0, Number(e.target.value)||0); rerender(); };
        document.querySelectorAll(".m6n-pick").forEach(b => b.onclick = () => { state.m6NormalPlanIdx = Number(b.dataset.i); rerender(); });
      }
    };
  }

  // ==================== M6b: Smart Replenishment (img_083 faithful + FORECAST_REQUIRED) ====================
  if (pageId === "m6b") {
    const canSubmit = state.role === "planner" || state.role === "approver";
    const hasForecast = state.m6SmartSku === "BAG-108"; // Only BAG-108 has saved M5 forecast!
    const invRow = state.inventoryItems.find(i => i.sku === state.m6SmartSku && i.shopMode === "REAL") || state.inventoryItems[0];
    const prod = state.masterProducts.find(p => p.sku === state.m6SmartSku) || state.masterProducts[0];
    const predDaily = 81;
    const covDays = (invRow.avail / predDaily).toFixed(1);
    const targetInv = Math.round(predDaily * (state.m6SmartLeadDays + state.m6SmartSafetyDays) * (state.m6SmartAllocPct / 100));
    const recQty = Math.max(0, targetInv - invRow.avail - state.m6SmartInTransit);

    return {
      headerActions: [
        { label: "← 对比普通补货 (M6-1)", primary: false, onClick: () => goPage("m6a") },
        { label: "提交智能补货计划 (SMART) →", primary: true, onClick: () => {
          if (!hasForecast) { toast("FORECAST_REQUIRED：缺未来预测，智能分支严格禁止提交！"); return; }
          if (!canSubmit) { toast("仅「驾驶舱设计者/业务运营」可提交补货计划"); return; }
          state.m6Plans.unshift({
            id: "RP-S-" + Date.now().toString().slice(-6), mode: "SMART", sku: invRow.sku,
            shop: `${invRow.shopName} · ${invRow.wh}`, qty: recQty,
            cash: "$" + Math.round(recQty * prod.cost).toLocaleString(),
            sig: "sig:smart..OK", submitter: state.role === "planner" ? "张运营" : state.role, status: "待主管审批"
          });
          goPage("m6c"); toast("智能补货计划已提交至 M6-3 独立智能计划队列");
        } }
      ],
      html: `
        <div class="card">
          <div class="filter-bar">
            <div class="filter-item">
              <label><span class="anno-tag t-blue">1</span> 选择分析 SKU（切到 COS-052 可实测缺预测拦截）</label>
              <select id="m6sSku" class="select">
                <option value="BAG-108" ${state.m6SmartSku==="BAG-108"?"selected":""}>BAG-108 · 轻量通勤双肩包 (已有 M5 CatBoost 未来预测 ✓)</option>
                <option value="COS-052" ${state.m6SmartSku==="COS-052"?"selected":""}>COS-052 · 焕亮保湿面霜 (无未来预测 · 测试 FORECAST_REQUIRED)</option>
                <option value="MAT-014" ${state.m6SmartSku==="MAT-014"?"selected":""}>MAT-014 · 桌面皮质收纳垫 (无未来预测 · 测试 FORECAST_REQUIRED)</option>

            <div class="filter-item">
              <label>目标仓分配比例 (%)</label>
              <input id="m6sAlloc" type="number" class="input" value="${state.m6SmartAllocPct}" min="10" max="100"/>
            </div>
          </div>
        </div>

        ${!hasForecast ? `
          <div class="banner banner-red">
            <span><span class="anno-tag t-red">2</span> 阻断错误 [FORECAST_REQUIRED]：当前 SKU (${state.m6SmartSku}) 尚无覆盖未来日期的 M5 销量预测！智能补货严禁使用 30 天历史销量代理。</span>
            <button class="btn btn-primary btn-sm" id="gotoM5bFix">去 M5-2 生成未来预测 →</button>
          </div>
        ` : `
          <div class="grid-4">

            <div class="kpi-card"><div class="kpi-label">当前可售 / 覆盖天数</div><div class="kpi-val" style="color:var(--red-text)">${invRow.avail} 件 (${covDays}天)</div><div class="formula-inline"><code>覆盖天数 = ${invRow.avail} ÷ ${predDaily} = ${covDays}天</code></div></div>
            <div class="kpi-card highlight-amber"><div class="kpi-label">预计库存风险</div><div class="kpi-val" style="color:var(--red-text)">高风险</div><div class="kpi-sub">覆盖 ${covDays}天 &lt; 交期 ${state.m6SmartLeadDays}天</div></div>
            <div class="kpi-card highlight-blue"><div class="kpi-label">智能建议采购量</div><div class="kpi-val" style="color:var(--blue-hover)">${recQty} 件</div><div class="formula-inline"><code>${predDaily}×(${state.m6SmartLeadDays}+${state.m6SmartSafetyDays})×${state.m6SmartAllocPct}% - ${invRow.avail} - ${state.m6SmartInTransit}</code></div></div>

          <div class="grid-2">
            <div class="card">
              <div class="card-header"><div class="card-title"><span class="anno-tag t-green">2</span> M5 已保存未来逐日预测曲线（不调训练接口，仅只读消费）</div></div>

            <div class="card">

              <div class="table-wrap">
                <table>
                  <thead><tr><th>SKU</th><th>日均预测</th><th>可售库存</th><th>覆盖天数</th><th>状态</th></tr></thead>
                  <tbody>

function badgeHtml(cell) {
  if (cell.startsWith("★")) return `<span class="pill p-purple">${cell}</span>`;
  if (cell.startsWith("✓")) return `<span class="pill p-red">${cell}</span>`;
  if (cell.startsWith("◆")) return `<span class="pill p-blue">${cell}</span>`;
  if (cell.startsWith("○")) return `<span class="pill p-gray">${cell}</span>`;
  return `<span style="color:#94a3b8;font-size:11.3px;">${cell}</span>`;
}

          <div class="kpi-card"><div class="kpi-label">SRS §1.5 标准角色</div><div class="kpi-val" style="color:var(--purple-text)">9 类岗位</div><div class="kpi-sub">一字不改对齐需求规格书</div></div>
          <div class="kpi-card highlight-green"><div class="kpi-label">SoD 互斥冲突</div><div class="kpi-val" style="color:var(--green-text)">0 冲突</div><div class="kpi-sub">提交人与终审人严格隔离</div></div>
          <div class="kpi-card"><div class="kpi-label">审计留痕条数</div><div class="kpi-val" style="color:var(--amber-text)">${state.auditLogs.length} 条</div><div class="kpi-sub">授权变更与403拦截全记录</div></div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title"><span class="anno-tag t-green">2</span> 按 SRS §1.5 九大角色筛选人数与明细</div></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;">
            <button class="btn btn-sm ${state.m8RoleFilter==="ALL"?"btn-primary":""} m8-rflt" data-r="ALL">全部 (${state.employees.length})</button>
            ${SRS_ROLES.map(r => {
              const cnt = state.employees.filter(e => e.role === r.key).length;
              return `<button class="btn btn-sm ${state.m8RoleFilter===r.key?"btn-primary":""} m8-rflt" data-r="${r.key}">${r.label} (${cnt})</button>`;
            }).join("")}
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>工号</th><th>员工姓名</th><th>SRS §1.5 职位角色 (下拉调岗)</th><th>权限组</th><th>店铺 / 数据范围</th><th>状态</th><th>操作</th></tr></thead>
              <tbody>
                ${filtered.map(emp => {
                  const rObj = SRS_ROLES.find(r => r.key === emp.role) || SRS_ROLES[0];
                  return `
                    <tr>
                      <td class="nowrap"><strong>${emp.id}</strong></td>
                      <td class="nowrap"><strong>${emp.name}</strong><div style="font-size:11px;color:var(--text-soft)">${emp.lastLogin}</div></td>
                      <td>
                        <select class="select m8-emp-role" data-id="${emp.id}" ${!canManage ? "disabled" : ""} style="min-width:190px;">
                          ${SRS_ROLES.map(r => `<option value="${r.key}" ${emp.role===r.key?"selected":""}>${r.label}</option>`).join("")}
                        </select>
                      </td>
                      <td class="nowrap"><span class="pill ${rObj.pill}">${rObj.code}</span></td>
                      <td style="font-size:12px;">${emp.shop}</td>
                      <td class="nowrap"><span class="pill ${emp.active?"p-green":"p-red"}">${emp.active?"启用中":"已停用"}</span></td>
                      <td class="nowrap"><button class="btn btn-sm ${emp.active?"btn-danger":"btn-success"} m8-emp-toggle" data-id="${emp.id}" ${!canManage?"disabled":""}>${emp.active?"停用账号":"恢复启用"}</button></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        const sw = document.getElementById("m8SwitchMgrBtn");
        if (sw) sw.onclick = () => { state.role = "manager"; document.getElementById("roleSelect").value = "manager"; rerender(); };
        document.querySelectorAll(".m8-rflt").forEach(b => b.onclick = () => { state.m8RoleFilter = b.dataset.r; rerender(); });
        document.querySelectorAll(".m8-emp-role").forEach(sel => sel.onchange = (e) => {
          const emp = state.employees.find(x => x.id === sel.dataset.id);
          const oldL = SRS_ROLES.find(r => r.key === emp.role)?.label;
          emp.role = e.target.value;
          const newL = SRS_ROLES.find(r => r.key === emp.role)?.label;
          state.auditLogs.unshift({ time: new Date().toTimeString().slice(0, 8), actor: state.role, target: `${emp.name} (${emp.id})`, action: "调整员工职位", detail: `${oldL} → ${newL}`, ok: true });
          rerender(); toast(`已将 ${emp.name} 调岗为「${newL}」`);
        });
        document.querySelectorAll(".m8-emp-toggle").forEach(b => b.onclick = () => {
          const emp = state.employees.find(x => x.id === b.dataset.id);
          emp.active = !emp.active;
          state.auditLogs.unshift({ time: new Date().toTimeString().slice(0, 8), actor: state.role, target: `${emp.name} (${emp.id})`, action: emp.active ? "恢复账号" : "停用账号", detail: `状态变更为：${emp.active ? "启用中" : "已停用"}`, ok: true });
          rerender(); toast(`${emp.name} 账号已${emp.active ? "恢复启用" : "停用"}`);
        });
      }
    };
  }

  // ==================== M8b: 9-Role Permission Matrix & Audit Logs ====================
  if (pageId === "m8b") {
    const curRoleObj = SRS_ROLES.find(r => r.key === state.role) || SRS_ROLES[0];
    const activeRoleIdx = SRS_ROLES.findIndex(r => r.key === state.role);
    return {
      headerActions: [
        { label: "← 返回员工名册", primary: false, onClick: () => goPage("m8a") },
        { label: "模拟触发越权拦截", primary: true, onClick: () => {
          state.auditLogs.unshift({ time: new Date().toTimeString().slice(0, 8), actor: state.role, target: "M6-3 补货审批 RP-08", action: "SoD 拦截 (403)", detail: "提交人与审批人同为当前账号，触发职责分离保护", ok: false });
          rerender(); toast("已记录一条 SoD 越权拦截审计日志");
        } }
      ],
      html: `
        <div class="banner banner-blue">
          <span><span class="anno-tag t-blue">1</span> 点击表头任意角色即可切换当前登录角色，并实时联动左侧菜单待办角标！当前高亮：<strong>${curRoleObj.label}</strong></span>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><span class="anno-tag t-green">2</span> SRS §1.5 九大业务角色 × 15 项核心功能权限矩阵</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <span class="pill p-purple">★ 治理授权</span><span class="pill p-red">✓ 终审拍板</span><span class="pill p-blue">◆ 业务操作</span><span class="pill p-gray">○ 限域只读</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="min-width:190px;">功能模块 / 权限点</th>
                  ${SRS_ROLES.map((r, i) => `
                    <th style="cursor:pointer;min-width:104px;${i===activeRoleIdx?"background:#dbeafe;color:#1d4ed8;border-bottom:2px solid #2563eb;":""}" class="m8-col-switch" data-role="${r.key}">
                      ${r.label}
                      ${i===activeRoleIdx ? '<div style="font-size:10px;font-weight:800;">● 当前体验</div>' : '<div style="font-size:10px;color:#94a3b8;">点击切换</div>'}
                    </th>
                  `).join("")}
                </tr>
              </thead>
              <tbody>
                ${MATRIX_ROWS.map(row => `
                  <tr>
                    <td class="nowrap"><strong>${row[0]}</strong></td>
                    ${row.slice(1).map((cell, ci) => `<td class="nowrap" style="${ci===activeRoleIdx?"background:#eff6ff;":""}">${badgeHtml(cell)}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card card-blue">
          <div class="card-header"><div class="card-title" style="color:var(--purple-text);"><span class="anno-tag t-purple">3</span> 角色变更与敏感越权拦截审计日志（rbac_audit_logs）</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>时间</th><th>操作人角色</th><th>目标对象</th><th>动作类型</th><th>详细说明</th><th>结果</th></tr></thead>
              <tbody>
                ${state.auditLogs.map(log => `
                  <tr>
                    <td class="nowrap">${log.time}</td>
                    <td class="nowrap"><strong>${SRS_ROLES.find(r=>r.key===log.actor)?.label || log.actor}</strong></td>
                    <td class="nowrap">${log.target}</td>
                    <td class="nowrap"><span class="pill ${log.ok?"p-blue":"p-red"}">${log.action}</span></td>
                    <td style="font-size:12px;">${log.detail}</td>
                    <td class="nowrap"><span class="pill ${log.ok?"p-green":"p-red"}">${log.ok?"已记录":"已拦截"}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        document.querySelectorAll(".m8-col-switch").forEach(th => th.onclick = () => {
          state.role = th.dataset.role;
          document.getElementById("roleSelect").value = state.role;
          rerender();
          toast(`已切换体验角色为：${SRS_ROLES.find(r=>r.key===state.role)?.label}`);
        });
      }
    };
  }

  return null;
}

// === app.js ===
const ROLE_HINTS = Object.fromEntries(SRS_ROLES.map(r => [r.key, r.desc]));
const state = createInitialState();

function toast(msg) {
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openModal(title, bodyHtml, onMount) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBd">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:15.5px;">${title}</strong>
          <button class="btn btn-sm" id="modalCloseBtn">✕</button>
        </div>
        <div>${bodyHtml}</div>
      </div>
    </div>
  `;
  document.getElementById("modalCloseBtn").onclick = closeModal;
  document.getElementById("modalBd").onclick = (e) => { if (e.target.id === "modalBd") closeModal(); };
  if (onMount) onMount();
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function openDrawer(title, sub, bodyHtml, onMount) {
  document.getElementById("detailDrawerTitle").textContent = title;
  document.getElementById("detailDrawerSub").textContent = sub;
  document.getElementById("detailDrawerBody").innerHTML = bodyHtml;
  document.getElementById("detailDrawer").classList.remove("hidden");
  document.getElementById("detailDrawerBackdrop").classList.remove("hidden");
  if (onMount) onMount();
}

function closeDetailDrawer() {
  document.getElementById("detailDrawer").classList.add("hidden");
  document.getElementById("detailDrawerBackdrop").classList.add("hidden");
}

function findModuleOfPage(pageId) {
  return MODULE_DEFS.find(m => m.pages.some(p => p.id === pageId)) || MODULE_DEFS[0];
}

function goPage(pageId) {
  state.pageId = pageId;
  state.openModuleId = findModuleOfPage(pageId).id;
  window.location.hash = pageId;
  rerender();
}

function rerender() {
  const mod = findModuleOfPage(state.pageId);
  const meta = PAGE_META[state.pageId];
  const todos = getRoleTodos(state);

  document.getElementById("roleHint").textContent = ROLE_HINTS[state.role] || "";

  // Accordion Left Sidebar
  document.getElementById("sidebarNav").innerHTML = MODULE_DEFS.map(m => {
    const isOpen = state.openModuleId === m.id;
    const isModActive = mod.id === m.id;
    const modTodoCount = m.pages.filter(p => todos[p.id]).length;
    return `
      <div class="nav-group ${isOpen ? "open" : ""}">
        <div class="nav-parent ${isOpen ? "open" : ""} ${isModActive ? "active-mod" : ""}" data-mod="${m.id}">
          <div class="nav-parent-left">
            <span class="nav-caret">▸</span>
            <span>${m.label}</span>
          </div>
          <div class="nav-parent-right">
            ${modTodoCount ? `<span class="nav-todo">待办 ${modTodoCount}</span>` : `<span class="nav-count">${m.pages.length}</span>`}
          </div>
        </div>
        <div class="nav-children">
          ${m.pages.map(p => `
            <div class="nav-child ${p.id === state.pageId ? "active" : ""}" data-pid="${p.id}">
              <span>${p.label}</span>
              ${todos[p.id] ? `<span class="nav-todo">${todos[p.id]}</span>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".nav-parent").forEach(el => {
    el.onclick = () => {
      const mId = el.dataset.mod;
      // Accordion behavior: clicking closed module opens it & collapses others; clicking open module collapses it
      state.openModuleId = (state.openModuleId === mId) ? null : mId;
      rerender();
    };
  });
  document.querySelectorAll(".nav-child").forEach(el => {
    el.onclick = () => goPage(el.dataset.pid);
  });

  // Top Header
  document.getElementById("breadcrumb").textContent = meta.breadcrumb;
  document.getElementById("pageTitle").textContent = meta.title;
  document.getElementById("pageSubtitle").textContent = meta.subtitle;

  // Render Page Content
  const helpers = { toast, goPage, openModal, closeModal, openDrawer, closeDetailDrawer, rerender };
  const view = renderM0_M3(state.pageId, state, helpers) || renderM4_M6(state.pageId, state, helpers) || renderM7_M8(state.pageId, state, helpers);

  const actBox = document.getElementById("headerActions");
  actBox.innerHTML = "";
  (view.headerActions || []).forEach(a => {
    const btn = document.createElement("button");
    btn.className = `btn ${a.primary ? "btn-primary" : ""}`;
    btn.textContent = a.label;
    btn.onclick = a.onClick;
    actBox.appendChild(btn);
  });

  document.getElementById("pageBody").innerHTML = view.html;
  if (view.bind) view.bind();

  // Slide-over SRS Annotation Drawer
  const annoDrawer = document.getElementById("annoDrawer");
  const annoBd = document.getElementById("annoDrawerBackdrop");
  if (state.showAnno) {
    annoDrawer.classList.remove("hidden");
    annoBd.classList.remove("hidden");
  } else {
    annoDrawer.classList.add("hidden");
    annoBd.classList.add("hidden");
  }

  document.getElementById("annoPageTitle").textContent = `SRS注释与来源台账 · ${state.pageId.toUpperCase()}`;
  document.getElementById("annoCards").innerHTML = meta.blocks.map((b, idx) => `
    <div class="anno-card" style="border-left-color:${b.color};">
      <div class="anno-card-head">
        <span class="anno-tag" style="background:${b.color};">${idx + 1}</span>
        <span>${b.title}</span>
      </div>
      <div class="anno-line anno-k-step">【对应步骤】${b.step}</div>
      <div class="anno-line anno-k-srs">【SRS依据】${b.srs}</div>
      <div class="anno-line anno-k-tech">【技术支撑】${b.tech}</div>
    </div>
  `).join("");

  document.getElementById("ledgerGrid").innerHTML = meta.ledger.map(([term, kind, src]) => `
    <div class="ledger-row">
      <div class="ledger-row-top">
        <span class="ledger-term">${term}</span>
        <span class="${kind.includes("SRS") || kind.includes("参考") || kind.includes("实时") ? "ledger-kind-srs" : "ledger-kind-mock"}">${kind}</span>
      </div>
      <div class="ledger-src">${src}</div>
    </div>
  `).join("");
}

// Init Events
const roleSelEl = document.getElementById("roleSelect");
roleSelEl.value = state.role;
roleSelEl.onchange = (e) => {
  state.role = e.target.value;
  rerender();
  toast(`已切换登录角色：${SRS_ROLES.find(r=>r.key===state.role)?.label || state.role}`);
};

document.getElementById("toggleAnnoBtn").onclick = () => { state.showAnno = !state.showAnno; rerender(); };
document.getElementById("closeAnnoDrawer").onclick = () => { state.showAnno = false; rerender(); };
document.getElementById("annoDrawerBackdrop").onclick = () => { state.showAnno = false; rerender(); };

document.getElementById("closeDetailDrawer").onclick = closeDetailDrawer;
document.getElementById("detailDrawerBackdrop").onclick = closeDetailDrawer;

const initHash = window.location.hash.replace("#", "");
if (PAGE_META[initHash]) {
  state.pageId = initHash;
  state.openModuleId = findModuleOfPage(initHash).id;
}
rerender();

</script>
</body>
</html>
