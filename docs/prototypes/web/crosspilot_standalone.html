<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPilot · AI跨境电商智能工作台（SRS V6 · 27页完整交互版）</title>
  <style>
:root {
  --bg-outer: #f8fafc;
  --bg-card: #ffffff;
  --border: #e5e7eb;
  --border-strong: #cbd5e1;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-light: rgba(239, 246, 255, 0.72);
  --blue-border: #bfdbfe;
  --text-dark: #0f172a;
  --text-muted: #334155;
  --text-soft: #475569;
  --green: #10b981;
  --green-bg: rgba(236, 253, 245, 0.72);
  --green-text: #047857;
  --amber: #f59e0b;
  --amber-bg: rgba(255, 251, 235, 0.75);
  --amber-text: #b45309;
  --red: #ef4444;
  --red-bg: rgba(254, 242, 242, 0.75);
  --red-text: #b91c1c;
  --purple: #7c3aed;
  --purple-bg: rgba(245, 243, 255, 0.75);
  --purple-text: #5b21b6;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07);
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-outer);
  color: var(--text-dark);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.tnum, .kpi-val, table td, table th, code {
  font-variant-numeric: tabular-nums;
}

.shell { display: flex; min-height: 100vh; }

/* ========== Left Accordion Sidebar ========== */
.sidebar {
  width: 244px;
  flex-shrink: 0;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  padding: 14px 11px;
  border-right: 1px solid #1e293b;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 6px 12px;
  border-bottom: 1px solid #1e293b;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: #fff; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.brand-name { font-size: 15.5px; font-weight: 700; color: #fff; line-height: 1.25; }
.brand-sub { font-size: 11.5px; color: #cbd5e1; }

.role-box {
  margin: 10px 0;
  padding: 10px;
  background: #1e293b;
  border-radius: 8px;
  border: 1px solid #334155;
}
.role-label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
.role-select {
  width: 100%; height: 34px; padding: 4px 8px; border-radius: 8px;
  border: 1px solid #475569; background: #0f172a;
  color: #f8fafc; font-size: 12.5px; cursor: pointer; outline: none;
}
.role-select:focus { border-color: #60a5fa; }
.role-hint { margin-top: 6px; font-size: 12px; color: #93c5fd; line-height: 1.45; }

.nav-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav-list::-webkit-scrollbar { display: none; }

.nav-group { display: flex; flex-direction: column; }
.nav-parent {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  transition: background 0.16s, color 0.16s;
  user-select: none;
}
.nav-parent:hover { background: #1e293b; color: #fff; }
.nav-parent.open { background: #1e293b; color: #fff; font-weight: 600; }
.nav-parent.active-mod { background: rgba(37, 99, 235, 0.22); color: #fff; border: 1px solid rgba(96, 165, 250, 0.28); }
.nav-parent-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-parent-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.nav-caret { font-size: 11px; color: #cbd5e1; transition: transform 0.15s; }
.nav-parent.open .nav-caret { transform: rotate(90deg); color: #93c5fd; }

.nav-todo {
  font-size: 11.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px;
  background: #ef4444; color: #fff;
  white-space: nowrap;
}
.nav-count {
  font-size: 11.5px; padding: 1px 6px; border-radius: 999px;
  background: rgba(255,255,255,0.1); color: #cbd5e1;
}

.nav-children {
  display: none; flex-direction: column; gap: 3px;
  padding: 4px 0 4px 12px;
  margin-left: 9px;
  border-left: 1px solid #334155;
}
.nav-group.open .nav-children { display: flex; }
.nav-child {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 12.5px;
  line-height: 1.4;
  transition: all 0.15s;
}
.nav-child:hover { background: #1e293b; color: #fff; }
.nav-child.active {
  background: var(--blue); color: #fff; font-weight: 600;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
}

.sidebar-footer {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #1e293b;
  font-size: 12px; color: #cbd5e1; line-height: 1.5;
}

/* ========== Main Workspace ========== */
.main-wrap {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  padding: 18px 24px 28px;
  gap: 16px;
}

.topbar {
  background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--blue);
  border-radius: var(--radius);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.breadcrumb { font-size: 12px; font-weight: 600; color: var(--blue); }
.page-title { margin: 2px 0 4px; font-size: 22px; font-weight: 700; color: var(--text-dark); line-height: 1.3; }
.page-subtitle { margin: 0; font-size: 13px; color: var(--text-soft); }

.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.page-body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ========== Clean Modern SaaS Cards ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, border-color 0.18s ease;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-blue { border-color: var(--blue-border); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-title {
  font-size: 15px; font-weight: 650; color: var(--text-dark);
  display: flex; align-items: center; gap: 8px;
}

/* Hide tutorial numeric tags in main body; display inside SRS Drawer */
.page-body .anno-tag { display: none; }
.anno-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  color: #fff; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
}

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.split-left-form { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.split-right-panel { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.split-3col-cs { display: grid; grid-template-columns: 235px minmax(0, 1fr) 275px; gap: 14px; align-items: stretch; }
.split-bi { display: grid; grid-template-columns: 205px minmax(0, 1fr) 255px; gap: 14px; align-items: stretch; }

@media (max-width: 1120px) {
  .grid-4, .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split-3col-cs, .split-bi, .split-left-form, .split-right-panel { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* KPI Cards */
.kpi-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 17px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease;
}
.kpi-card:hover { box-shadow: var(--shadow-md); }
.kpi-card.highlight-green { border-top: 3px solid var(--green); }
.kpi-card.highlight-blue { border-top: 3px solid var(--blue); }
.kpi-card.highlight-amber { border-top: 3px solid var(--amber); }
.kpi-label {
  font-size: 12.5px; color: var(--text-soft); font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.kpi-val {
  font-size: 26px; font-weight: 700; margin: 6px 0 4px;
  line-height: 1.2; color: var(--text-dark);
  font-variant-numeric: tabular-nums;
}
.kpi-sub { font-size: 12px; color: var(--text-soft); }

/* Formula Captions */
.formula-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.55;
}
.formula-box strong { color: var(--blue-hover); }
.formula-inline {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.45;
}
.formula-inline code {
  color: var(--blue-hover); font-weight: 600; background: transparent;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}

/* Soft Converged Banners */
.banner {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.banner-amber { background: var(--amber-bg); border: 1px solid #fde68a; color: #92400e; }
.banner-red { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.banner-blue { background: var(--blue-light); border: 1px solid #dbeafe; color: #1e40af; }
.banner-green { background: var(--green-bg); border: 1px solid #a7f3d0; color: #065f46; }

/* Buttons & Pills */
.btn {
  min-height: 34px;
  padding: 6px 13px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--blue-hover); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-danger { background: var(--red-bg); border-color: #fca5a5; color: var(--red-text); }
.btn-sm { min-height: 28px; padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn-anno-toggle { background: #fff; border-color: var(--border-strong); color: var(--text-muted); }
.btn-anno-toggle:hover { background: #f1f5f9 !important; color: var(--text-dark) !important; border-color: #94a3b8 !important; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600;
  white-space: nowrap;
}
.p-green { background: var(--green-bg); color: var(--green-text); border: 1px solid rgba(16,185,129,0.2); }
.p-blue { background: var(--blue-light); color: var(--blue-hover); border: 1px solid rgba(37,99,235,0.18); }
.p-amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid rgba(245,158,11,0.22); }
.p-red { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(239,68,68,0.2); }
.p-purple { background: var(--purple-bg); color: var(--purple-text); border: 1px solid rgba(124,58,237,0.2); }
.p-gray { background: #f1f5f9; color: var(--text-soft); border: 1px solid #e2e8f0; }

/* Underlined Status Tabs */
.utabs {
  display: flex; align-items: center; gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 0 2px;
  overflow-x: auto;
}
.utab {
  padding: 9px 2px;
  font-size: 13px; font-weight: 600; color: var(--text-soft);
  cursor: pointer; border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; transition: all 0.14s;
}
.utab:hover { color: var(--text-dark); }
.utab.active { color: var(--blue); border-bottom-color: var(--blue); }
.utab-cnt {
  padding: 1px 7px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  background: #f1f5f9; color: var(--text-muted);
}
.utab.active .utab-cnt { background: var(--blue-light); color: var(--blue-hover); }

/* Filter Bar */
.filter-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.filter-item { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
.filter-item label { font-size: 12px; font-weight: 600; color: var(--text-soft); }

/* Product Thumbnail & Cards */
.prod-thumb-img {
  width: 52px; height: 52px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff;
  object-fit: cover; flex-shrink: 0;
}
.prod-thumb-lg {
  width: 66px; height: 66px; border-radius: 9px;
  border: 1px solid var(--border); background: #fff;
  object-fit: cover; flex-shrink: 0;
}
.prod-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, border-color 0.18s ease;
}
.prod-card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-border); }
.prod-thumb {
  border-radius: 8px; background: #f8fafc;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px;
}

/* M7 1-Large + 4-Small Gallery */
.gallery-1plus4 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.gallery-4small { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gal-tile {
  border: 1px solid var(--border); border-radius: 8px;
  background: #f8fafc; padding: 9px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  cursor: pointer; transition: border-color 0.15s;
}
.gal-tile.picked { border-color: var(--blue); background: #eff6ff; box-shadow: 0 0 0 1px var(--blue); }
.gal-canvas {
  border-radius: 7px; background: #fff; border: 1px solid #e5e7eb;
  display: flex; align-items: center; justify-content: center;
  min-height: 104px; position: relative; overflow: hidden;
}
.gal-tile.large .gal-canvas { min-height: 245px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 10px 12px;
  background: #f8fafc; color: var(--text-soft); font-weight: 600;
  border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12.5px;
}
td {
  padding: 11px 12px; border-bottom: 1px solid #f1f5f9;
  color: var(--text-dark); vertical-align: middle; font-size: 13px;
}
td.nowrap { white-space: nowrap; }
tr:hover td { background: #f8fafc; }
tr.row-selected td { background: #eff6ff; }

/* Inputs & Validation */
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: #fff;
  color: var(--text-dark); font-size: 13px; font-family: inherit;
}
.input, .select { height: 36px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
.textarea { min-height: 68px; resize: vertical; }
.input-err { border-color: var(--red) !important; background: #fef2f2 !important; }
.field-err { font-size: 12px; color: var(--red-text); margin-top: 4px; font-weight: 600; }

/* Async Progress Bar */
.async-card {
  border: 1px solid var(--blue-border); background: #f8fbff;
  border-radius: 8px; padding: 11px 14px;
}
.async-bar { height: 7px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin: 7px 0; }
.async-fill { height: 100%; background: var(--blue); transition: width 0.25s ease; }

/* Steppers */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.step-item {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--text-soft); font-size: 12.5px; font-weight: 600; text-align: center;
}
.step-item.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }
.step-item.done { background: var(--blue); border-color: var(--blue); color: #fff; }

/* CS & Option Tiles */
.session-item {
  padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  margin-bottom: 8px; cursor: pointer; background: #fff;
}
.session-item.active { background: var(--blue-light); border-color: var(--blue); }
.chat-bubble { padding: 10px 12px; border-radius: 8px; background: #f1f5f9; margin-bottom: 8px; font-size: 13px; }
.chat-bubble.user { background: var(--blue); color: #fff; margin-left: auto; max-width: 78%; }
.chat-bubble.assistant { background: #f8fafc; border: 1px solid var(--border); max-width: 88%; }
.chat-trans { font-size: 12px; color: var(--text-soft); margin-top: 4px; }

.option-tile { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: #fff; text-align: center; transition: border-color 0.14s; }
.option-tile.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }

.media-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #f8fafc; }
.media-card.picked { border-color: var(--blue); border-width: 1.5px; background: #fafcff; }
.media-preview.dark { height: 150px; border-radius: 8px; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; }

/* Slide-over Drawers */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 8000; }
.drawer-backdrop.hidden, .slide-drawer.hidden { display: none; }
.slide-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 440px; max-width: 94vw;
  background: #fff; z-index: 8100;
  box-shadow: -8px 0 30px rgba(15, 23, 42, 0.16);
  display: flex; flex-direction: column;
}
.drawer-head {
  padding: 15px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.drawer-head.dark { background: #1e293b; color: #fff; border-bottom-color: #334155; }
.drawer-title { font-size: 15px; font-weight: 700; }
.drawer-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
.drawer-sec-label { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }

.anno-cards { display: flex; flex-direction: column; gap: 10px; }
.anno-card {
  background: #f8fafc; border: 1px solid var(--border); border-left-width: 4px;
  border-radius: 8px; padding: 10px 12px;
}
.anno-card-head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
.anno-line { font-size: 12px; margin-bottom: 3px; line-height: 1.45; }
.anno-k-step { color: var(--blue-hover); font-weight: 600; }
.anno-k-srs { color: var(--text-muted); }
.anno-k-tech { color: var(--green-text); }

.ledger-list { display: flex; flex-direction: column; gap: 7px; }
.ledger-row { background: #f8fafc; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 12px; }
.ledger-row-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.ledger-term { font-weight: 700; color: var(--text-dark); }
.ledger-kind-srs { color: var(--blue-hover); font-weight: 700; }
.ledger-kind-mock { color: var(--amber-text); font-weight: 700; }
.ledger-src { color: var(--text-muted); }

  if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;

}

function appendAuditLog(state, entry) {
  const rec = {
    time: nowDateTimeStr(),
    actor: state.role,
    target: entry.target || "系统操作",
    action: entry.action || "操作",
    detail: entry.detail || "",
    ok: entry.ok !== false,
    historical: false,
  };
  state.auditLogs.unshift(rec);
  if (state.auditLogs.length > 100) state.auditLogs.length = 100;
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem("crosspilot_audit_v2", JSON.stringify(state.auditLogs));
    }
  } catch {}
  return rec;
}

function getRoleTodos(state) {
  const r = state.role;
  const todos = {};
  const pendTk = state.tickets.filter(t => t.status === "待主管审批").length;
  const pendSel = state.m4Pool.filter(x => x.stage === "已提交待审").length;
  const aiCand = state.m4Pool.filter(x => x.stage === "AI初筛候选").length;
  const missSel = state.m4Pool.filter(x => x.stage === "缺成本/待补全").length;
  const pendRp = state.m6Plans.filter(p => p.status === "待主管审批").length;
  const lowInv = state.inventoryItems.filter(i => i.shopMode === "REAL" && i.avail < i.safety).length;
  const pendCs = state.csSessions.filter(s => s.mode === "PENDING_HUMAN").length;
  const imgMiss = state.m7Images.filter(im => !im.done).length;

  if (r === "approver") {
    if (pendTk) todos.m1c = `待审 ${pendTk}`;
    if (pendSel) todos.m4c = `待拍板 ${pendSel}`;
    if (pendRp) todos.m6c = `待批 ${pendRp}`;
    if (state.m7ComplianceStatus !== "主管已批准导出") todos.m7d = "待把关";
  } else if (r === "manager") {
    todos.m0a = `${state.shops.length} 店`;
    todos.m2b = "大屏";
    todos.m8a = `授权 ${state.employees.length}`;
  } else if (r === "planner") {
    todos.m2a = "设计";
    todos.m5b = "预测";
    todos.m6a = "测算";
  } else if (r === "bi_analyst") {
    todos.m3a = `调度 ${state.qaBindings.length}`;
    todos.m3b = "问数";
    todos.m5c = "WAPE";
  } else if (r === "selector") {
    if (aiCand + missSel) todos.m4b = `初筛 ${aiCand + missSel}`;
  } else if (r === "creator") {
    if (imgMiss) todos.m7b = `缺图 ${imgMiss}`;
    todos.m7d = "交付";
  } else if (r === "warehouse") {
    if (lowInv) todos.m0c = `预警 ${lowInv}`;
    todos.m6d = "收货";
  } else if (r === "cs") {
    if (pendCs) todos.m1a = `接管 ${pendCs}`;
    if (pendTk) todos.m1c = `跟进 ${pendTk}`;
  } else if (r === "mock_buyer") {
    todos.m1d = "测试入口";
  }
  return todos;
}

                    <td class="nowrap"><span class="pill ${o.status==="DELIVERED"?"p-green":o.status==="SHIPPED"?"p-blue":"p-amber"}">${o.status}</span></td>
                    <td>
                      <span class="pill ${o.mode==="REAL"?"p-green":"p-amber"}">${o.mode==="REAL"?"防重已入账 · 计入真实营收":"仅测试演示 · 不计入真实营收"}</span>
                      ${o.historical ? `<span class="pill p-gray" style="margin-left:4px;">历史示例数据</span>` : `<span class="pill p-blue" style="margin-left:4px;">新同步</span>`}
                    </td>
                    <td class="nowrap">
                      <button class="btn btn-sm m0b-ord-btn" data-oid="${o.id}">订单明细</button>
                      ${o.id === "SYN9D-005671" ? `<button class="btn btn-sm btn-primary m0b-jump-cs" data-sid="${o.csSessionId}">去客服会话 →</button>` : ""}
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
            <span style="font-size:12px;color:var(--text-soft);">第 ${state.m0bOrderPage} / ${oTotalPages} 页 · 共 ${filteredOrders.length} 笔订单</span>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm" id="m0bOrdPrev" ${state.m0bOrderPage<=1?"disabled":""}>← 上一页</button>
              <button class="btn btn-sm" id="m0bOrdNext" ${state.m0bOrderPage>=oTotalPages?"disabled":""}>下一页 →</button>
            </div>
          </div>
        </div>
      `,
      bind: () => {
        document.getElementById("m0bSearchInp").oninput = (e) => { state.m0bSearch = e.target.value; rerender(); };
        document.getElementById("m0bTypeSel").onchange = (e) => { state.m0bTypeFilter = e.target.value; rerender(); };
        document.getElementById("m0bOrdShop").onchange = (e) => { state.m0bOrderShopFilter = e.target.value; state.m0bOrderPage = 1; rerender(); };
        document.getElementById("m0bOrdStatus").onchange = (e) => { state.m0bOrderStatusFilter = e.target.value; state.m0bOrderPage = 1; rerender(); };
        document.getElementById("m0bOrdPrev").onclick = () => { state.m0bOrderPage -= 1; rerender(); };
        document.getElementById("m0bOrdNext").onclick = () => { state.m0bOrderPage += 1; rerender(); };

        document.querySelectorAll(".m0b-jump-cs").forEach(b => b.onclick = (e) => {
          e.stopPropagation();
          state.csActiveId = b.dataset.sid || "s1";
          goPage("m1a");
        });

        document.querySelectorAll(".m0b-detail").forEach(b => b.onclick = () => {
          const p = state.masterProducts.find(x => x.sku === b.dataset.sku);
          const stockRows = state.inventoryItems.filter(i => i.sku === p.sku);
          const logs = state.costChangeLogs.filter(c => c.sku === p.sku);
          openDrawer(`${p.sku} · ${p.name}`, `成本卡 ${p.costVer} · 各仓库存与成本变更历史`, `
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <img src="${getProductImg(p.sku)}" class="prod-thumb-lg" alt="${p.name}"/>
              <div class="formula-box" style="flex:1;margin:0;">
                <strong>单件落地成本：</strong>$${p.cost.toFixed(2)}(采购) + $${p.ship.toFixed(2)}(头程) = <strong>$${(p.cost + p.ship).toFixed(2)}</strong>
              </div>
            </div>
            <div class="drawer-sec-label">各店铺独立库存现状：</div>
            ${stockRows.map(s => `
              <div class="anno-card" style="border-left-color:${s.shopMode==="REAL"?"#10b981":"#f59e0b"};margin-bottom:8px;">
                <div><strong>${s.shopName}</strong> <span class="pill ${s.shopMode==="REAL"?"p-green":"p-amber"}">${s.shopMode}</span></div>
                <div style="font-size:12px;margin-top:4px;">店铺商品编号：<code>${s.shopSku}</code> · 存放仓库：<strong>${s.whName}</strong></div>
                <div style="font-size:12px;margin-top:3px;">当前可售：<strong>${s.avail} 件</strong> · 锁定：${s.locked} 件 · 安全线：${s.safety} 件</div>
              </div>
            `).join("")}
            <div class="drawer-sec-label" style="margin-top:12px;">成本卡版本变更留痕：</div>
            ${logs.length ? logs.map(l => `<div class="ledger-row"><strong>${l.ver}</strong> (${l.effective})：${l.oldCost} → ${l.newCost} · 原因：${l.reason} · 审批：${l.approver}</div>`).join("") : '<div style="font-size:12px;color:var(--text-soft);">暂无近期变更</div>'}
            <button class="btn btn-primary btn-sm" id="drGotoInv" style="margin-top:12px;">去 M0-3 分店独立库存中心盘点 →</button>
          `, () => {
            document.getElementById("drGotoInv").onclick = () => { closeDetailDrawer(); goPage("m0c"); };
          });
        });

        document.querySelectorAll(".m0b-cost").forEach(b => b.onclick = () => {
          const p = state.masterProducts.find(x => x.sku === b.dataset.sku);
          const nextVer = "v" + (Number(p.costVer.replace("v", "")) + 1);
          commitAction({
            title: `调整成本卡 · ${p.sku} (${p.costVer} → ${nextVer})`,
            summary: "影响面提示：成本卡版本升级将实时影响 M2 经营利润核算、M3 智能问数毛利、M5 预测参考金额与 M6 补货占用现金测算！",
            confirmText: "提交生效新成本卡",
            fieldsHtml: `
              <div class="grid-2" style="gap:10px;">
                <div class="field"><label>新采购单价 (USD) *</label><input id="cNewCost" type="number" step="0.1" class="input" value="${p.cost}"/></div>
                <div class="field"><label>新头程运费 (USD) *</label><input id="cNewShip" type="number" step="0.1" class="input" value="${p.ship}"/></div>
              </div>
              <div class="field"><label>生效日期 *</label><input id="cEffDate" type="date" class="input" value="${nowDateTimeStr().slice(0,10)}"/></div>
              <div class="field"><label>变更原因说明 *</label><input id="cReason" class="input" placeholder="如：供应商原料调价 / 航运旺季附加费"/></div>
              <div class="field"><label>审批复核人 * (不可与当前操作人同名)</label><input id="cAppr" class="input" value="${state.role==="approver"?"王总":"陈主管"}"/></div>
            `,
            validate: (wrap) => {
              const errs = [];
              const cEl = wrap.querySelector("#cNewCost");
              const sEl = wrap.querySelector("#cNewShip");
              const dEl = wrap.querySelector("#cEffDate");
              const rEl = wrap.querySelector("#cReason");
              const aEl = wrap.querySelector("#cAppr");
              if (!(Number(cEl.value) > 0)) errs.push({ el: cEl, msg: "采购单价必须大于 0" });
              if (Number(sEl.value) < 0 || sEl.value === "") errs.push({ el: sEl, msg: "头程运费不能小于 0" });
              if (!dEl.value) errs.push({ el: dEl, msg: "请选择成本卡生效日期" });
              if (!rEl.value.trim()) errs.push({ el: rEl, msg: "必须填写成本变更原因" });
              if (!aEl.value.trim()) errs.push({ el: aEl, msg: "必须指定复核审批人" });
              return errs;
            },
            onConfirm: (wrap) => {
              const nc = Number(wrap.querySelector("#cNewCost").value);
              const ns = Number(wrap.querySelector("#cNewShip").value);
              const eff = wrap.querySelector("#cEffDate").value;
              const reason = wrap.querySelector("#cReason").value.trim();
              const appr = wrap.querySelector("#cAppr").value.trim();
              const oldCostStr = `$${p.cost.toFixed(2)}+$${p.ship.toFixed(2)}`;
              p.cost = nc; p.ship = ns; p.costVer = nextVer;
              state.costChangeLogs.unshift({
                time: nowDateTimeStr(), sku: p.sku, ver: nextVer,
                oldCost: oldCostStr, newCost: `$${nc.toFixed(2)}+$${ns.toFixed(2)}`,
                effective: eff, reason, approver: appr, historical: false
              });
              return { toastMsg: `${p.sku} 成本卡已升级至 ${nextVer}（M2/M6 资金测算已联动）` };
            },
            audit: (wrap) => ({
              target: `M0-2 成本卡 · ${p.sku}`,
              action: `升级成本卡至 ${nextVer}`,
              detail: `原因：${wrap.querySelector("#cReason").value.trim()} · 复核人：${wrap.querySelector("#cAppr").value.trim()}`,
              ok: true
            })
          });
        });

        const openOrderDetail = (oid) => {
          const o = state.orders.find(x => x.id === oid);
          if (!o) return;
          const nextStatus = o.status === "PAID" ? "SHIPPED" : o.status === "SHIPPED" ? "DELIVERED" : null;
          openDrawer(`订单明细 · ${o.id}`, `${o.shopName} · ${o.mode}`, `
            <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
              <div>当前状态：<span class="pill ${o.status==="DELIVERED"?"p-green":o.status==="SHIPPED"?"p-blue":"p-amber"}">${o.status}</span></div>
              <div>买家昵称：<strong>${o.buyer}</strong></div>
              <div>购买商品：<strong>${o.sku} × ${o.qty} 件</strong></div>
              <div>实付金额：<strong>${o.currency} ${o.amount} (≈ $${o.amountUsd.toFixed(2)})</strong></div>
              <div>下单时间：<strong>${o.time}</strong></div>
              <div>数据口径：<strong>${o.note}</strong></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${nextStatus ? `<button class="btn btn-primary btn-sm" id="advOrderBtn">推进订单状态 → ${nextStatus}</button>` : `<span class="pill p-green">已完结妥投 (DELIVERED) ✓</span>`}
              ${o.id === "SYN9D-005671" ? `<button class="btn btn-sm" id="ordToCsBtn">跳至 M1-1 关联客服会话 →</button>` : ""}
            </div>
          `, () => {
            const adv = document.getElementById("advOrderBtn");
            if (adv) adv.onclick = () => {
              commitAction({
                title: `推进订单状态 · ${o.id}`,
                summary: `确认将订单状态从 ${o.status} 推进至 ${nextStatus} 并记录状态变更时间？`,
                confirmText: `确认改为 ${nextStatus}`,
                onConfirm: () => {
                  const old = o.status;
                  o.status = nextStatus;
                  closeDetailDrawer();
                  return { toastMsg: `订单 ${o.id} 已推进为 ${nextStatus}（原 ${old}）` };
                },
                audit: { target: `M0-2 订单 ${o.id}`, action: "订单状态机推进", detail: `${o.status} → ${nextStatus}`, ok: true }
              });
            };
            const tc = document.getElementById("ordToCsBtn");
            if (tc) tc.onclick = () => { closeDetailDrawer(); state.csActiveId = "s1"; goPage("m1a"); };
          });
        };

        document.querySelectorAll(".m0b-ord-row").forEach(r => r.onclick = () => openOrderDetail(r.dataset.oid));
        document.querySelectorAll(".m0b-ord-btn").forEach(b => b.onclick = (e) => { e.stopPropagation(); openOrderDetail(b.dataset.oid); });
      }
    };
  }

  // ==================== M0c: Store×Warehouse Independent Stock Center ====================
  if (pageId === "m0c") {
    const canEditStock = state.role === "warehouse" || state.role === "manager";
    const q = state.m0cSearch.toLowerCase();
    const filtered = state.inventoryItems.filter(i =>
      (state.m0cShopFilter === "ALL" || i.shopId === state.m0cShopFilter) &&
      (!q || i.sku.toLowerCase().includes(q) || i.name.toLowerCase().includes(q) || i.whName.toLowerCase().includes(q))
    );
    const realLowCount = state.inventoryItems.filter(i => i.shopMode === "REAL" && i.avail < i.safety).length;

    return {
      headerActions: [
        { label: "去 M6 智能补货测算 →", primary: false, onClick: () => goPage("m6b") },
        {
          label: "同步全部实盘仓库存", primary: true,
          disabled: !canEditStock,
          disabledTitle: "需「采购/仓库/物流人员」或「管理者」权限 — 请在左上角切换角色",
          onClick: () => {
            if (!canEditStock) { record403("M0-3 同步库存", "无仓储权限"); return; }
            runAsyncTask("m0_inv_sync", {
              label: "双仓实时库存快照同步",
              steps: ["连接美国美西/美东与泰国曼谷仓", "校验锁定库存与安全库存线", "更新 M5/M6 缺口基准"],
              durationMs: 950,
              onSuccess: () => {
                state.stockSyncedAt = nowDateTimeStr();
                state.stockSyncedTs = Date.now();
                state.inventoryItems.forEach(i => { if (i.shopMode === "REAL") i.updated = nowTimeStr(); });
                return { summary: "双仓 5 条实盘记录已校准", toastMsg: `实盘仓库存同步完成 (${state.stockSyncedAt})` };
              }
            });
          }
        }
      ],
      html: `
        <div class="banner banner-amber">
          <span><strong>实际存放仓库说明：</strong>同款商品在不同海外仓/本地仓（如「美国美西海外仓」与「泰国曼谷本地仓」）<strong>物理隔离、独立计数</strong>；M6 采购收货凭证绝不自动改写本表库存，必须由仓管在此盘点校准。</span>
          <span class="pill p-amber">最近同步：${state.stockSyncedTs ? `${state.stockSyncedAt} (${relTimeLabel(state.stockSyncedTs)})` : state.stockSyncedAt}</span>
        </div>
        ${renderAsyncBox("m0_inv_sync")}

        <div class="grid-4">
          <div class="kpi-card highlight-blue">
            <div class="kpi-label">分店×仓 SKU 总条目</div>
            <div class="kpi-val" style="color:var(--blue-hover)">${state.inventoryItems.length} 条</div>
            <div class="kpi-sub">实盘 5 条 · MOCK 演示 1 条</div>
          </div>
          <div class="kpi-card highlight-amber">
            <div class="kpi-label">实盘低库存预警</div>
            <div class="kpi-val" style="color:var(--red-text)">${realLowCount} 项</div>
            <div class="kpi-sub">可售 &lt; 安全库存，建议去 M6 补货</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">一货多店示例 (BAG-108)</div>
            <div class="kpi-val" style="font-size:20px;">美仓 ${state.inventoryItems.find(x=>x.id==="inv1").avail} / 泰仓 ${state.inventoryItems.find(x=>x.id==="inv2").avail}</div>
            <div class="kpi-sub">M5 建议补货实时联动重算</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">当前角色库存权限</div>
            <div class="kpi-val" style="font-size:18px;color:${canEditStock?"var(--green-text)":"var(--text-soft)"}">${canEditStock?"可同步/盘点 ✓":"仅只读查看"}</div>
            <div class="kpi-sub">${canEditStock?"盘点改数将直接重算 M5/M6 缺口":"需仓库/管理者权限(左上角可切)"}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><span class="anno-tag t-green">2</span> 按「店铺 × 实际存放仓库」管理库存（盘点改数后实时联动 M5/M6 补货缺口）</div>
          </div>

          <div class="utabs" style="margin-bottom:12px;">
            <div class="utab ${state.m0cShopFilter==="ALL"?"active":""} m0c-tab" data-sh="ALL">全部店铺 <span class="utab-cnt">${state.inventoryItems.length}</span></div>
            ${state.shops.map(s => {
              const cnt = state.inventoryItems.filter(i => i.shopId === s.id).length;
              return `<div class="utab ${state.m0cShopFilter===s.id?"active":""} m0c-tab" data-sh="${s.id}">${s.name} (${s.mode}) <span class="utab-cnt">${cnt}</span></div>`;
            }).join("")}
          </div>

          <div class="filter-bar" style="margin-bottom:12px;">
            <div class="filter-item" style="max-width:380px;">
              <input id="m0cSearchInp" class="input" placeholder="搜索 SKU / 品名 / 仓库名称 (如 美国美西海外仓)…" value="${state.m0cSearch}"/>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead><tr><th>商品主 SKU & 品名</th><th>在售店铺 (模式)</th><th>实际存放仓库</th><th>当前可售</th><th>已锁定</th><th>安全库存</th><th>水位状态</th><th>操作</th></tr></thead>
              <tbody>
                ${filtered.map(item => {
                  const isLow = item.avail < item.safety;
                  return `
                    <tr>
                      <td><strong>${item.sku} · ${item.name}</strong><div style="font-size:12px;color:var(--text-soft)">店铺编号：<code>${item.shopSku}</code> · ${item.note}</div></td>
                      <td class="nowrap">${item.shopName} <span class="pill ${item.shopMode==="REAL"?"p-green":"p-amber"}">${item.shopMode}</span></td>
                      <td class="nowrap"><strong>${item.whName || WAREHOUSE_LABELS[item.wh] || item.wh}</strong></td>
                      <td class="nowrap"><strong style="font-size:15px;color:${isLow?"var(--red-text)":"var(--text-dark)"}">${item.avail} 件</strong></td>
                      <td class="nowrap">${item.locked} 件</td>
                      <td class="nowrap">${item.safety} 件</td>
                      <td class="nowrap">
                        ${item.shopMode === "MOCK"
                          ? '<span class="pill p-gray">仅演示·不计实仓</span>'
                          : isLow ? '<span class="pill p-red">低库存预警</span>' : '<span class="pill p-green">库存充足</span>'}
                      </td>
                      <td class="nowrap">
                        <button class="btn btn-sm m0c-edit" data-id="${item.id}" ${!canEditStock?"disabled":""} title="${!canEditStock?"需采购/仓库/物流或管理者权限":""}">盘点改数</button>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">🧾 盘点校准单留痕（M0-3 独立盘点记录）</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>盘点单号</th><th>SKU · 存放仓库</th><th>盘点前 → 盘点后</th><th>差异原因</th><th>经办人</th><th>时间</th></tr></thead>
              <tbody>
                ${state.stocktakes.map(st => `
                  <tr>
                    <td class="nowrap"><strong>${st.id}</strong> ${st.historical?'<span class="pill p-gray">历史示例</span>':'<span class="pill p-green">新单</span>'}</td>
                    <td>${st.sku} · ${st.whName}</td>
                    <td class="nowrap">${st.oldQty} 件 → <strong>${st.newQty} 件</strong></td>
                    <td>${st.reason}</td>
                    <td class="nowrap">${st.actor}</td>
                    <td class="nowrap">${st.time}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        document.querySelectorAll(".m0c-tab").forEach(t => t.onclick = () => { state.m0cShopFilter = t.dataset.sh; rerender(); });
        document.getElementById("m0cSearchInp").oninput = (e) => { state.m0cSearch = e.target.value; rerender(); };
        document.querySelectorAll(".m0c-edit").forEach(b => b.onclick = () => {
          const item = state.inventoryItems.find(x => x.id === b.dataset.id);
          const pdId = genDocId("PD");
          commitAction({
            title: `人工盘点校准 · ${item.sku} (${item.whName})`,
            summary: `生成盘点单号 <strong>${pdId}</strong>；保存后将实时重算 M5 建议补货参考量、M6 补货缺口与库存覆盖天数！`,
            confirmText: "确认写入盘点单并联动 M5/M6",
            fieldsHtml: `
              <div class="grid-2" style="gap:10px;">
                <div class="field"><label>当前系统可售 (件)</label><input class="input" readonly value="${item.avail}"/></div>
                <div class="field"><label>最新实盘可售 (件, ≥0) *</label><input id="invNewQty" type="number" class="input" value="${item.avail}"/></div>
              </div>
              <div class="field"><label>安全库存预警线 (件, ≥0) *</label><input id="invNewSafe" type="number" class="input" value="${item.safety}"/></div>
              <div class="field"><label>盘点差异原因 * (若变动幅度 ≥ 30% 将触发大额差异提示)</label><input id="invReason" class="input" value="日常循环盘点校准同步"/></div>
              <div id="invWarnBox"></div>
            `,
            onMount: (wrap) => {
              const qEl = wrap.querySelector("#invNewQty");
              const warn = wrap.querySelector("#invWarnBox");
              const checkDiff = () => {
                const v = Number(qEl.value);
                if (v < 0) warn.innerHTML = `<div class="banner banner-red">❌ 可售库存禁止设为负数！</div>`;
                else if (item.avail > 0 && Math.abs(v - item.avail) / item.avail >= 0.3) {
                  warn.innerHTML = `<div class="banner banner-amber">⚠️ 注意：本次盘点变动幅度超过 30%（${item.avail} → ${v}），请务必核实实物与原因后再确认！</div>`;
                } else warn.innerHTML = "";
              };
              qEl.oninput = checkDiff;
              checkDiff();
            },
            validate: (wrap) => {
              const errs = [];
              const qEl = wrap.querySelector("#invNewQty");
              const sEl = wrap.querySelector("#invNewSafe");
              const rEl = wrap.querySelector("#invReason");
              if (qEl.value === "" || Number(qEl.value) < 0) errs.push({ el: qEl, msg: "实盘可售库存必须为 ≥ 0 的整数" });

  // ==================== M1c: After-sales Tickets & SoD Approval + Voucher Backfill ====================
  if (pageId === "m1c") {

              ${t.approver ? `<div>审批人：<strong>${t.approver}</strong> · 意见：${t.approveNote}</div>` : ""}

  // ==================== M2a: BI Designer (Draft vs Published Dual Versions) ====================

    return {

              title: `回滚发布版至 ${last.ver}`,

  // ==================== M2b: Published BI Dashboard ====================
  if (pageId === "m2b") {

  // ==================== M3a: QA Metrics & Celery Sync ====================
  if (pageId === "m3a") {

          <div class="grid-4">

          <div id="m3FormErr"></div>
          <button class="btn btn-primary btn-sm" id="addMetricBtn" ${!canMaintain?"disabled":""} title="${!canMaintain?"需 BI/运营/管理者权限":""}">校验并创建指标绑定</button>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">数据绑定与调度台账（展示上次/下次执行时间与失败重试）</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>绑定 / 指标</th><th>接口类型</th><th>平台</th><th>周期</th><th>上次 / 下次执行</th><th>最新数据 / 状态</th><th>操作</th></tr></thead>
              <tbody>
                ${state.qaBindings.map((b, i) => `
                  <tr>
                    <td><strong>${b.name}</strong>${b.url ? `<div style="font-size:12px;color:var(--text-soft);"><code>${b.url}</code></div>` : ""}</td>
                    <td class="nowrap"><span class="pill p-blue">${b.kind}</span></td>
                    <td class="nowrap">${b.platform}</td>
                    <td class="nowrap">${b.cron}</td>
                    <td class="nowrap" style="font-size:12px;">上次：${b.lastRun}<br/>下次：${b.nextRun}</td>
                    <td><strong>${b.val}</strong><div style="margin-top:2px;"><span class="pill ${b.status.includes("未连接")||b.status.includes("FAILED")?"p-red":"p-green"}">${b.status}</span></div></td>
                    <td class="nowrap"><button class="btn btn-sm run-sync-btn" data-i="${i}" ${!canMaintain?"disabled":""}>▶ 立即触发</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        document.getElementById("addMetricBtn").onclick = () => {
          const errBox = document.getElementById("m3FormErr");
          errBox.innerHTML = "";
          const code = document.getElementById("m3Code").value.trim();
          const name = document.getElementById("m3Name").value.trim();
          const kind = document.getElementById("m3Kind").value;
          const url = document.getElementById("m3Url").value.trim();

          if (!/^[a-z][a-z0-9_]{1,30}$/.test(code)) {
            errBox.innerHTML = `<div class="field-err" style="margin-bottom:8px;">指标代码格式错误：须小写字母开头，仅含字母/数字/下划线</div>`;
            return;
          }
          if (state.qaBindings.some(b => b.code === code)) {
            errBox.innerHTML = `<div class="field-err" style="margin-bottom:8px;">指标代码 <code>${code}</code> 已存在，违反唯一性约束！</div>`;
            return;
          }
          if (!name) {
            errBox.innerHTML = `<div class="field-err" style="margin-bottom:8px;">请填写指标中文名称</div>`;
            return;
          }
          if (kind === "REST API" && (!/^https?:\/\/.+/.test(url) || !url.includes("{platform}"))) {
            errBox.innerHTML = `<div class="field-err" style="margin-bottom:8px;">REST API 模式下 URL 须以 http(s):// 开头且包含 <code>{platform}</code> 占位符！</div>`;
            return;
          }

          commitAction({
            title: `新增指标绑定 · ${name} (${code})`,
            summary: kind === "REST API" ? "将写入 REST 调度绑定；因当前未连接后端 METRIC_REST_BASE_URL，初始状态将标为未连接模拟态。" : "将写入内置汇总调度队列。",
            confirmText: "保存绑定",
            onConfirm: () => {
              state.qaBindings.unshift({
                code, name: `${name} (${code})`, kind, platform: "全部平台", cron: "每15分钟",
                val: kind === "REST API" ? "—" : "3.42%",
                status: kind === "REST API" ? "未连接后端 REST" : "SUCCESS (演示)",
                lastRun: nowTimeStr(), nextRun: "15分钟后", url
              });
              return { toastMsg: `已创建指标绑定：${name}` };
            },
            audit: { target: `M3-1 指标 ${code}`, action: "新增指标绑定", detail: `${kind} · ${name}`, ok: true }
          });
        };

        document.querySelectorAll(".run-sync-btn").forEach(b => b.onclick = () => {
          const item = state.qaBindings[Number(b.dataset.i)];
          const isRestFail = item.kind === "REST API" && !API_BASE;
          runAsyncTask("m3_sync", {
            label: `调度拉取 · ${item.name}`,
            steps: ["检查调度锁与鉴权配置", "拉取数据并校验 JSON 路径", "写入 metric_snapshots"],
            durationMs: 950,
            shouldFail: isRestFail,
            failReason: `未配置后端 METRIC_REST_BASE_URL，无法请求真实 REST 接口 (${item.url})`,
            onFail: () => { item.status = "FAILED：未连接服务"; item.lastRun = nowTimeStr(); },
            onSuccess: () => {
              item.lastRun = nowTimeStr();
              item.status = "SUCCESS (演示)";
              return { summary: `同步成功 (${item.val})`, toastMsg: `${item.name} 演示快照刷新成功` };
            }
          });
        });
      }
    };
  }

  // ==================== M3b: QA Chat (Real State-Computed Answers + Multi-turn Context) ====================
  if (pageId === "m3b") {
    const stats = computeLiveBusinessStats();
    const runQuery = (q) => {
      if (!q.trim()) return;
      state.qaChat.push({ role: "user", text: q });
      const latency = 18 + Math.floor(Math.random() * 42);

      runAsyncTask("m3_qa", {
        label: "只读问数解析与 SQL 校验",
        steps: ["parse_question() 识别意图与多轮上下文", "SQL AST 只读白名单守卫", "读取当前内存实时数据计算"],
        durationMs: 650,
        onSuccess: () => {
          if (/update|delete|drop|insert|alter|修改|删除/i.test(q)) {
            state.qaChat.push({
              role: "assistant", blocked: true,
              text: "拦截提示：智能问数仅支持只读 SELECT 查询，已拦截并拒绝写入/修改操作！",
              sql: "AUDIT: 写操作拦截事件已写入 rbac_audit_logs"
            });
            appendAuditLog(state, { target: "M3-2 SQL 守卫", action: "拦截写操作 SQL", detail: q, ok: false });
            return { summary: "已安全拦截写操作", toastMsg: "触发只读守卫，已拒绝写操作", toastLevel: "warn" };
          }

          // Multi-turn context inheritance
          const prevUser = [...state.qaChat].reverse().find((m, i) => i > 0 && m.role === "user")?.text || "";
          const ctxStock = /美国|美仓|泰国|泰仓|其中/.test(q) && /库存|缺货/.test(prevUser);

          if (/库存|缺货/.test(q) || ctxStock) {
            const scopeFilter = /美国|美仓/.test(q) ? "shop_us" : /泰国|泰仓/.test(q) ? "shop_th" : null;
            const list = state.inventoryItems.filter(i => i.shopMode === "REAL" && (!scopeFilter || i.shopId === scopeFilter));
            const lows = list.filter(i => i.avail < i.safety);
            const scopeTitle = scopeFilter === "shop_us" ? "美国仓" : scopeFilter === "shop_th" ? "泰国仓" : "全部实盘仓";
            state.qaChat.push({
              role: "assistant",
              text: `${scopeTitle}共追踪 ${list.length} 条实盘库存（已排除 MOCK 店），其中低库存预警 ${lows.length} 项：` +
                (lows.length ? lows.map(l => `${l.whName} ${l.sku}(可售 ${l.avail} < 安全线 ${l.safety})`).join("；") : "暂无低库存预警。"),
              note: "实时数据源：直接从 M0-3 当前内存库存表计算（改盘点数字后再次提问即变）",
              sql: `SELECT wh_name, sku, avail, safety FROM inventory_positions WHERE mode='REAL'${scopeFilter?` AND shop_id='${scopeFilter}'`:""} [${latency}ms]`,
              feedback: null
            });
          } else if (/广告|ad_spend|acos/i.test(q)) {
            state.qaChat.push({
              role: "assistant",
              text: `近 30 天实盘广告花费为 $${stats.adSpend.toLocaleString()}，结合当前实时 GMV $${stats.gmv.toLocaleString()}，实时 ACOS = ${stats.acosPct}%（Amazon 近 7 天花费 $2,933.63）。`,
              note: "口径：M0 实盘订单汇总 + 广告快照（多币种分列不混加）",
              sql: `SELECT SUM(ad_spend_usd), SUM(ad_spend_usd)/${stats.gmv} AS acos FROM metric_snapshots [${latency}ms]`,
              feedback: null

const M4_MODES = {
  balanced: { label: "⚖️ 综合均衡推荐", wRev: 0.50, wTrend: 0.40, wMargin: 0.10, desc: "兼顾8周体量、增长斜率与毛利安全（默认推荐视角）" },
  revenue:  { label: "💰 规模创收优先", wRev: 0.70, wTrend: 0.20, wMargin: 0.10, desc: "优先挑8周净收入高、销量盘子稳的现金流主力款" },
  growth:   { label: "📈 高增趋势优先", wRev: 0.25, wTrend: 0.65, wMargin: 0.10, desc: "优先挑后4周增速斜率爆发快的黑马潜力款" },
};

function calcM4NetSales(x) { return x.paidQty - x.refundQty; }
function calcM4NetRev(x) { return +(x.grossRev - x.discount - x.refundAmt).toFixed(2); }
function calcM4Score(x, maxRev, mode = "balanced") {
  const cfg = M4_MODES[mode] || M4_MODES.balanced;
  const revNorm = Math.min(100, (calcM4NetRev(x) / maxRev) * 100);
  const trendNorm = Math.max(0, Math.min(100, (x.trend + 20) * 1.3));
  if (x.marginKnown && x.margin !== null) {
    const mNorm = Math.min(100, x.margin * 4);
    const sc = cfg.wRev * revNorm + cfg.wTrend * trendNorm + cfg.wMargin * mNorm;
    return {
      num: sc,
      score: sc.toFixed(1),
      formula: `${cfg.wRev}×${revNorm.toFixed(0)} + ${cfg.wTrend}×${trendNorm.toFixed(0)} + ${cfg.wMargin}×${mNorm.toFixed(0)} = ${sc.toFixed(1)}`
    };
  }
  const denom = cfg.wRev + cfg.wTrend;
  const wR = cfg.wRev / denom, wT = cfg.wTrend / denom;
  const sc = wR * revNorm + wT * trendNorm;
  return {
    num: sc,
    score: sc.toFixed(1),
    formula: `缺利润率重归一：${wR.toFixed(3)}×${revNorm.toFixed(0)} + ${wT.toFixed(3)}×${trendNorm.toFixed(0)} = ${sc.toFixed(1)}`
  };
}

function runLocalForecastAlgo(history96, modelName, horizon) {
  const recent28 = history96.slice(-28);
  const recent7 = history96.slice(-7);
  const avg28 = recent28.reduce((a, b) => a + b, 0) / recent28.length;
  const avg7 = recent7.reduce((a, b) => a + b, 0) / recent7.length;
  const slope = (avg7 - avg28) / Math.max(1, avg28);

  const isTree = /CatBoost|LightGBM/i.test(modelName);
  const isInter = /Croston|TSB/i.test(modelName);
  const isStat = /Holt|Prophet|SARIMA/i.test(modelName);

  const out = [];
  for (let d = 0; d < 7; d++) {
    const weekdayBoost = (d === 3 || d === 5) ? 1.16 : (d === 2 ? 0.88 : 1.0);
    let val = avg7 * (1 + slope * 0.25 * (d + 1) / 7);
    if (isTree) val *= weekdayBoost * 1.04;
    else if (isInter) val = avg28 * 0.92 + (d % 2 === 0 ? 6 : -4);
    else if (isStat) val *= (1 + 0.06 * Math.sin(d));
    else val *= 0.98 * weekdayBoost;
    if (horizon === 14) val *= 1.03;
    if (horizon === 30) val *= 1.06;
    out.push(Math.max(8, Math.round(val)));
  }
  return out;
}
