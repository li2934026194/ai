<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPilot · AI跨境电商平台交互原型（SRS V6对齐版）</title>
  <style>
:root {
  --bg-outer: #eef2f7;
  --bg-app: #f6f8fc;
  --bg-card: #ffffff;
  --border: #dce3ee;
  --border-strong: #cbd5e1;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-light: #eff6ff;
  --blue-border: #93c5fd;
  --text-dark: #0f172a;
  --text-muted: #475569;
  --text-soft: #64748b;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --green-text: #047857;
  --amber: #f59e0b;
  --amber-bg: #fffbeb;
  --amber-text: #b45309;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-text: #b91c1c;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --purple-text: #5b21b6;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg-outer);
  color: var(--text-dark);
  font-size: 13.5px;
  line-height: 1.5;
}

.shell {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  border-right: 1px solid #1e293b;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 14px;
  border-bottom: 1px solid #1e293b;
}
.brand-logo {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.brand-name { font-size: 16px; font-weight: 700; color: #fff; }
.brand-sub { font-size: 11px; color: #94a3b8; }

.role-box {
  margin: 12px 0;
  padding: 10px;
  background: #1e293b;
  border-radius: 8px;
  border: 1px solid #334155;
}
.role-label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
.role-select {
  width: 100%;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid #475569;
  background: #0f172a;
  color: #f8fafc;
  font-size: 12px;
  cursor: pointer;
}
.role-hint { margin-top: 6px; font-size: 11px; color: #93c5fd; line-height: 1.35; }

.nav-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  margin-top: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 13px;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.nav-item:hover { background: #1e293b; color: #fff; }
.nav-item.active {
  background: var(--blue);
  color: #fff;
  font-weight: 600;
}
.nav-badge {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.14);
  color: #e2e8f0;
}

.sidebar-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #1e293b;
  font-size: 11px;
  color: #64748b;
  line-height: 1.5;
}

/* Main */
.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 18px;
  gap: 12px;
}

.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.breadcrumb { font-size: 11.5px; font-weight: 700; color: var(--text-soft); letter-spacing: 0.4px; }
.page-title { margin: 2px 0 4px; font-size: 20px; font-weight: 700; color: var(--text-dark); }
.page-subtitle { margin: 0; font-size: 12.5px; color: var(--text-muted); }

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.header-action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Sub-page Tab Buttons */
.subnav-bar {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.subnav-label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
.subnav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav-btn {
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.subnav-btn:hover { border-color: var(--blue); color: var(--blue); }
.subnav-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(37,99,235,0.22);
}

/* Workspace Grid */
.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 14px;
  align-items: start;
}
.workspace-grid.anno-hidden {
  grid-template-columns: minmax(0, 1fr);
}
.workspace-grid.anno-hidden .anno-panel { display: none; }

.page-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

/* Cards & Grids */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.card-blue { border-color: var(--blue-border); }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.card-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}
.anno-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.t-blue { background: var(--blue); }
.t-green { background: var(--green); }
.t-purple { background: var(--purple); }
.t-amber { background: var(--amber); }
.t-red { background: var(--red); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.split-left-form { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 14px; align-items: start; }
.split-3col-cs { display: grid; grid-template-columns: 240px minmax(0, 1fr) 265px; gap: 12px; align-items: stretch; }
.split-bi { display: grid; grid-template-columns: 200px minmax(0, 1fr) 240px; gap: 12px; align-items: stretch; }

@media (max-width: 1280px) {
  .workspace-grid { grid-template-columns: minmax(0, 1fr); }
  .split-3col-cs, .split-bi, .split-left-form { grid-template-columns: 1fr; }
}

/* KPI & Banners */
.kpi-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px 15px;
}
.kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.kpi-val { font-size: 23px; font-weight: 800; margin: 5px 0 3px; }
.kpi-sub { font-size: 11.5px; color: var(--text-soft); }

.banner {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.banner-amber { background: var(--amber-bg); border: 1px solid var(--amber); color: var(--amber-text); }
.banner-red { background: var(--red-bg); border: 1px solid var(--red); color: var(--red-text); }
.banner-blue { background: var(--blue-light); border: 1px solid var(--blue-border); color: var(--blue-hover); }
.banner-green { background: var(--green-bg); border: 1px solid var(--green); color: var(--green-text); }

/* Buttons & Pills */
.btn {
  padding: 7px 14px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all 0.14s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.48; cursor: not-allowed; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--blue-hover); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-danger { background: var(--red-bg); border-color: var(--red); color: var(--red-text); }
.btn-sm { padding: 4px 10px; font-size: 11.8px; }
.btn-anno-toggle { background: #1e293b; border-color: #1e293b; color: #f8fafc; }
.btn-anno-toggle:hover { background: #334155; color: #fff !important; border-color: #334155 !important; }

.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.2px;
  font-weight: 600;
}
.p-green { background: var(--green-bg); color: var(--green-text); }
.p-blue { background: var(--blue-light); color: var(--blue-hover); }
.p-amber { background: var(--amber-bg); color: var(--amber-text); }
.p-red { background: var(--red-bg); color: var(--red-text); }
.p-purple { background: var(--purple-bg); color: var(--purple-text); }
.p-gray { background: #f1f5f9; color: var(--text-soft); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left;
  padding: 9px 10px;
  background: #f8fafc;
  color: var(--text-soft);
  font-weight: 700;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 10px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--text-dark);
  vertical-align: middle;
}
tr:hover td { background: #fafcff; }

/* Inputs */
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 11.8px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 12.5px;
  font-family: inherit;
}
.textarea { min-height: 70px; resize: vertical; }

/* Stepper */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stepper-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.step-item {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}
.step-item.active {
  background: var(--blue-light);
  border-color: var(--blue);
  color: var(--blue-hover);
}
.step-item.done {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/* CS Specific */
.session-item {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
  cursor: pointer;
  background: #fff;
}
.session-item.active { background: var(--blue-light); border-color: var(--blue); }
.chat-bubble {
  padding: 10px 12px;
  border-radius: 8px;
  background: #f1f5f9;
  margin-bottom: 8px;
}
.chat-bubble.user { background: var(--blue); color: #fff; margin-left: auto; max-width: 78%; }
.chat-bubble.assistant { background: #f8fafc; border: 1px solid var(--border); max-width: 88%; }
.chat-trans { font-size: 11.5px; color: var(--text-soft); margin-top: 4px; }

/* M7 Asset Cards */
.option-tile {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: #fff;
}
.option-tile.active {
  background: var(--blue-light);
  border-color: var(--blue);
}
.media-card {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  background: #f8fafc;
}
.media-card.picked { border-color: var(--blue); border-width: 1.6px; background: #fafcff; }
.media-preview {
  height: 150px;
  border-radius: 7px;
  background: #fff;
  border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  overflow: hidden;
}
.media-preview.dark { background: #0f172a; color: #fff; border-color: #334155; flex-direction: column; gap: 6px; }

/* Right Annotation Panel */
.anno-panel {
  background: #fafcff;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
  position: sticky;
  top: 12px;
}
.anno-header {
  background: #1e293b;
  color: #fff;
  padding: 12px 14px;
}
.anno-title { font-size: 14px; font-weight: 700; }
.anno-sub { font-size: 11.5px; color: #cbd5e1; margin-top: 2px; }
.anno-cards {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.anno-card {
  background: #fff;
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  padding: 10px 12px;
}
.anno-card-head { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.anno-line { font-size: 11.8px; margin-bottom: 4px; line-height: 1.45; }
.anno-k-step { color: var(--blue-hover); font-weight: 600; }
.anno-k-srs { color: var(--text-muted); }
.anno-k-tech { color: var(--green-text); }

/* Bottom Provenance Ledger */
.ledger-panel {
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
}
.ledger-panel.hidden { display: none; }
.ledger-header {
  background: #f1f5f9;
  padding: 9px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.ledger-note { font-size: 11.8px; color: var(--text-muted); }
.ledger-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
}
@media (max-width: 960px) { .ledger-grid { grid-template-columns: 1fr; } }
.ledger-row {
  background: #fff;
  padding: 7px 12px;
  display: grid;
  grid-template-columns: 150px 86px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  font-size: 11.8px;
}
.ledger-term { font-weight: 700; color: var(--text-dark); }
.ledger-kind-srs { color: var(--blue-hover); font-weight: 700; }
.ledger-kind-mock { color: var(--amber-text); font-weight: 700; }
.ledger-src { color: var(--text-muted); }

/* Toast & Modal */
.toast-container {
  position: fixed; bottom: 18px; right: 18px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: #0f172a; color: #fff;
  padding: 10px 14px; border-radius: 8px; font-size: 12.5px;
  box-shadow: 0 8px 20px rgba(15,23,42,0.22);
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 9000;
  padding: 16px;
}
.modal-box {
  background: #fff; border-radius: 12px; max-width: 560px; width: 100%;
  padding: 18px 20px; box-shadow: 0 20px 40px rgba(15,23,42,0.25);
}

</style>
</head>
<body>
  <div id="app" class="shell">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">CP</div>
        <div>
          <div class="brand-name">CrossPilot</div>
          <div class="brand-sub">AI跨境电商 · V6交互原型</div>
        </div>
      </div>

      <div class="role-box">
        <label class="role-label">当前演示角色 (6角色RBAC)</label>
        <select id="roleSelect" class="role-select">
          <option value="planner">planner · 运营/选品/补货专员</option>
          <option value="approver">approver · 主管/财务审批人</option>
          <option value="warehouse">warehouse · 仓管/履约专员</option>
          <option value="viewer">viewer · 只读观察员</option>
          <option value="auditor">auditor · 合规审计员</option>
          <option value="admin">admin · 系统管理员</option>
        </select>
        <div id="roleHint" class="role-hint"></div>
      </div>

      <nav id="sidebarNav" class="nav-list"></nav>

      <div class="sidebar-footer">
        <div>对齐文档：SRS V1.0 + 1→2→3通俗版</div>
        <div>§0.3 示例数值与规则常量已明确标注</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrap">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <div id="breadcrumb" class="breadcrumb">CROSSPILOT</div>
          <h1 id="pageTitle" class="page-title">加载中...</h1>
          <p id="pageSubtitle" class="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <div id="headerActions" class="header-action-btns"></div>
          <button id="toggleAnnoBtn" class="btn btn-anno-toggle" title="展开或收起右侧SRS注释与底部来源台账">
            📖 SRS注释与来源台账：<span id="annoStateText">已展开</span>
          </button>
        </div>
      </header>

      <!-- Sub-page Navigation Buttons -->
      <div class="subnav-bar">
        <span class="subnav-label">页面切换按钮：</span>
        <div id="subnavButtons" class="subnav-buttons"></div>
      </div>

      <!-- Workspace Body: Main Page + Optional Annotation Drawer -->
      <div class="workspace-grid" id="workspaceGrid">
        <main id="pageBody" class="page-body"></main>

        <aside id="annoPanel" class="anno-panel">
          <div class="anno-header">
            <div class="anno-title" id="annoPageTitle">功能块注释</div>
            <div class="anno-sub" id="annoPageSub">1→2→3 对应 · SRS依据 · 技术支撑</div>
          </div>
          <div id="annoCards" class="anno-cards"></div>
        </aside>
      </div>

      <!-- Bottom Word/Number Provenance Ledger -->
      <section id="ledgerPanel" class="ledger-panel">
        <div class="ledger-header">
          <strong>本页文字与数字来源台账</strong>
          <span class="ledger-note">严格区分：SRS规则 / 代码常量 vs §0.3 Mock / 老师原型示例展示值</span>
        </div>
        <div id="ledgerGrid" class="ledger-grid"></div>
      </section>
    </div>
  </div>

  <!-- Toast & Modal container -->
  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script>
const MODULE_DEFS = [
  {
    id: "m0",

    badge: "2页",
    pages: [
      { id: "m0a", label: "店铺与主数据" },

      { id: "m1b", label: "推荐商品库" },
      { id: "m1d", label: "模拟买家入口" },
      { id: "m1c", label: "售后工单审批" },

  },
  {

    label: "M2 驾驶舱设计",
    badge: "2页",
    pages: [
      { id: "m2a", label: "低代码设计工作台" },
      { id: "m2b", label: "已发布经营大屏" },
    ],
  },
  {
    id: "m3",
    label: "M3 智能问数 Agent",
    badge: "2页",
    pages: [
      { id: "m3a", label: "指标管理与调度" },
      { id: "m3b", label: "经营智能问答" },
    ],
  },
  {

      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:16px;">${title}</strong>
          <button class="btn btn-sm" id="modalCloseBtn">✕</button>
        </div>
        <div>${bodyHtml}</div>
      </div>
    </div>
  `;
  document.getElementById("modalCloseBtn").onclick = closeModal;
  document.getElementById("modalBd").onclick = (e) => { if (e.target.id === "modalBd") closeModal(); };
  if (onMount) onMount();
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function goPage(pageId) {
  state.pageId = pageId;
  window.location.hash = pageId;
  rerender();
}

function findModuleOfPage(pageId) {
  return MODULE_DEFS.find(m => m.pages.some(p => p.id === pageId)) || MODULE_DEFS[0];
}

function rerender() {
  const mod = findModuleOfPage(state.pageId);
  const meta = PAGE_META[state.pageId];

  // Role hint
  document.getElementById("roleHint").textContent = ROLE_HINTS[state.role] || "";

  // Sidebar
  document.getElementById("sidebarNav").innerHTML = MODULE_DEFS.map(m => `
    <div class="nav-item ${m.id === mod.id ? "active" : ""}" data-firstpage="${m.pages[0].id}">
      <span>${m.label}</span>
      <span class="nav-badge">${m.badge}</span>
    </div>
  `).join("");
  document.querySelectorAll(".nav-item").forEach(el => {
    el.onclick = () => goPage(el.dataset.firstpage);
  });

  // Top Header
  document.getElementById("breadcrumb").textContent = meta.breadcrumb;
  document.getElementById("pageTitle").textContent = meta.title;
  document.getElementById("pageSubtitle").textContent = meta.subtitle;

  // Sub-page nav buttons
  document.getElementById("subnavButtons").innerHTML = mod.pages.map(p => `
    <button class="subnav-btn ${p.id === state.pageId ? "active" : ""}" data-pid="${p.id}">
      ${p.id === state.pageId ? "● " : ""}${p.label}
    </button>
  `).join("");
  document.querySelectorAll(".subnav-btn").forEach(b => {
    b.onclick = () => goPage(b.dataset.pid);
  });

  // Page render
  const helpers = { toast, goPage, openModal, closeModal, rerender };
  const view = renderM0_M3(state.pageId, state, helpers) || renderM4_M7(state.pageId, state, helpers);

  const actBox = document.getElementById("headerActions");
  actBox.innerHTML = "";
  (view.headerActions || []).forEach(a => {
    const btn = document.createElement("button");
    btn.className = `btn ${a.primary ? "btn-primary" : ""}`;
    btn.textContent = a.label;
    btn.onclick = a.onClick;
    actBox.appendChild(btn);
  });

  document.getElementById("pageBody").innerHTML = view.html;
  if (view.bind) view.bind();

  // Annotations & Ledger
  const grid = document.getElementById("workspaceGrid");
  const ledger = document.getElementById("ledgerPanel");
  document.getElementById("annoStateText").textContent = state.showAnno ? "已展开" : "已收起";
  if (state.showAnno) {
    grid.classList.remove("anno-hidden");
    ledger.classList.remove("hidden");
  } else {
    grid.classList.add("anno-hidden");
    ledger.classList.add("hidden");
  }

  document.getElementById("annoPageTitle").textContent = `功能块注释 · ${state.pageId.toUpperCase()}`;
  document.getElementById("annoCards").innerHTML = meta.blocks.map((b, idx) => `
    <div class="anno-card" style="border-left-color:${b.color};">
      <div class="anno-card-head">
        <span class="anno-tag" style="background:${b.color};">${idx + 1}</span>
        <span>${b.title}</span>
      </div>
      <div class="anno-line anno-k-step">【对应步骤】${b.step}</div>
      <div class="anno-line anno-k-srs">【SRS依据】${b.srs}</div>
      <div class="anno-line anno-k-tech">【技术支撑】${b.tech}</div>
    </div>
  `).join("");

  document.getElementById("ledgerGrid").innerHTML = meta.ledger.map(([term, kind, src]) => `
    <div class="ledger-row">
      <span class="ledger-term">${term}</span>
      <span class="${kind.includes("SRS") || kind.includes("pilot") || kind.includes("img") ? "ledger-kind-srs" : "ledger-kind-mock"}">${kind}</span>
      <span class="ledger-src">${src}</span>
    </div>
  `).join("");
}

// Init
document.getElementById("roleSelect").onchange = (e) => {
  state.role = e.target.value;
  rerender();
  toast(`已切换登录角色为：${state.role}`);
};
document.getElementById("toggleAnnoBtn").onclick = () => {
  state.showAnno = !state.showAnno;
  rerender();
};

const initHash = window.location.hash.replace("#", "");
if (PAGE_META[initHash]) state.pageId = initHash;
rerender();
</script>
</body>
</html>
