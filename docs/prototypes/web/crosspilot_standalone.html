<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPilot · 跨境电商业务协作工作台</title>
  <style>
:root {
  --bg-outer: #f8fafc;
  --bg-card: #ffffff;
  --border: #e5e7eb;
  --border-strong: #cbd5e1;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-light: rgba(239, 246, 255, 0.72);
  --blue-border: #bfdbfe;
  --text-dark: #0f172a;
  --text-muted: #334155;
  --text-soft: #475569;
  --green: #10b981;
  --green-bg: rgba(236, 253, 245, 0.72);
  --green-text: #047857;
  --amber: #f59e0b;
  --amber-bg: rgba(255, 251, 235, 0.75);
  --amber-text: #b45309;
  --red: #ef4444;
  --red-bg: rgba(254, 242, 242, 0.75);
  --red-text: #b91c1c;
  --purple: #7c3aed;
  --purple-bg: rgba(245, 243, 255, 0.75);
  --purple-text: #5b21b6;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07);
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-outer);
  color: var(--text-dark);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.tnum, .kpi-val, table td, table th {
  font-variant-numeric: tabular-nums;
}

.shell { display: flex; min-height: 100vh; }

/* ========== Left Accordion Sidebar ========== */
.sidebar {
  width: 244px;
  flex-shrink: 0;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  padding: 14px 11px;
  border-right: 1px solid #1e293b;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 6px 12px;
  border-bottom: 1px solid #1e293b;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: #fff; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.brand-name { font-size: 15.5px; font-weight: 700; color: #fff; line-height: 1.25; }
.brand-sub { font-size: 11.5px; color: #cbd5e1; }

.role-box {
  margin: 10px 0;
  padding: 10px;
  background: #1e293b;
  border-radius: 8px;
  border: 1px solid #334155;
}
.role-label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
.role-select {
  width: 100%; height: 34px; padding: 4px 8px; border-radius: 8px;
  border: 1px solid #475569; background: #0f172a;
  color: #f8fafc; font-size: 12.5px; cursor: pointer; outline: none;
}
.role-select:focus { border-color: #60a5fa; }
.role-hint { margin-top: 6px; font-size: 12px; color: #93c5fd; line-height: 1.45; }

.nav-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav-list::-webkit-scrollbar { display: none; }

.nav-group { display: flex; flex-direction: column; }
.nav-parent {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  transition: background 0.16s, color 0.16s;
  user-select: none;
}
.nav-parent:hover { background: #1e293b; color: #fff; }
.nav-parent.open { background: #1e293b; color: #fff; font-weight: 600; }
.nav-parent.active-mod { background: rgba(37, 99, 235, 0.22); color: #fff; border: 1px solid rgba(96, 165, 250, 0.28); }
.nav-parent-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-parent-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.nav-caret { font-size: 11px; color: #cbd5e1; transition: transform 0.15s; }
.nav-parent.open .nav-caret { transform: rotate(90deg); color: #93c5fd; }

.nav-todo {
  font-size: 11.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px;
  background: #ef4444; color: #fff;
  white-space: nowrap;
}
.nav-count {
  font-size: 11.5px; padding: 1px 6px; border-radius: 999px;
  background: rgba(255,255,255,0.1); color: #cbd5e1;
}

.nav-children {
  display: none; flex-direction: column; gap: 3px;
  padding: 4px 0 4px 12px;
  margin-left: 9px;
  border-left: 1px solid #334155;
}
.nav-group.open .nav-children { display: flex; }
.nav-child {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: #cbd5e1;
  font-size: 12.5px;
  line-height: 1.4;
  transition: all 0.15s;
}
.nav-child:hover { background: #1e293b; color: #fff; }
.nav-child.active {
  background: var(--blue); color: #fff; font-weight: 600;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
}

.sidebar-footer {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #1e293b;
  font-size: 12px; color: #cbd5e1; line-height: 1.5;
}

/* ========== Main Workspace ========== */
.main-wrap {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  padding: 12px 20px 22px;
  gap: 10px;
}

.topbar {
  background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--blue);
  border-radius: var(--radius);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.breadcrumb { font-size: 11.5px; font-weight: 600; color: var(--blue); }
.page-title { margin: 1px 0 2px; font-size: 18px; font-weight: 700; color: var(--text-dark); line-height: 1.28; }
.page-subtitle { margin: 0; font-size: 12px; color: var(--text-soft); }

.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.page-body { display: flex; flex-direction: column; gap: 11px; min-width: 0; }

/* ========== Clean Modern SaaS Cards ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, border-color 0.18s ease;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-blue { border-color: var(--blue-border); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-title {
  font-size: 15px; font-weight: 650; color: var(--text-dark);
  display: flex; align-items: center; gap: 8px;
}

/* Hide tutorial numeric tags in main body; display inside Business Rule Drawer */
.page-body .anno-tag { display: none; }
.anno-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  color: #fff; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
}

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.split-left-form { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.split-right-panel { display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 14px; align-items: start; }
.split-right-panel > * { min-width: 0; }
.split-3col-cs { display: grid; grid-template-columns: 235px minmax(0, 1fr) 275px; gap: 14px; align-items: stretch; }
.cs-2col { display: grid; grid-template-columns: minmax(0, 1.3fr) 400px; gap: 14px; align-items: start; }
.split-bi { display: grid; grid-template-columns: 205px minmax(0, 1fr) 255px; gap: 14px; align-items: stretch; }

@media (max-width: 1120px) {
  .grid-4, .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split-3col-cs, .cs-2col, .split-bi, .split-left-form, .split-right-panel { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* KPI Cards */
.kpi-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 15px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease;
}
.kpi-card:hover { box-shadow: var(--shadow-md); }
.kpi-card.highlight-green { border-top: 3px solid var(--green); }
.kpi-card.highlight-blue { border-top: 3px solid var(--blue); }
.kpi-card.highlight-amber { border-top: 3px solid var(--amber); }
.kpi-card.highlight-red { border-top: 3px solid var(--red); }
.kpi-card.highlight-purple { border-top: 3px solid var(--purple); }
.kpi-label {
  font-size: 12px; color: var(--text-soft); font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.kpi-val {
  font-size: 24px; font-weight: 700; margin: 4px 0 3px;
  line-height: 1.18; color: var(--text-dark);
  font-variant-numeric: tabular-nums;
}
.kpi-sub { font-size: 11.5px; color: var(--text-soft); }

/* Formula Captions */
.formula-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}
.formula-box strong { color: var(--blue-hover); }
.formula-inline {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.45;
}
.formula-inline code {
  color: var(--blue-hover); font-weight: 600; background: transparent;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}

/* Soft Converged Banners (Compact single/two-line strip) */
.banner {
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 500;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.banner-amber { background: var(--amber-bg); border: 1px solid #fde68a; color: #92400e; }
.banner-red { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.banner-blue { background: var(--blue-light); border: 1px solid #dbeafe; color: #1e40af; }
.banner-green { background: var(--green-bg); border: 1px solid #a7f3d0; color: #065f46; }

/* Buttons & Pills */
.btn {
  min-height: 34px;
  padding: 6px 13px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--text-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--blue-hover); color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-danger { background: var(--red-bg); border-color: #fca5a5; color: var(--red-text); }
.btn-sm { min-height: 28px; padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn-anno-toggle { background: #fff; border-color: var(--border-strong); color: var(--text-muted); }
.btn-anno-toggle:hover { background: #f1f5f9 !important; color: var(--text-dark) !important; border-color: #94a3b8 !important; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600;
  white-space: nowrap;
}
.p-green { background: var(--green-bg); color: var(--green-text); border: 1px solid rgba(16,185,129,0.2); }
.p-blue { background: var(--blue-light); color: var(--blue-hover); border: 1px solid rgba(37,99,235,0.18); }
.p-amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid rgba(245,158,11,0.22); }
.p-red { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(239,68,68,0.2); }
.p-purple { background: var(--purple-bg); color: var(--purple-text); border: 1px solid rgba(124,58,237,0.2); }
.p-gray { background: #f1f5f9; color: var(--text-soft); border: 1px solid #e2e8f0; }

/* Underlined Status Tabs */
.utabs {
  display: flex; align-items: center; gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 0 2px;
  overflow-x: auto;
}
.utab {
  padding: 9px 2px;
  font-size: 13px; font-weight: 600; color: var(--text-soft);
  cursor: pointer; border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; transition: all 0.14s;
}
.utab:hover { color: var(--text-dark); }
.utab.active { color: var(--blue); border-bottom-color: var(--blue); }
.utab-cnt {
  padding: 1px 7px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  background: #f1f5f9; color: var(--text-muted);
}
.utab.active .utab-cnt { background: var(--blue-light); color: var(--blue-hover); }

/* Filter Bar */
.filter-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.filter-item { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
.filter-item label { font-size: 12px; font-weight: 600; color: var(--text-soft); }

/* Product Thumbnail & Cards */
.prod-thumb-img {
  width: 52px; height: 52px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff;
  object-fit: cover; flex-shrink: 0;
}
.prod-thumb-lg {
  width: 66px; height: 66px; border-radius: 9px;
  border: 1px solid var(--border); background: #fff;
  object-fit: cover; flex-shrink: 0;
}
.prod-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, border-color 0.18s ease;
}
.prod-card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-border); }
.prod-thumb {
  border-radius: 8px; background: #f8fafc;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px;
}

/* M7 1-Large + 4-Small Gallery */
.gallery-1plus4 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.gallery-4small { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gal-tile {
  border: 1px solid var(--border); border-radius: 8px;
  background: #f8fafc; padding: 9px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  cursor: pointer; transition: border-color 0.15s;
}
.gal-tile.picked { border-color: var(--blue); background: #eff6ff; box-shadow: 0 0 0 1px var(--blue); }
.gal-canvas {
  border-radius: 7px; background: #fff; border: 1px solid #e5e7eb;
  display: flex; align-items: center; justify-content: center;
  min-height: 104px; position: relative; overflow: hidden;
}
.gal-tile.large .gal-canvas { min-height: 245px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 10px 12px;
  background: #f8fafc; color: var(--text-soft); font-weight: 600;
  border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12.5px;
}
td {
  padding: 11px 12px; border-bottom: 1px solid #f1f5f9;
  color: var(--text-dark); vertical-align: middle; font-size: 13px;
}
td.nowrap { white-space: nowrap; }
tr:hover td { background: #f8fafc; }
tr.row-selected td { background: #eff6ff; }

/* Inputs & Validation */
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: #fff;
  color: var(--text-dark); font-size: 13px; font-family: inherit;
}
.input, .select { height: 36px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
.textarea { min-height: 68px; resize: vertical; }
.input-err { border-color: var(--red) !important; background: #fef2f2 !important; }
.field-err { font-size: 12px; color: var(--red-text); margin-top: 4px; font-weight: 600; }

/* Async Progress Bar */
.async-card {
  border: 1px solid var(--blue-border); background: #f8fbff;
  border-radius: 8px; padding: 11px 14px;
}
.async-bar { height: 7px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin: 7px 0; }
.async-fill { height: 100%; background: var(--blue); transition: width 0.25s ease; }

/* Steppers */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.step-item {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--text-soft); font-size: 12.5px; font-weight: 600; text-align: center;
}
.step-item.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }
.step-item.done { background: var(--blue); border-color: var(--blue); color: #fff; }

/* CS & Option Tiles */
.session-item {
  padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  margin-bottom: 8px; cursor: pointer; background: #fff;
}
.session-item.active { background: var(--blue-light); border-color: var(--blue); }
.chat-bubble { padding: 10px 12px; border-radius: 8px; background: #f1f5f9; margin-bottom: 8px; font-size: 13px; }
.chat-bubble.user { background: var(--blue); color: #fff; margin-left: auto; max-width: 78%; }
.chat-bubble.assistant { background: #f8fafc; border: 1px solid var(--border); max-width: 88%; }
.chat-trans { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
.chat-bubble.user .chat-trans { color: rgba(255, 255, 255, 0.9); }

.shop-queue-card {
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; cursor: pointer; transition: all 0.16s;
  box-shadow: var(--shadow-sm);
}
.shop-queue-card:hover { border-color: var(--blue-border); box-shadow: var(--shadow-md); }
.shop-queue-card.active { border-color: var(--blue); background: #f8fbff; box-shadow: 0 0 0 1px var(--blue); }

.session-queue-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: #fff;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.session-queue-row.urgent { border-left: 4px solid var(--red); background: #fffafa; }
.session-queue-row.ai-auto { border-left: 4px solid var(--green); }
.session-queue-row:hover { box-shadow: var(--shadow-md); border-color: var(--blue-border); }

.buyer-notice-strip {
  font-size: 11.5px; line-height: 1.5; color: #475569;
  background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px;
  padding: 7px 11px; margin-bottom: 10px;
}
.pdd-card {
  background: #fff7ed; border: 1px solid #fed7aa; border-radius: 9px;
  padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px;
}
.evidence-thumb-wrap {
  display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; border: 1px solid var(--border); border-radius: 7px;
  padding: 4px; background: #fff; transition: border-color 0.15s;
}
.evidence-thumb-wrap:hover { border-color: var(--blue); }
.evidence-thumb-img { width: 58px; height: 58px; border-radius: 5px; object-fit: cover; display: block; }

.option-tile { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: #fff; text-align: center; transition: border-color 0.14s; }
.option-tile.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-hover); }

.media-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #f8fafc; }
.media-card.picked { border-color: var(--blue); border-width: 1.5px; background: #fafcff; }
.media-preview.dark { height: 150px; border-radius: 8px; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; }

/* Slide-over Drawers */

function daysOffsetDate(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function daysOffsetDateTime(offsetDays, hhmm = "10:30") {
  return `${daysOffsetDate(offsetDays)} ${hhmm}`;
}

function calcProductMargin(p) {
  if (p.cost === null || p.cost === undefined || !p.salePriceUsd) {
    return { known: false, profitUsd: null, marginPct: null, commissionUsd: null, returnLossUsd: null };
  }
  const price = Number(p.salePriceUsd);
  const commissionUsd = +(price * ((p.commissionRate || 0) / 100)).toFixed(2);
  const returnLossUsd = +(price * ((p.returnLossRate || 0) / 100)).toFixed(2);
  const totalCost = Number(p.cost) + Number(p.freight || 0) + commissionUsd + Number(p.lastMile || 0) + Number(p.tariff || 0) + Number(p.adCost || 0) + returnLossUsd;
  const profitUsd = +(price - totalCost).toFixed(2);
  const marginPct = +((profitUsd / price) * 100).toFixed(1);
  return { known: true, profitUsd, marginPct, commissionUsd, returnLossUsd, totalCost: +totalCost.toFixed(2) };
}

function calcInvCoverage(item) {
  const daily = item.dailySales || 1;
  const coverDays = +(item.avail / daily).toFixed(1);
  if (item.ageDays > 90) {
    return { coverDays, level: "滞销积压", pill: "p-gray", advice: "库龄超90天占用仓储费，建议打折促销清仓或捆绑消化" };
  }
  if (coverDays < 7) {
    return { coverDays, level: "严重缺货(<7天)", pill: "p-red", advice: "不足7天随时断货！立即提交加急补货或空运调拨" };
  }
  if (coverDays <= 14) {
    return { coverDays, level: "即将断货(7-14天)", pill: "p-amber", advice: "7~14天安全缓冲告急，本周内须下常规补货单" };
  }
  return { coverDays, level: "水位健康", pill: "p-green", advice: "可售周转健康，按正常周期监测补货即可" };
}

function evalShopHealth(s) {
  if (s.mode === "MOCK") {
    return { badge: "仅演示隔离：不计真实营收", pill: "p-blue", urgent: false, triggerText: "演示环境严格与实盘营收隔离" };
  }
  const target = s.authExpireDate && /^\d{4}-\d{2}-\d{2}$/.test(s.authExpireDate) ? new Date(s.authExpireDate + "T00:00:00") : null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const expDays = target ? Math.round((target - today) / 86400000) : 999;

  if ((s.perfScore < 80 || s.disputeRate7d > 2) && s.zeroOrderDays >= 3) {
    return {
      badge: "建议暂停营业",
      pill: "p-red",
      urgent: true,
      triggerText: `绩效分 ${s.perfScore} 分 / 近7天纠纷率 ${s.disputeRate7d}% / 连续 ${s.zeroOrderDays} 天零单`
    };
  }
  if (expDays <= 7) {
    return {
      badge: `限期授权：${Math.max(0, expDays)}天后到期`,
      pill: "p-red",
      urgent: true,
      triggerText: `授权有效期仅剩 ${Math.max(0, expDays)} 天（到期日 ${s.authExpireDate}），超时将停止拉单`
    };
  }
  if ((s.syncFailCount || 0) >= 3 || s.health === "同步异常") {
    return {
      badge: `数据异常：近${s.syncFailCount || 3}次同步失败，请排查`,
      pill: "p-red",
      urgent: true,
      triggerText: `最近连续同步失败 ${s.syncFailCount || 3} 次，建议立即重试同步或核对授权`
    };
  }
  if (s.health === "连接已断开") {
    return { badge: "连接已断开", pill: "p-red", urgent: true, triggerText: s.errNote || "请重新授权恢复连接" };
  }
  return {
    badge: "连接与经营正常",
    pill: "p-green",
    urgent: false,
    triggerText: `绩效 ${s.perfScore} 分 · 纠纷率 ${s.disputeRate7d}% · 授权余 ${expDays} 天`
  };
}

function computeLiveBusinessStats(state) {
  const realOrders = state.orders.filter(o => o.mode === "REAL");
  const gmv = +realOrders.reduce((s, o) => s + Number(o.amountUsd || 0), 0).toFixed(2);
  const ordersCnt = realOrders.length;
  let netProfit = 0;
  let adSpend = 0;
  const byShop = {};

  state.shops.forEach(sh => {
    byShop[sh.name] = { gmv: 0, count: 0, aov: 0, profit: 0 };
  });

  realOrders.forEach(o => {
    const prod = state.masterProducts.find(p => p.sku === o.sku) || state.masterProducts[0];
    const qty = Number(o.qty || 1);
    const amt = Number(o.amountUsd || 0);
    const unitFixed = Number(prod.cost || 0) + Number(prod.freight || 0) + Number(prod.lastMile || 0) + Number(prod.tariff || 0);
    const unitAd = Number(prod.adCost || 0);
    const commUsd = amt * (Number(prod.commissionRate || 0) / 100);
    const retUsd = amt * (Number(prod.returnLossRate || 0) / 100);
    const orderCost = (unitFixed + unitAd) * qty + commUsd + retUsd;
    const orderProfit = amt - orderCost;

    netProfit += orderProfit;
    adSpend += unitAd * qty;

    if (!byShop[o.shop]) byShop[o.shop] = { gmv: 0, count: 0, aov: 0, profit: 0 };
    byShop[o.shop].gmv += amt;
    byShop[o.shop].count += 1;
    byShop[o.shop].profit += orderProfit;
  });

  Object.values(byShop).forEach(entry => {
    entry.gmv = +entry.gmv.toFixed(2);
    entry.profit = +entry.profit.toFixed(2);
    entry.aov = entry.count > 0 ? +(entry.gmv / entry.count).toFixed(2) : 0;
  });

  netProfit = +netProfit.toFixed(2);
  adSpend = +adSpend.toFixed(2);
  const marginPct = gmv > 0 ? ((netProfit / gmv) * 100).toFixed(1) : "0.0";
  const acosPct = gmv > 0 ? ((adSpend / gmv) * 100).toFixed(1) : "0.0";
  const aov = ordersCnt > 0 ? (gmv / ordersCnt).toFixed(2) : "0.00";
  const realLowStocks = state.inventoryItems.filter(i => i.shopMode === "REAL" && i.avail < i.safety);
  const syncedDeltaCnt = realOrders.filter(o => !o.historical).length;

  return { gmv, ordersCnt, netProfit, adSpend, marginPct, acosPct, aov, realLowStocks, syncedDeltaCnt, byShop };
}

function buildM4BatchItems(count = 120, kindLabel = "外购行业估算", srcCode = "PAID_EXTERNAL", startNum = 1001) {
  const templates = [
    { name: "折叠抽屉式衣物收纳盒", cat: "家居收纳", plat: "Amazon US", price: 24.9, band: "$15-30", buy: 4.2 },
    { name: "车载吸尘器无线迷你款", cat: "3C配件", plat: "TikTok US", price: 32.5, band: "$30-60", buy: 7.4 },
    { name: "自动感应宠物喂水器", cat: "宠物用品", plat: "Amazon US", price: 38.0, band: "$30-60", buy: 8.6 },
    { name: "便携电动咖啡研磨杯", cat: "厨房小电", plat: "Shopee TH", price: 22.8, band: "$15-30", buy: 5.5 },
    { name: "防水折叠牛津布野餐篮", cat: "户外运动", plat: "Amazon US", price: 28.9, band: "$15-30", buy: 5.1 },
    { name: "壁挂免打孔吹风机架", cat: "家居收纳", plat: "Shopee TH", price: 13.5, band: "<$15", buy: 2.3 },
    { name: "磁吸无线桌面快充座", cat: "3C配件", plat: "TikTok US", price: 29.9, band: "$15-30", buy: 6.1 },
    { name: "宠物硅胶防滑舔食垫", cat: "宠物用品", plat: "TikTok US", price: 14.2, band: "<$15", buy: 2.0 },
  ];
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = templates[i % templates.length];
    const num = startNum + i;
    const isInt = srcCode === "INTERNAL" || (srcCode === "MIXED" && i % 5 === 0);
    const isRisk = i % 9 === 4;
    const missingCost = !isInt && i % 2 === 0;
    const trend = isRisk ? -6.5 + (i % 4) : +(8 + (i * 7) % 44).toFixed(1);
    const margin = isRisk ? 6.8 : missingCost ? 12.1 : +(11.5 + ((i * 3) % 14)).toFixed(1);
    const paidQty = 450 + ((i * 137) % 1600);
    const refundQty = isRisk ? Math.round(paidQty * 0.08) : Math.round(paidQty * 0.02);
    const grossRev = +(paidQty * t.price).toFixed(2);
    const refundAmt = +(refundQty * t.price).toFixed(2);
    const stage = isRisk ? "初筛候选" : missingCost ? "临时待核价" : "初筛候选";
    const riskLevel = isRisk ? "高风险" : (i % 4 === 1 ? "中风险" : "低风险");
    const sysAdvice = isRisk
      ? { badge: "建议淘汰", tone: "p-red", reason: `退货偏高或毛利仅 ${margin}%（低于10%底线）` }
      : !isInt || missingCost
      ? { badge: "建议补成本再评", tone: "p-amber", reason: `涨势 +${trend}% 但需核清正式采购报价后再评` }
      : { badge: "建议投产", tone: "p-green", reason: `内部实盘净增 +${trend}%、毛利 ${margin}% 达标，可立即送审` };
    out.push({
      sku: `SKU-${num}`,
      name: `${t.name} #${(i % 12) + 1}`,
      category: t.cat,
      priceBand: t.band,
      unitPriceUsd: t.price,
      platform: t.plat,
      region: t.plat.includes("TH") ? "东南亚渠道" : "美区渠道",
      lifecycle: trend >= 25 ? "快速上升期" : trend < 0 ? "衰退期" : "成熟期",
      riskLevel,
      paidQty,
      refundQty,
      grossRev,
      discount: +(grossRev * 0.015).toFixed(2),
      refundAmt,
      trend,
      prevAvg: Math.round(paidQty / 8),
      currAvg: Math.round((paidQty / 8) * (1 + trend / 100)),
      marginKnown: !missingCost,
      margin,
      src: isInt ? "内部实盘选品" : kindLabel,
      srcCode: isInt ? "INTERNAL" : "PAID_EXTERNAL",
      stage,
      submitter: "吴选品(批量入池)",
      submitReason: "",
      approver: "",
      decisionReason: "",
      evidence: "",
      missing: missingCost ? "采购成本与头程费用待供应商核价" : "",
      budget: `$${Math.round(t.buy * 80 + 300)} (80件)`,
      sysAdvice,
      competition: { competitors: 18 + (i % 55), topReviews: "200~900条", priceRange: `$${(t.price*0.8).toFixed(1)} - $${(t.price*1.2).toFixed(1)}`, verdict: isRisk ? "竞争较激烈" : "竞争温和有机会" },
      supplyChain: { buyPrice: missingCost ? "待核价 (估算$" + t.buy + ")" : "$" + t.buy, moq: "50 件", leadDays: `${8 + (i % 7)} 天`, inStock: missingCost ? "待供应商报价" : "工厂现货" },
      riskDetail: { ip: isRisk ? "存在类似外观隐患" : "专利排查无冲突 ✓", cert: t.cat === "3C配件" || t.cat === "厨房小电" ? "需常规电气/带电合规核验" : "常规材质无特殊门槛 ✓", seasonal: "四季稳销", refundRate: `${((refundQty / paidQty) * 100).toFixed(1)}%` },
      timing: { seasonNote: "当前类目搜索保持活跃", stageNote: trend >= 25 ? "上升期窗口" : "常规跟进" },
      trend8w: Array.from({ length: 8 }, (_, k) => Math.max(20, Math.round((paidQty / 8) * (0.82 + (k * trend) / 700))))
    });
  }
  return out;
}

function nowTimeStr(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function nowDateTimeStr(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${nowTimeStr(d)}`;
}

  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const rnd = String(Math.floor(1000 + Math.random() * 9000));
  return `${prefix}-${ymd}-${rnd}`;
}
function relTimeLabel(ts) {
  if (!ts) return "历史演示记录";
  const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (sec < 10) return "刚刚更新";
  if (sec < 60) return `${sec} 秒前`;
  if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
  return `${Math.floor(sec / 3600)} 小时前`;
}

function runLocalForecastAlgo(history96, modelName, horizon) {
  const len = history96.length;
  const recent14 = history96.slice(-14);
  const avg14 = recent14.reduce((a, b) => a + b, 0) / recent14.length;
  const zeroRatio = history96.filter(v => v === 0).length / len;

  const weekdaySums = [0, 0, 0, 0, 0, 0, 0];
  const weekdayCnts = [0, 0, 0, 0, 0, 0, 0];
  history96.forEach((v, idx) => {
    const wd = idx % 7;
    weekdaySums[wd] += v;
    weekdayCnts[wd] += 1;
  });
  const weekdayAvg = weekdaySums.map((s, i) => s / (weekdayCnts[i] || 1));
  const overallAvg = history96.reduce((a, b) => a + b, 0) / len;

function daysUntilDateStr(dateStr) {
  if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return 999;
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

        <div class="card">
          <div class="card-header">
            <div class="card-title">多平台已接入店铺明细与经营健康评估（异常店已置顶标红预警）</div>
            <span class="pill ${canManageShop ? "p-green" : "p-amber"}">${canManageShop ? "已解锁管理权限" : "当前岗位仅可查看状态"}</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>店铺名称 / 开店日</th>
                  <th>平台 / 站点 / 口径</th>
                  <th>实算 GMV / 订单数</th>
                  <th>主力品类 / 负责人</th>
                  <th>币种 / 时区</th>
                  <th>授权到期日</th>
                  <th>经营健康与权限</th>
                  <th>最近同步 / 下次计划</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${[...state.shops].sort((a, b) => (evalShopHealth(b).urgent ? 1 : 0) - (evalShopHealth(a).urgent ? 1 : 0)).map(s => {
                  const idx = state.shops.indexOf(s);
                  const h = evalShopHealth(s);
                  const shopStat = stats.byShop[s.name] || { gmv: 0, count: 0, aov: 0 };
                  const expDays = daysUntilDateStr(s.authExpireDate);
                  const expSoon = s.mode === "REAL" && expDays <= 7;
                  return `
                    <tr style="${h.urgent ? "background:#fef2f2;" : ""}">
                      <td class="nowrap">
                        <strong>${s.name}</strong>
                        <div style="font-size:12px;color:var(--text-soft);">凭证${s.credMask} · 开店 ${s.openedAt || "已建档"}</div>
                      </td>
                      <td class="nowrap">
                        <div><strong>${s.platform} · ${s.region}</strong></div>
                        <span class="pill ${s.mode==="REAL"?"p-green":"p-amber"}" style="margin-top:2px;">${s.mode==="REAL"?"实盘(计营收)":"仅演示(不计营收)"}</span>
                      </td>
                      <td class="nowrap">
                        <strong>${s.mode==="REAL" ? "$" + shopStat.gmv.toLocaleString() : "$0 (隔离)"}</strong>
                        <div style="font-size:12px;color:var(--text-soft);">${s.mode==="REAL" ? `${shopStat.count} 笔 · 客单 $${shopStat.aov}` : "不计入实盘统计"}</div>
                      </td>
                      <td class="nowrap">
                        <div>${s.mainCategory}</div>
                        <div style="font-size:12px;color:var(--text-soft);">负责人：${s.owner}</div>
                      </td>
                      <td class="nowrap">
                        <strong>${s.currency}</strong>
                        <div style="font-size:12px;color:var(--text-soft);">${s.timezone}</div>
                      </td>
                      <td class="nowrap">
                        <div style="color:${expSoon?"var(--red-text)":"var(--text-dark)"};font-weight:${expSoon?"700":"500"};">${s.authExpireDate}</div>
                        ${expSoon ? `<span class="pill p-red">限期授权(${expDays}天)</span>` : ""}
                      </td>
                      <td>
                        <span class="pill ${h.pill}">${h.badge}</span>
                        ${s.platform === "AMAZON" ? `
                          <div style="margin-top:4px;">
                            <span class="pill ${s.mailRelayOk !== false ? "p-blue" : "p-red"}">${s.mailRelayOk !== false ? "邮件中继正常" : "⚠️ 邮件中继转发中断"}</span>
                          </div>
                        ` : ""}
                        <div style="font-size:12px;color:${h.urgent?"var(--red-text)":"var(--text-soft)"};margin-top:3px;max-width:230px;">${h.triggerText}</div>
                        <details style="margin-top:4px;font-size:12px;">
                          <summary style="cursor:pointer;color:var(--blue-hover);">展开健康明细与权限 (${s.permLabels.length})</summary>
                          <div style="margin-top:4px;line-height:1.6;color:var(--text-muted);">
                            绩效 ${s.perfScore}分 · 7天纠纷 ${s.disputeRate7d}% · 退货 ${s.returnRate}% · 迟发 ${s.lateShipRate}% · 违规 ${s.policyViolations}次 · 连续零单 ${s.zeroOrderDays}天
                            ${s.platform === "AMAZON" ? `<br/>Amazon 买家来信通道：邮件中继（${s.mailRelayAddr || "amz-relay@crosspilot.mail"}，官方仅支持发信不支持直收）` : ""}
                          </div>
                          ${s.platform === "AMAZON" ? `
                            <div style="margin-top:5px;">
                              <button class="btn btn-sm m0-relay-toggle" data-i="${idx}" ${!canManageShop?"disabled":""}>${s.mailRelayOk !== false ? "模拟邮件中继中断告警" : "恢复邮件中继并重收"}</button>
                            </div>
                          ` : ""}
                          <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">${s.permLabels.map(p => `<span class="pill p-gray">${p}</span>`).join("")}</div>
                        </details>
                      </td>
                      <td class="nowrap">
                        <div>${s.lastSync}</div>
                        <div style="font-size:12px;color:var(--text-soft);">${relTimeLabel(s.lastSyncTs)} · ${s.nextSyncAt}</div>
                      </td>
                      <td class="nowrap">
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                          <button class="btn btn-sm btn-primary m0-sync-btn" data-i="${idx}" ${!canManageShop?"disabled":""} title="${!canManageShop?"需要管理者或主管权限":""}">↻ 同步订单</button>
                          <button class="btn btn-sm m0-reauth-btn" data-i="${idx}" ${!canManageShop?"disabled":""}>重新授权</button>
                          <button class="btn btn-sm btn-danger m0-disc-btn" data-i="${idx}" ${!canManageShop?"disabled":""}>断开</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        document.querySelectorAll(".m0-sync-btn").forEach(b => b.onclick = () => handleSyncShop(state.shops[Number(b.dataset.i)]));
        document.querySelectorAll(".m0-reauth-btn").forEach(b => b.onclick = () => handleReauthShop(state.shops[Number(b.dataset.i)]));
        document.querySelectorAll(".m0-relay-toggle").forEach(b => b.onclick = () => {
          const s = state.shops[Number(b.dataset.i)];
          s.mailRelayOk = s.mailRelayOk === false ? true : false;
          appendAuditLog(state, {
            sentence: `${ROLE_PERSON_NAMES[state.role]} ${s.mailRelayOk ? "恢复了" : "触发了"}「${s.name}」的 Amazon 邮件中继通道${s.mailRelayOk ? "正常接收" : "中断告警（已开启手动兜底录入）"}`,
            ok: s.mailRelayOk
          });
          rerender();
          toast(s.mailRelayOk ? `${s.name} 邮件中继已恢复正常` : `${s.name} 邮件中继已中断，请改用 M1-4/手动录入买家来信兜底`, s.mailRelayOk ? "success" : "warn");
        });
        document.querySelectorAll(".m0-disc-btn").forEach(b => b.onclick = () => {
          const s = state.shops[Number(b.dataset.i)];
          commitAction({
            title: `确认断开店铺连接 · ${s.name}`,
            danger: true,
            summary: "断开后将暂停该店铺的订单与库存自动同步，历史订单数据仍保留，随时可点击「重新授权」恢复。",
            confirmText: "确认断开",
            fieldsHtml: `<div class="field"><label>断开原因说明 *</label><input id="discReason" class="input" placeholder="如：更换店铺主账号 / 暂停运营"/></div>`,
            validate: (wrap) => {
              const el = wrap.querySelector("#discReason");
              return el.value.trim() ? [] : [{ el, msg: "请填写断开原因" }];
            },
            onConfirm: (wrap) => {
              s.health = "连接已断开";
              s.errNote = `已断开：${wrap.querySelector("#discReason").value.trim()}`;
              return { toastMsg: `已断开「${s.name}」的连接`, toastLevel: "warn" };
            },
            audit: (wrap) => ({
              sentence: `${ROLE_PERSON_NAMES[state.role]} 断开了店铺「${s.name}」的连接，原因：${wrap.querySelector("#discReason").value.trim()}`,
              ok: true
            })
          });
        });
      }
    };
  }

  // ==================== M0-2: 主商品档案、成本变更申请与订单台账 ====================
  if (pageId === "m0b") {
    const canEditCost = state.role === "planner" || state.role === "approver";
    const canApproveCost = state.role === "approver";

    const enrichedProds = state.masterProducts.map(p => ({ ...p, _m: calcProductMargin(p) }));
    const sortedProds = [...enrichedProds].sort((a, b) => {
      if (a.cost === null && b.cost !== null) return -1;
      if (a.cost !== null && b.cost === null) return 1;
      const aLow = a._m.known && a._m.marginPct < 12 ? 1 : 0;
      const bLow = b._m.known && b._m.marginPct < 12 ? 1 : 0;
      return bLow - aLow;
    });

    const filteredProds = sortedProds.filter(p => {
      const q = state.masterSearch.trim().toLowerCase();
      const matchQ = !q || p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
      const matchShop = state.masterShopFilter === "ALL" || p.mappings.some(m => m.shop === state.masterShopFilter);
      return matchQ && matchShop;
    });

    const prodPageSize = 6;
    const prodTotalPages = Math.max(1, Math.ceil(filteredProds.length / prodPageSize));
    if (state.m0bProdPage > prodTotalPages) state.m0bProdPage = prodTotalPages;
    const pagedProds = filteredProds.slice((state.m0bProdPage - 1) * prodPageSize, state.m0bProdPage * prodPageSize);

    const openCostBreakdownDrawer = (p) => {
      const m = calcProductMargin(p);
      const src = p.costSources || {};
      const estRev = +(p.sales30d * p.salePriceUsd).toFixed(2);
      openDrawer(`8项完整成本构成与毛利核算 · ${p.sku}`, `${p.name} · ${p.cat} · 负责人 ${p.owner}`, `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
          <img src="${getProductImg(p.sku)}" class="prod-thumb-lg" alt="${p.name}"/>
          <div>
            <div style="font-size:15.5px;font-weight:700;">${p.name}（${p.sku}）</div>
            <div style="font-size:12.5px;color:var(--text-soft);margin-top:3px;">上架日期：${p.listedAt} ｜ 近30天销量：<strong>${p.sales30d} 件</strong>（预估销售额 <strong>$${estRev.toLocaleString()}</strong>）</div>
            <div style="margin-top:4px;">
              ${m.known
                ? `<span class="pill ${m.marginPct < 10 ? "p-red" : m.marginPct < 12 ? "p-amber" : "p-green"}">单件毛利 $${m.profitUsd.toFixed(2)} ｜ 净利率 ${m.marginPct}%（门槛 ≥10%）</span>`
                : `<span class="pill p-amber">待复核最新核价信息</span>`}
            </div>
          </div>
        </div>
        ${(p.rmbNote || p.localBenchmarkNote) ? `<div class="banner banner-blue" style="margin-bottom:10px;"><span><strong>本币核算基准：</strong>${p.rmbNote || p.localBenchmarkNote}</span></div>` : ""}
        <div class="table-wrap" style="margin-bottom:12px;">
          <table>
            <thead><tr><th>成本构成项目</th><th>单件金额 (USD)</th><th>数据来源与核价依据</th></tr></thead>
            <tbody>
              <tr><td>① 参考售价</td><td><strong>$${p.salePriceUsd.toFixed(2)}</strong></td><td>${p.mappings[0]?.shop || "主力店铺"} 在售价（实时同步）</td></tr>
              <tr><td>② 采购成本</td><td>$${p.cost.toFixed(2)}</td><td>${src.cost || "供应商正式采购报价单"}</td></tr>
              <tr><td>③ 头程运费</td><td>$${p.freight.toFixed(2)}</td><td>${src.freight || "货代物流实盘账单"}</td></tr>
              <tr><td>④ 平台佣金 (${p.commissionRate}%)</td><td>$${m.commissionUsd.toFixed(2)}</td><td>${src.commission || "电商平台类目费率规则"}</td></tr>
              <tr><td>⑤ 尾程配送费</td><td>$${p.lastMile.toFixed(2)}</td><td>${src.lastMile || "海外仓 / 本地尾程派送费表"}</td></tr>
              <tr><td>⑥ 进口关税</td><td>$${p.tariff.toFixed(2)}</td><td>${src.tariff || "目的国海关税率及清关账单"}</td></tr>
              <tr><td>⑦ 均摊广告费</td><td>$${p.adCost.toFixed(2)}</td><td>${src.adCost || "近30天广告花费分摊"}</td></tr>
              <tr><td>⑧ 退货损耗 (${p.returnLossRate}%)</td><td>$${m.returnLossUsd.toFixed(2)}</td><td>${src.returnLoss || "近30天实际退货率折算损耗"}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="formula-box" style="margin-bottom:12px;">
          <strong>毛利核算明细与门槛对比：</strong><br/>
          单件净毛利 = 售价 $${p.salePriceUsd.toFixed(2)} − 7项成本合计 $${m.totalCost.toFixed(2)} = <strong style="color:${m.marginPct<12?"var(--red-text)":"var(--green-text)"};">$${m.profitUsd.toFixed(2)}（净利率 ${m.marginPct}%）</strong><br/>
          对比平台利润门槛（10%）：<strong>${m.marginPct >= 10 ? `高出门槛 +${(m.marginPct - 10).toFixed(1)}% ✓ 达标` : `低于门槛 ${(10 - m.marginPct).toFixed(1)}% ✗ 触发预警`}</strong>
        </div>
        ${m.marginPct < 12 ? `<div class="banner banner-red"><span>⚠️ 利润偏薄预警（低于 12% 健康线）：建议提高目标站点售价、或联系供应商复核采购与物流报价。</span></div>` : ""}
        <div class="drawer-sec-label">已上架店铺与当地售价</div>
        ${p.mappings.map(mp => `<div style="padding:7px 10px;background:#f8fafc;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;font-size:13px;"><strong>${mp.shop}</strong> · 店铺编码 ${mp.shopSku} · 售价 <strong>${mp.price}</strong></div>`).join("")}
      `);
    };

    const dateCutoff7 = daysOffsetDate(-7);
    const dateCutoff30 = daysOffsetDate(-30);
    const filteredOrders = state.orders.filter(o => {
      const q = state.orderSearch.trim().toLowerCase();
      const mQ = !q || o.orderNo.toLowerCase().includes(q) || o.buyer.toLowerCase().includes(q) || (o.trackingNo || "").toLowerCase().includes(q) || o.sku.toLowerCase().includes(q);
      const mShop = state.orderShopFilter === "ALL" || o.shop === state.orderShopFilter;
      const mSt = state.orderStatusFilter === "ALL" || o.status === state.orderStatusFilter;
      const ordDate = (o.orderedAt || "").slice(0, 10);
      let mDt = true;
      if (state.orderDateFilter === "RECENT_7D") mDt = ordDate >= dateCutoff7;
      else if (state.orderDateFilter === "RECENT_30D") mDt = ordDate >= dateCutoff30;
      else if (state.orderDateFilter === "CUSTOM") {
        if (state.orderDateCustomStart && ordDate < state.orderDateCustomStart) mDt = false;
        if (state.orderDateCustomEnd && ordDate > state.orderDateCustomEnd) mDt = false;
      }
      return mQ && mShop && mSt && mDt;
    });

    const ordPageSize = 8;
    const ordTotalPages = Math.max(1, Math.ceil(filteredOrders.length / ordPageSize));
    if (state.m0bOrdPage > ordTotalPages) state.m0bOrdPage = ordTotalPages;
    const pagedOrders = filteredOrders.slice((state.m0bOrdPage - 1) * ordPageSize, state.m0bOrdPage * ordPageSize);

    const lowMarginCount = enrichedProds.filter(p => p._m.known && p._m.marginPct < 12).length;
    const missingCostCount = enrichedProds.filter(p => p.cost === null).length;
    const realOrderCount = state.orders.filter(o => o.mode === "REAL").length;
    const disputeOrderCount = state.orders.filter(o => o.disputeStatus && o.disputeStatus !== "无纠纷").length;

    return {
      headerActions: [
        { label: "查看分店库存与盘点 →", primary: true, onClick: () => goPage("m0c") }
      ],
      html: `
        <div class="grid-4">
          <div class="kpi-card highlight-blue"><div class="kpi-label">在档主商品数量</div><div class="kpi-val" style="color:var(--blue-hover)">${state.masterProducts.length} 款</div><div class="kpi-sub">跨店铺统一商品编码与毛利核算</div></div>
          <div class="kpi-card ${missingCostCount + lowMarginCount > 0 ? "highlight-red" : ""}"><div class="kpi-label">低毛利 / 成本待核预警</div><div class="kpi-val" style="color:var(--red-text)">${missingCostCount} 待核 / ${lowMarginCount} 薄</div><div class="kpi-sub">毛利率＜12%或待核价商品已置顶</div></div>
          <div class="kpi-card highlight-green"><div class="kpi-label">实盘订单明细 (已防重)</div><div class="kpi-val" style="color:var(--green-text)">${realOrderCount} 笔</div><div class="kpi-sub">含纠纷/售后中 ${disputeOrderCount} 笔（演示店已隔离）</div></div>
          <div class="kpi-card"><div class="kpi-label">成本变更审批台账</div><div class="kpi-val">${state.costChangeLogs.length} 笔</div><div class="kpi-sub">待主管审批：${state.costChangeLogs.filter(c=>c.status==="待主管审批").length} 笔</div></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">主商品档案与毛利率预警（点击商品名可看 8 项完整成本拆分）</div>
            <span class="pill p-amber">低毛利置顶 · 8项成本透明拆解</span>
          </div>
          <div class="filter-bar" style="margin-bottom:12px;">
            <div class="filter-item"><label>搜索商品编码 / 名称 / 品类</label><input id="m0bSearch" class="input" placeholder="如：BAG-108 / 露营 / 家居收纳" value="${state.masterSearch}"/></div>
            <div class="filter-item"><label>按上架店铺筛选</label>
              <select id="m0bShopSel" class="select">
                <option value="ALL">全部店铺 (${state.shops.filter(s=>s.mode==="REAL").length} 家实盘)</option>
                ${state.shops.filter(s => s.mode === "REAL").map(s => `<option value="${s.name}" ${state.masterShopFilter===s.name?"selected":""}>${s.name}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>商品（点击看成本构成）</th><th>品类</th><th>各店铺售价</th><th>近30天销量</th><th>毛利率与系统建议</th><th>商品标签</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead>
              <tbody>
                ${pagedProds.length ? pagedProds.map(p => {
                  const m = p._m;
                  const lowM = m.known && m.marginPct < 12;
                  return `
                    <tr style="${p.cost===null ? "background:#fffbeb;" : lowM ? "background:#fef2f2;" : ""}">
                      <td class="nowrap">
                        <div class="m0b-cost-detail-trigger" data-sku="${p.sku}" style="display:flex;align-items:center;gap:10px;cursor:pointer;" title="点击查看完整成本构成与毛利率计算明细">
                          <img src="${getProductImg(p.sku)}" class="prod-thumb-img" alt="${p.name}"/>
                          <div>
                            <strong style="color:var(--blue-hover);text-decoration:underline;">${p.name}</strong>
                            <div style="font-size:12px;color:var(--text-soft);">${p.sku} · 上架 ${p.listedAt}</div>
                          </div>
                        </div>
                      </td>
                      <td class="nowrap">${p.cat}</td>
                      <td>${p.mappings.map(mp => `<div style="font-size:12px;"><strong>${mp.shop}</strong> · ${mp.price}</div>`).join("")}</td>
                      <td class="nowrap"><strong>${p.sales30d} 件</strong></td>
                      <td class="nowrap">
                        ${!m.known
                          ? `<span class="pill p-amber">待复核报价</span><div style="font-size:12px;color:var(--amber-text);margin-top:2px;">请核查采购价</div>`
                          : lowM
                            ? `<strong style="color:var(--red-text);font-size:14px;">${m.marginPct}%（偏薄）</strong><div style="font-size:12px;color:var(--red-text);margin-top:2px;">利润偏薄，建议调价或换供应商</div>`
                            : `<strong style="color:var(--green-text);font-size:14px;">${m.marginPct}%</strong><div style="font-size:12px;color:var(--text-soft);">单件毛利 $${m.profitUsd.toFixed(2)}</div>`}
                      </td>
                      <td class="nowrap"><span class="pill ${p.tag==="爆款"?"p-green":p.tag==="潜力"?"p-blue":p.tag==="滞销"?"p-red":"p-amber"}">${p.tag}</span></td>
                      <td class="nowrap">${p.owner}</td>
                      <td class="nowrap"><span class="pill ${p.cost===null?"p-amber":"p-green"}">${p.status}</span></td>
                      <td class="nowrap">
                        <div style="display:flex;gap:6px;">
                          <button class="btn btn-sm m0b-cost-detail-trigger" data-sku="${p.sku}">成本构成</button>
                          <button class="btn btn-sm btn-primary m0b-cost-btn" data-sku="${p.sku}" ${!canEditCost?"disabled":""} title="${!canEditCost?"需要业务运营或主管权限":""}">调整成本</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join("") : `<tr><td colspan="9" style="text-align:center;color:var(--text-soft);padding:20px;">暂无符合筛选条件的商品，请清空筛选词重试。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">

                <option value="已签收" ${state.orderStatusFilter==="已签收"?"selected":""}>已签收</option>

                      <td class="nowrap">
                        <strong style="color:var(--blue-hover);">${o.orderNo}</strong>

                      <td class="nowrap">

                        ${o.refundSyncStatus && o.refundSyncStatus !== "无退款" ? `<div style="font-size:11.5px;color:var(--purple-text);margin-top:2px;">${o.refundSyncStatus}</div>` : ""}
                      </td>
                      <td class="nowrap"><span class="pill ${o.mode==="REAL"?"p-green":"p-amber"}">${o.mode==="REAL"?"计入真实营收":"仅演示不计营收"}</span></td>
