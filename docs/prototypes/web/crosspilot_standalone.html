                }).join("") : `<tr><td colspan="10" style="text-align:center;color:var(--text-soft);padding:20px;">暂无符合当前筛选条件的订单。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
            <span style="font-size:12.5px;color:var(--text-soft);">第 ${state.m0bOrdPage} / ${ordTotalPages} 页 · 每页 8 笔 · 共 ${filteredOrders.length} 笔</span>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm" id="m0bOrdPrev" ${state.m0bOrdPage<=1?"disabled":""}>← 上一页</button>
              <button class="btn btn-sm" id="m0bOrdNext" ${state.m0bOrdPage>=ordTotalPages?"disabled":""}>下一页 →</button>
            </div>
          </div>
        </div>
      `,
      bind: () => {
        document.getElementById("m0bSearch").oninput = (e) => { state.masterSearch = e.target.value; state.m0bProdPage = 1; rerender(); };
        document.getElementById("m0bShopSel").onchange = (e) => { state.masterShopFilter = e.target.value; state.m0bProdPage = 1; rerender(); };
        document.getElementById("m0bProdPrev").onclick = () => { state.m0bProdPage -= 1; rerender(); };
        document.getElementById("m0bProdNext").onclick = () => { state.m0bProdPage += 1; rerender(); };

        document.getElementById("ordSearchInp").oninput = (e) => { state.orderSearch = e.target.value; state.m0bOrdPage = 1; rerender(); };
        document.getElementById("ordShopFlt").onchange = (e) => { state.orderShopFilter = e.target.value; state.m0bOrdPage = 1; rerender(); };
        document.getElementById("ordStFlt").onchange = (e) => { state.orderStatusFilter = e.target.value; state.m0bOrdPage = 1; rerender(); };
        document.getElementById("ordDtFlt").onchange = (e) => { state.orderDateFilter = e.target.value; state.m0bOrdPage = 1; rerender(); };
        const dtStartEl = document.getElementById("ordDtStart");
        const dtEndEl = document.getElementById("ordDtEnd");
        if (dtStartEl) dtStartEl.onchange = (e) => { state.orderDateCustomStart = e.target.value; state.m0bOrdPage = 1; rerender(); };
        if (dtEndEl) dtEndEl.onchange = (e) => { state.orderDateCustomEnd = e.target.value; state.m0bOrdPage = 1; rerender(); };
        document.getElementById("m0bOrdPrev").onclick = () => { state.m0bOrdPage -= 1; rerender(); };
        document.getElementById("m0bOrdNext").onclick = () => { state.m0bOrdPage += 1; rerender(); };

        document.querySelectorAll(".m0b-cost-detail-trigger").forEach(el => el.onclick = () => {
          const p = state.masterProducts.find(x => x.sku === el.dataset.sku);
          if (p) openCostBreakdownDrawer(p);
        });

        document.querySelectorAll(".m0b-ord-row").forEach(tr => tr.onclick = () => {
          const o = state.orders.find(x => x.orderNo === tr.dataset.ord);
          if (!o) return;
          const matchedSess = state.csSessions.find(s => s.linkedOrder === o.orderNo || s.buyer === o.buyer);
          const hasDispute = o.disputeStatus && o.disputeStatus !== "无纠纷";
          openDrawer(`订单全生命周期 · ${o.orderNo}`, `${o.shop} · ${o.mode==="REAL"?"实盘订单":"仅演示订单"}${o.isHistoryDemo?" · 历史示例数据":""}`, `
            ${hasDispute ? `<div class="banner banner-red" style="margin-bottom:12px;"><span>⚠️ 该订单当前存在「${o.disputeStatus}」，建议立即前往 M1 客服或售后工单处理。</span></div>` : ""}
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
              <img src="${getProductImg(o.sku)}" class="prod-thumb-lg" alt="${o.productName}"/>
              <div>
                <div style="font-size:15px;font-weight:700;">${o.productName} × ${o.qty}</div>
                <div style="font-size:12.5px;color:var(--text-soft);margin-top:2px;">买家：<strong>${o.buyer}</strong> (${o.countryCity || "线上跨境订单"})</div>
                <div style="font-size:12.5px;color:var(--text-soft);">实付：<strong>${o.amountDisplay}</strong> ｜ 支付：${o.payStatus || "已支付"} ｜ 来源：${o.source || "自然流量"}</div>
                <div style="font-size:12px;color:var(--text-soft);">物流单号：<strong>${o.trackingNo || "待生成运单"}</strong> ｜ 退款登记：${o.refundSyncStatus}</div>
              </div>
            </div>
            <div class="drawer-sec-label">订单流转时间轴</div>
            <div style="margin-bottom:16px;">
              ${(o.timeline || []).map(st => `
                <div class="timeline-step ${st.done ? "done" : ""}">
                  <div>
                    <div style="font-weight:700;color:${st.done?"var(--green-text)":"var(--text-soft)"};">${st.done?"✓":"○"} ${st.step}</div>
                    <div style="font-size:12px;color:var(--text-soft);">${st.time}</div>
                  </div>
                </div>
              `).join("")}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);">
              <button class="btn btn-primary" id="ordJumpCsBtn">
                ${matchedSess ? `🔗 一键跳转 M1 客服会话 (${matchedSess.buyer}) →` : "🔗 前往 M1 客服工作台处理 →"}
              </button>
            </div>
          `, (drawerBody) => {
            drawerBody.querySelector("#ordJumpCsBtn").onclick = () => {
              if (matchedSess) state.csActiveId = matchedSess.id;
              closeDetailDrawer();
              goPage("m1a");
              toast(matchedSess ? `已关联并定位买家「${matchedSess.buyer}」会话` : `已跳转客服工作台，可按订单号 ${o.orderNo} 检索核验`, "info");
            };
          });
        });

        document.querySelectorAll(".m0b-cost-btn").forEach(b => b.onclick = () => {
          const p = state.masterProducts.find(x => x.sku === b.dataset.sku);
          const beforeMargin = calcProductMargin(p);
          commitAction({
            title: `发起完整成本变更申请 · ${p.sku} (${p.name})`,
            summary: "⚠️ 影响面提示：成本生效后将同步重算「商品毛利率」、影响「M2 经营大屏净利润」及「M6 补货采购资金测算」。提交后需主管审批生效（提交人 ≠ 审批人）。",
            confirmText: "提交成本变更申请",
            fieldsHtml: `
              <div class="grid-2" style="gap:10px;">
                <div class="field"><label>单件采购成本 (USD) *</label><input id="cNewCost" type="number" step="0.01" class="input" value="${p.cost ?? ""}" placeholder="例如 4.80"/></div>
                <div class="field"><label>单件头程运费 (USD) *</label><input id="cNewFr" type="number" step="0.01" class="input" value="${p.freight ?? ""}" placeholder="例如 2.30"/></div>
                <div class="field"><label>平台佣金率 (%) *</label><input id="cNewComm" type="number" step="0.1" class="input" value="${p.commissionRate ?? 12}"/></div>
                <div class="field"><label>尾程配送费 (USD) *</label><input id="cNewLast" type="number" step="0.01" class="input" value="${p.lastMile ?? 3.5}"/></div>
                <div class="field"><label>进口关税 (USD) *</label><input id="cNewTar" type="number" step="0.01" class="input" value="${p.tariff ?? 1.0}"/></div>
                <div class="field"><label>均摊广告费 (USD) *</label><input id="cNewAd" type="number" step="0.01" class="input" value="${p.adCost ?? 2.5}"/></div>
              </div>
              <div id="cMarginPreview" class="formula-box" style="margin-bottom:10px;">请输入完整成本项以预览毛利率变化…</div>
              <div class="field"><label>成本生效日期 *</label><input id="cEffDate" type="date" class="input" value="${daysOffsetDate(1)}"/></div>
              <div class="field"><label>业务变更原因（必填）*</label><input id="cReason" class="input" placeholder="如：原材料涨价 / 供应商阶梯报价调整"/></div>
            `,
            onMount: (wrap) => {
              const ids = ["#cNewCost", "#cNewFr", "#cNewComm", "#cNewLast", "#cNewTar", "#cNewAd"];
              const prevBox = wrap.querySelector("#cMarginPreview");
              const updPreview = () => {
                const c = Number(wrap.querySelector("#cNewCost").value);
                const f = Number(wrap.querySelector("#cNewFr").value);
                const cm = Number(wrap.querySelector("#cNewComm").value);
                const lm = Number(wrap.querySelector("#cNewLast").value);
                const tr = Number(wrap.querySelector("#cNewTar").value);
                const ad = Number(wrap.querySelector("#cNewAd").value);
                if (!(c > 0)) {
                  prevBox.innerHTML = "填写有效的采购成本后，将在此实时对比变更前后毛利率与下游影响。";
                  return;
                }
                const after = calcProductMargin({
                  salePriceUsd: p.salePriceUsd, cost: c, freight: f, commissionRate: cm,
                  lastMile: lm, tariff: tr, adCost: ad, returnLossRate: p.returnLossRate || 2
                });
                const beforeText = beforeMargin.known ? `${beforeMargin.marginPct}% ($${beforeMargin.profitUsd.toFixed(2)})` : "待补全成本";
                prevBox.innerHTML = `
                  <strong>变更前后毛利率实时对比（参考售价 $${p.salePriceUsd.toFixed(2)}）：</strong><br/>
                  • 变更前：${beforeText} → 变更后：<strong style="color:${after.marginPct < 12 ? "var(--red-text)" : "var(--green-text)"};">${after.marginPct}% ($${after.profitUsd.toFixed(2)})</strong>${after.marginPct < 12 ? " <span class='pill p-red'>低于12%预警线</span>" : ""}<br/>
                  • 联动影响：批准生效后，M2 经营大屏毛利按新单件成本 $${after.totalCost.toFixed(2)} 核算，M6 采购计划按采购+头程 $${(c+f).toFixed(2)}/件测算资金。
                `;
              };
              ids.forEach(sel => { wrap.querySelector(sel).oninput = updPreview; });
              updPreview();
            },
            validate: (wrap) => {
              const errs = [];
              const cEl = wrap.querySelector("#cNewCost");
              const fEl = wrap.querySelector("#cNewFr");
              const cmEl = wrap.querySelector("#cNewComm");
              const lmEl = wrap.querySelector("#cNewLast");
              const trEl = wrap.querySelector("#cNewTar");
              const adEl = wrap.querySelector("#cNewAd");
              const dEl = wrap.querySelector("#cEffDate");
              const rEl = wrap.querySelector("#cReason");
              if (!(Number(cEl.value) > 0)) errs.push({ el: cEl, msg: "采购成本必须大于 0" });
              if (fEl.value.trim() === "" || Number(fEl.value) < 0) errs.push({ el: fEl, msg: "请填写合法头程运费" });
              if (cmEl.value.trim() === "" || Number(cmEl.value) < 0 || Number(cmEl.value) > 60) errs.push({ el: cmEl, msg: "平台佣金率须在 0~60% 之间" });
              if (lmEl.value.trim() === "" || Number(lmEl.value) < 0) errs.push({ el: lmEl, msg: "请填写合法尾程配送费" });
              if (trEl.value.trim() === "" || Number(trEl.value) < 0) errs.push({ el: trEl, msg: "请填写合法关税" });
              if (adEl.value.trim() === "" || Number(adEl.value) < 0) errs.push({ el: adEl, msg: "请填写合法广告费用" });
              if (!dEl.value.trim()) errs.push({ el: dEl, msg: "请选择生效日期" });
              if (!rEl.value.trim()) errs.push({ el: rEl, msg: "请填写成本变更业务原因" });
              return errs;
            },
            onConfirm: (wrap) => {
              const nc = Number(wrap.querySelector("#cNewCost").value);
              const nf = Number(wrap.querySelector("#cNewFr").value);
              const ncm = Number(wrap.querySelector("#cNewComm").value);
              const nlm = Number(wrap.querySelector("#cNewLast").value);
              const ntr = Number(wrap.querySelector("#cNewTar").value);
              const nad = Number(wrap.querySelector("#cNewAd").value);
              const dt = wrap.querySelector("#cEffDate").value;
              const rsn = wrap.querySelector("#cReason").value.trim();
              const cid = genDocId("CC");
              state.costChangeLogs.unshift({
                id: cid, sku: p.sku, oldCost: p.cost, oldFreight: p.freight,
                newCost: nc, newFreight: nf, newCommission: ncm, newLastMile: nlm, newTariff: ntr, newAdCost: nad,
                effectiveDate: dt, reason: rsn,
                applicant: ROLE_PERSON_NAMES[state.role],
                approver: "",
                status: "待主管审批",
                time: nowDateTimeStr()
              });
              return { toastMsg: `已提交成本变更申请 ${cid}（待主管复核批准后生效，严格执行提交人 ≠ 审批人）` };
            },
            audit: (wrap) => ({
              sentence: `${ROLE_PERSON_NAMES[state.role]} 提交了 ${p.sku} 完整成本变更申请（采购 $${wrap.querySelector("#cNewCost").value} + 头程 $${wrap.querySelector("#cNewFr").value}，生效日 ${wrap.querySelector("#cEffDate").value}），原因：${wrap.querySelector("#cReason").value.trim()}`,
              ok: true
            })
          });
        });

        document.querySelectorAll(".m0b-approve-cost").forEach(b => b.onclick = () => {
          const log = state.costChangeLogs[Number(b.dataset.i)];
          if (log.applicant === ROLE_PERSON_NAMES[state.role]) {
            record403("M0-2 成本变更审批", "职责分离：不可批准本人提交的成本单");
            return;
          }
          const prod = state.masterProducts.find(p => p.sku === log.sku);
          commitAction({
            title: `批准成本变更生效 · ${log.id}`,
            summary: `批准后 ${log.sku} 的单件成本将正式更新为采购 $${log.newCost.toFixed(2)} + 头程 $${log.newFreight.toFixed(2)}，影响毛利与补货测算。`,
            confirmText: "确认批准生效",
            onConfirm: () => {
              log.status = "已生效";
              log.approver = ROLE_PERSON_NAMES[state.role];
              if (prod) {
                prod.cost = log.newCost;
                prod.freight = log.newFreight;
                if (log.newCommission !== undefined) prod.commissionRate = log.newCommission;
                if (log.newLastMile !== undefined) prod.lastMile = log.newLastMile;
                if (log.newTariff !== undefined) prod.tariff = log.newTariff;
                if (log.newAdCost !== undefined) prod.adCost = log.newAdCost;
                prod.status = "在售";
              }
              return { toastMsg: `成本变更 ${log.id} 已批准生效` };
            },
            audit: {
              sentence: `${ROLE_PERSON_NAMES[state.role]} 批准了成本变更单 ${log.id}（${log.sku} 采购成本调至 $${log.newCost.toFixed(2)}）`,
              ok: true
            }
          });
        });
      }
    };
  }

  // ==================== M0-3: 分店分仓独立库存与正式盘点单 ====================
  if (pageId === "m0c") {
    const canStocktake = state.role === "warehouse" || state.role === "manager" || state.role === "approver";

    const invWithCov = state.inventoryItems.map(item => {
      const cov = calcInvCoverage(item);
      return { item, cov: { ...cov, tier: cov.pill === "p-red" ? "RED" : cov.pill === "p-amber" ? "AMBER" : cov.pill === "p-gray" ? "GRAY" : "GREEN", label: cov.level } };
    });
    const filteredInv = invWithCov.filter(({ item, cov }) => {
      const mShop = state.inventoryShopFilter === "ALL" || item.shopName === state.inventoryShopFilter;
      const mWh = state.inventoryWhFilter === "ALL" || item.whId === state.inventoryWhFilter;
      const mSt = state.inventoryStatusFilter === "ALL" || cov.tier === state.inventoryStatusFilter;
      const q = state.inventorySearch.trim().toLowerCase();
      const mQ = !q || item.sku.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.shopSku.toLowerCase().includes(q);
      return mShop && mWh && mSt && mQ;
    });

    const invPageSize = 8;
    const invTotalPages = Math.max(1, Math.ceil(filteredInv.length / invPageSize));
    if (state.m0cInvPage > invTotalPages) state.m0cInvPage = invTotalPages;
    const pagedInv = filteredInv.slice((state.m0cInvPage - 1) * invPageSize, state.m0cInvPage * invPageSize);

    const redCount = invWithCov.filter(x => x.cov.tier === "RED").length;
    const amberCount = invWithCov.filter(x => x.cov.tier === "AMBER").length;
    const slowCount = invWithCov.filter(x => x.cov.tier === "GRAY").length;
    const totalInTransit = state.inventoryItems.reduce((s, i) => s + (i.inTransit || 0), 0);
    const totalLocked = state.inventoryItems.reduce((s, i) => s + (i.locked || 0), 0);
    const totalQc = state.inventoryItems.reduce((s, i) => s + (i.pendingQc || 0), 0);

    const totalPred7 = state.m5DailyPred.reduce((a, b) => a + b, 0);
    const bagUs = state.inventoryItems.find(i => i.id === "inv1");
    const fanTh = state.inventoryItems.find(i => i.id === "inv3");
    const m5GapBag = bagUs ? Math.max(0, totalPred7 + bagUs.safety - bagUs.avail) : 0;
    const m6GapFan = fanTh ? Math.max(0, 30 * (state.m6NormalLeadDays + state.m6NormalSafetyDays) - fanTh.avail) : 0;

    const currentActor = ROLE_PERSON_NAMES[state.role];
    const reviewerPool = ["赵仓管", "陈主管", "周运营", "张总监", "王采购"].filter(n => n !== currentActor);

    return {
      headerActions: [
        { label: "去 M5 查看销量预测联动 →", primary: false, onClick: () => goPage("m5b") },
        { label: "去 M6 查看补货缺口联动 →", primary: true, onClick: () => goPage("m6b") }
      ],
      html: `
        <div class="grid-4">
          <div class="kpi-card highlight-blue">
            <div class="kpi-label">分店独立库存台账</div>
            <div class="kpi-val" style="color:var(--blue-hover)">${state.inventoryItems.length} 条</div>
            <div class="kpi-sub">美西/美东/曼谷/吉隆坡 4 仓独立核算</div>
          </div>
          <div class="kpi-card ${redCount + amberCount > 0 ? "highlight-red" : ""}">
            <div class="kpi-label">断货 / 低水位预警</div>
            <div class="kpi-val" style="color:var(--red-text)">${redCount} 断货 / ${amberCount} 紧张</div>
            <div class="kpi-sub">覆盖＜7天标红 · 7~14天标橙</div>
          </div>
          <div class="kpi-card ${slowCount > 0 ? "highlight-amber" : ""}">
            <div class="kpi-label">滞销积压 SKU (&gt;90天)</div>
            <div class="kpi-val" style="color:var(--amber-text)">${slowCount} 款</div>
            <div class="kpi-sub">库龄超 90 天需促销或调拨清仓</div>
          </div>
          <div class="kpi-card highlight-green">
            <div class="kpi-label">全仓在途库存总计</div>
            <div class="kpi-val" style="color:var(--green-text)">${totalInTransit} 件</div>
            <div class="kpi-sub">锁定 ${totalLocked} / 待质检 ${totalQc} · M5:${m5GapBag} / M6:${m6GapFan}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">分店分仓独立库存水位明细（含在途 / 锁定 / 待质检与覆盖天数预警）</div>
            <span class="pill p-blue">共 ${filteredInv.length} 条（第 ${state.m0cInvPage}/${invTotalPages} 页）</span>
          </div>
          <div class="filter-bar" style="margin-bottom:12px;">
            <div class="filter-item"><label>搜索商品编码 / 名称</label><input id="m0cSearch" class="input" placeholder="如：BAG-108 / 露营 / 风扇" value="${state.inventorySearch}"/></div>
            <div class="filter-item"><label>按物理仓库筛选</label>
              <select id="m0cWhFlt" class="select">
                <option value="ALL">全部 4 座物理仓</option>
                <option value="US-WH-2" ${state.inventoryWhFilter==="US-WH-2"?"selected":""}>美国美西海外仓 (US-WH-2)</option>
                <option value="US-WH-1" ${state.inventoryWhFilter==="US-WH-1"?"selected":""}>美国美东新泽西仓 (US-WH-1)</option>
                <option value="TH-WH-1" ${state.inventoryWhFilter==="TH-WH-1"?"selected":""}>泰国曼谷本地仓 (TH-WH-1)</option>
                <option value="MY-WH-1" ${state.inventoryWhFilter==="MY-WH-1"?"selected":""}>马来吉隆坡仓 (MY-WH-1)</option>
              </select>
            </div>
            <div class="filter-item"><label>按所属店铺筛选</label>
              <select id="m0cShopFlt" class="select">
                <option value="ALL">全部实盘店铺</option>
                ${state.shops.filter(s => s.mode === "REAL").map(s => `<option value="${s.name}" ${state.inventoryShopFilter===s.name?"selected":""}>${s.name}</option>`).join("")}
              </select>
            </div>
            <div class="filter-item"><label>按水位状态筛选</label>
              <select id="m0cStFlt" class="select">
                <option value="ALL">全部状态</option>
                <option value="RED" ${state.inventoryStatusFilter==="RED"?"selected":""}>🔴 断货预警 (&lt;7天)</option>
                <option value="AMBER" ${state.inventoryStatusFilter==="AMBER"?"selected":""}>🟠 补货提示 (7~14天)</option>
                <option value="GREEN" ${state.inventoryStatusFilter==="GREEN"?"selected":""}>🟢 库存健康</option>
                <option value="GRAY" ${state.inventoryStatusFilter==="GRAY"?"selected":""}>⚪ 积压滞销 (&gt;90天)</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>商品编码与名称</th><th>所属店铺 / 仓库</th><th>可用</th><th>在途</th><th>锁定</th><th>待质检</th><th>安全库存</th><th>覆盖天数 / 库龄</th><th>水位状态与建议</th><th>人工盘点</th></tr></thead>
              <tbody>
                ${pagedInv.length ? pagedInv.map(({ item, cov }) => {
                  const rowBg = cov.tier === "RED" ? "background:#fef2f2;" : cov.tier === "AMBER" ? "background:#fffbeb;" : cov.tier === "GRAY" ? "background:#f8fafc;" : "";
                  return `
                    <tr style="${rowBg}">
                      <td class="nowrap">
                        <div style="display:flex;align-items:center;gap:8px;">
                          <img src="${getProductImg(item.sku)}" style="width:36px;height:36px;border-radius:6px;border:1px solid var(--border);" alt="${item.name}"/>
                          <div><strong>${item.sku} · ${item.name}</strong><div style="font-size:12px;color:var(--text-soft);">上架编码：${item.shopSku} · 日仓储 $${(item.storageFeeRate || 0.03).toFixed(2)}</div></div>
                        </div>
                      </td>
                      <td class="nowrap">
                        <div>${item.shopName}</div>
                        <div style="font-size:12px;color:var(--text-soft);"><strong>${item.whName}</strong></div>
                      </td>
                      <td class="nowrap"><strong style="font-size:15px;color:${cov.tier==="RED"?"var(--red-text)":"var(--text-dark)"};">${item.avail}</strong></td>
                      <td class="nowrap" style="color:var(--blue-hover);font-weight:600;">${item.inTransit || 0}</td>
                      <td class="nowrap">${item.locked || 0}</td>
                      <td class="nowrap">${item.pendingQc || 0}</td>
                      <td class="nowrap">${item.safety} 件</td>
                      <td class="nowrap">
                        <strong>${cov.coverDays} 天</strong>
                        <div style="font-size:12px;color:${item.ageDays > 90 ? "var(--red-text)" : "var(--text-soft)"};">库龄 ${item.ageDays} 天 · 周转 ${item.turnoverDays}天</div>
                      </td>
                      <td>
                        <span class="pill ${cov.pill}">${cov.label}</span>
                        <div style="font-size:12px;color:var(--text-muted);margin-top:3px;max-width:170px;">${cov.advice}</div>
                      </td>
                      <td class="nowrap">
                        <button class="btn btn-sm btn-primary m0c-cal-btn" data-id="${item.id}" ${!canStocktake?"disabled":""} title="${!canStocktake?"需要仓库人员或管理者权限":""}">📝 盘点校准</button>
                      </td>
                    </tr>
                  `;
                }).join("") : `<tr><td colspan="10" style="text-align:center;color:var(--text-soft);padding:20px;">暂无符合当前筛选条件的库存记录。</td></tr>`}
              </tbody>
            </table>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
            <span style="font-size:12.5px;color:var(--text-soft);">第 ${state.m0cInvPage} / ${invTotalPages} 页 · 每页 8 条 · 共 ${filteredInv.length} 条</span>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm" id="m0cInvPrev" ${state.m0cInvPage<=1?"disabled":""}>← 上一页</button>
              <button class="btn btn-sm" id="m0cInvNext" ${state.m0cInvPage>=invTotalPages?"disabled":""}>下一页 →</button>
            </div>
          </div>
        </div>

        <div class="card card-blue">
          <div class="card-header"><div class="card-title">正式盘点单与下游补货影响明细（含复核人双人签核与覆盖天数前后变化）</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>盘点单号</th><th>仓库 / 商品 / 关联单号</th><th>差异类型与数量变化</th><th>覆盖天数变化</th><th>M5 / M6 联动重算</th><th>盘点原因</th><th>盘点 / 复核人 / 时间</th></tr></thead>
              <tbody>
                ${state.stocktakes.map(st => `
                  <tr>
                    <td class="nowrap"><strong>${st.sheetId}</strong></td>
                    <td class="nowrap">
                      <div>${st.whName} · <strong>${st.sku}</strong></div>
                      <div style="font-size:12px;color:var(--text-soft);">关联单号：${st.poNo || "无关联采购单"}</div>
                    </td>
                    <td class="nowrap">
                      <span class="pill ${st.delta >= 0 ? "p-green" : "p-red"}">${st.diffType || "常规盘点"}</span>
                      <div style="margin-top:2px;">${st.before} → <strong>${st.after} 件</strong> (${st.delta >= 0 ? "+" + st.delta : st.delta})</div>
                    </td>
                    <td class="nowrap">${st.coverBefore ?? "基准"}天 → <strong style="color:var(--blue-hover);">${st.coverAfter ?? "基准"}天</strong></td>
                    <td class="nowrap">
                      <div>M5：${st.m5Before} → <strong style="color:var(--blue-hover);">${st.m5After}</strong></div>
                      <div style="font-size:12px;">M6：${st.m6Before} → <strong style="color:var(--green-text);">${st.m6After}</strong></div>
                    </td>
                    <td style="font-size:12.5px;">${st.reason}</td>
                    <td class="nowrap">
                      <div>盘点：${st.who} · 复核：<strong>${st.reviewer || "陈主管"}</strong></div>
                      <div style="font-size:12px;color:var(--text-soft);">${st.time}</div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `,
      bind: () => {
        document.getElementById("m0cSearch").oninput = (e) => { state.inventorySearch = e.target.value; state.m0cInvPage = 1; rerender(); };
        document.getElementById("m0cWhFlt").onchange = (e) => { state.inventoryWhFilter = e.target.value; state.m0cInvPage = 1; rerender(); };
        document.getElementById("m0cShopFlt").onchange = (e) => { state.inventoryShopFilter = e.target.value; state.m0cInvPage = 1; rerender(); };
        document.getElementById("m0cStFlt").onchange = (e) => { state.inventoryStatusFilter = e.target.value; state.m0cInvPage = 1; rerender(); };
        document.getElementById("m0cInvPrev").onclick = () => { state.m0cInvPage -= 1; rerender(); };
        document.getElementById("m0cInvNext").onclick = () => { state.m0cInvPage += 1; rerender(); };

        document.querySelectorAll(".m0c-cal-btn").forEach(b => b.onclick = () => {
          const item = state.inventoryItems.find(x => x.id === b.dataset.id);
          const oldAvail = item.avail;
          const oldCov = calcInvCoverage(item);
          const m5PredBase = state.m5DailyPred.reduce((a, x) => a + x, 0);
          const m5Old = Math.max(0, m5PredBase + item.safety - oldAvail);
          const m6Old = Math.max(0, 30 * (state.m6NormalLeadDays + state.m6NormalSafetyDays) - oldAvail);

          commitAction({
            title: `生成正式盘点单 · ${item.whName} · ${item.sku}`,
            summary: `当前账面可售 <strong>${oldAvail} 件</strong>（覆盖 ${oldCov.coverDays} 天）；盘点生成正式单据后即刻联动 M5/M6，且严禁盘点人与复核人相同。`,
            confirmText: "确认生成盘点单并更新库存",
            fieldsHtml: `
              <div class="grid-2" style="gap:10px;">
                <div class="field"><label>实际清点可售数量 (件) *</label><input id="stNewQty" type="number" class="input" value="${oldAvail}"/></div>
                <div class="field"><label>差异类型 *</label>
                  <select id="stDiffType" class="select">
                    <option value="盘盈入库">盘盈入库</option>
                    <option value="盘亏损耗">盘亏损耗</option>
                    <option value="采购收货核验">采购收货核验</option>
                    <option value="退货重检入仓">退货重检入仓</option>
                    <option value="库位纠偏">库位纠偏</option>
                  </select>
                </div>
                <div class="field"><label>关联采购单/退货单号（选填）</label><input id="stPoNo" class="input" placeholder="如：PO-20261115-01"/></div>
                <div class="field"><label>双人复核人（不可同盘点人 ${currentActor}）*</label>
                  <select id="stReviewer" class="select">
                    ${reviewerPool.map(r => `<option value="${r}">${r}</option>`).join("")}
                  </select>
                </div>
              </div>
              <div id="stImpactPreview" class="formula-box" style="margin-bottom:10px;">请输入盘点后数量以查看覆盖天数及 M5/M6 实时联动变化…</div>
              <div class="field"><label>盘点差异原因（必填）*</label><input id="stReason" class="input" placeholder="如：新到货实物复点数入仓 / 清点剔除外箱破损件"/></div>
              <div id="stBigWarn" style="display:none;flex-direction:column;gap:6px;" class="banner banner-red">
                <span>⚠️ 检测到大幅度库存调整（变动 ≥ 20 件），请二次复核实物并勾选下方确认框后再提交！</span>
                <label style="font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;">
                  <input type="checkbox" id="stBigConfirmCheck"/> 我已与复核人共同完成现场实物点检，确认本次大额调整无误
                </label>
              </div>
            `,
            onMount: (wrap) => {
              const qtyEl = wrap.querySelector("#stNewQty");
              const prevEl = wrap.querySelector("#stImpactPreview");
              const warnEl = wrap.querySelector("#stBigWarn");
              const upd = () => {
                const n = Number(qtyEl.value);
                if (Number.isNaN(n) || n < 0) return;
                const newCov = calcInvCoverage({ ...item, avail: n });
                const m5New = Math.max(0, m5PredBase + item.safety - n);
                const m6New = Math.max(0, 30 * (state.m6NormalLeadDays + state.m6NormalSafetyDays) - n);
                prevEl.innerHTML = `
                  • 库存变化：${oldAvail} 件 → <strong>${n} 件</strong> (${n - oldAvail >= 0 ? "+" : ""}${n - oldAvail} 件)<br/>
                  • 覆盖天数变化：${oldCov.coverDays} 天 → <strong style="color:${newCov.pill==="p-red"?"var(--red-text)":"var(--blue-hover)"};">${newCov.coverDays} 天</strong>（${newCov.level}）<br/>
                  • 影响 M5 预测补货建议：${m5Old} 件 → <strong>${m5New} 件</strong><br/>
                  • 影响 M6 常规补货缺口：${m6Old} 件 → <strong>${m6New} 件</strong>
                `;
                warnEl.style.display = Math.abs(n - oldAvail) >= 20 ? "flex" : "none";
              };
              qtyEl.oninput = upd;
              upd();
            },
            validate: (wrap) => {
              const errs = [];
              const qEl = wrap.querySelector("#stNewQty");
              const rvEl = wrap.querySelector("#stReviewer");
              const rEl = wrap.querySelector("#stReason");
              const chkEl = wrap.querySelector("#stBigConfirmCheck");
              const n = Number(qEl.value);
              if (qEl.value.trim() === "" || Number.isNaN(n) || n < 0) errs.push({ el: qEl, msg: "库存数量必须为大于或等于 0 的数字" });
              if (!rvEl.value.trim() || rvEl.value.trim() === currentActor) errs.push({ el: rvEl, msg: "复核人必填且不可与当前盘点人相同" });
              if (!rEl.value.trim()) errs.push({ el: rEl, msg: "请填写盘点调整原因" });
              if (!Number.isNaN(n) && Math.abs(n - oldAvail) >= 20 && chkEl && !chkEl.checked) {
                errs.push({ el: chkEl, msg: "变动 ≥ 20 件时必须勾选现场实物点检二次确认" });
              }
              return errs;
            },
            onConfirm: (wrap) => {
              const newVal = Number(wrap.querySelector("#stNewQty").value);
              const diffType = wrap.querySelector("#stDiffType").value;
              const poNo = wrap.querySelector("#stPoNo").value.trim() || "无关联采购单";
              const reviewer = wrap.querySelector("#stReviewer").value.trim();
              const reason = wrap.querySelector("#stReason").value.trim();
              const newCov = calcInvCoverage({ ...item, avail: newVal });
              const m5New = Math.max(0, m5PredBase + item.safety - newVal);
              const m6New = Math.max(0, 30 * (state.m6NormalLeadDays + state.m6NormalSafetyDays) - newVal);
              const sid = genDocId("PD");
              item.avail = newVal;
              item.lastMoveAt = nowDateTimeStr();
              state.stocktakes.unshift({
                sheetId: sid, whName: item.whName, sku: item.sku,
                before: oldAvail, after: newVal, delta: newVal - oldAvail,
                m5Before: m5Old, m5After: m5New, m6Before: m6Old, m6After: m6New,
                coverBefore: oldCov.coverDays, coverAfter: newCov.coverDays,
                diffType, poNo, reviewer,
                reason, who: currentActor, time: nowDateTimeStr()
              });
              return { toastMsg: `盘点单 ${sid} 已生效！库存更新为 ${newVal} 件（覆盖 ${newCov.coverDays} 天），M5/M6 已联动重算` };
            },
            audit: (wrap) => ({
              sentence: `${currentActor}（复核人：${wrap.querySelector("#stReviewer").value}）生成了${wrap.querySelector("#stDiffType").value}盘点单（${item.whName} ${item.sku} 由 ${oldAvail} 件校准为 ${wrap.querySelector("#stNewQty").value} 件），原因：${wrap.querySelector("#stReason").value.trim()}`,
              ok: true
            })
          });
        });
      }
    };
  }

  // ==================== M1-1: 客服会话、四要素核验绑单、三项回复检查 ====================
  // ==================== M1 公共辅助：图片放大 & 拼多多式买家售后申请弹窗 ====================
  const openEvidenceLightbox = (photo) => {
    const src = photo.dataUrl || getEvidenceImg(photo.kind || "scratch", photo.label || "买家实拍凭证");
    openModal(`买家实拍凭证放大预览 · ${photo.label || "证据图片"}`, `
      <div style="text-align:center;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;">
        <img src="${src}" style="max-width:100%;max-height:360px;border-radius:8px;border:1px solid #cbd5e1;" alt="${photo.label}"/>
        <div style="font-size:12.5px;color:var(--text-soft);margin-top:8px;">文件名：<strong>${photo.label}</strong>（已与当前订单与会话归档关联）</div>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" id="closeLightBoxBtn">关闭预览</button>
      </div>
    `, (root) => {
      root.querySelector("#closeLightBoxBtn").onclick = () => document.getElementById("modalRoot").innerHTML = "";
    });
  };

  const openBuyerAfterSalesForm = (targetSess, onDone) => {
    const linkedOrd = state.orders.find(o => o.orderNo === targetSess.linkedOrder) || state.orders.find(o => o.shop === targetSess.shop) || state.orders[0];
    const presetAmt = targetSess.buyerAfterSales?.amountUsd || linkedOrd?.amountUsd || 29.90;
    let draftPhotos = [...(targetSess.buyerAfterSales?.photos || [{ kind: "scratch", label: "商品破损实拍.jpg" }])];

    openModal(`买家端售后申请清单（拼多多式）· ${targetSess.shop}`, `
      <div class="buyer-notice-strip">
        <strong>🤖 智能客服</strong>负责解答尺码材质、使用说明/故障自检与物流进度；<strong>🧑 申请退换货或理赔</strong>请填写下方清单并上传问题实拍，提交后将自动转入人工客服优先处理。
      </div>
      <div class="grid-2">
        <div class="field"><label>1. 售后类型 *</label>
          <select id="pddType" class="select">
            <option>仅退款（不退货）</option>
            <option>部分补偿（安抚留货）</option>
            <option>退货退款（退回海外仓）</option>
            <option>换货 / 补发配件</option>
          </select>
        </div>
        <div class="field"><label>2. 货物状态 *</label>
          <select id="pddGoods" class="select">
            <option>已收到货（已拆封验货）</option>
            <option>未收到货（在途/疑丢件）</option>
            <option>已拒收退回中</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>3. 申请原因 *</label>
          <select id="pddReason" class="select">
            <option>商品破损或划痕</option>
            <option>功能故障不能用</option>
            <option>发错货或尺码不符</option>
            <option>少件漏发</option>
            <option>物流超期未送达</option>
            <option>个人原因不想要</option>
          </select>
        </div>
        <div class="field"><label>4. 申请退款/补偿金额 (USD) *</label>
          <input id="pddAmt" type="number" step="0.01" class="input" value="${presetAmt}"/>
        </div>
      </div>
      <div class="field"><label>5. 问题补充说明 *</label>
        <textarea id="pddNote" class="textarea" placeholder="请描述商品哪里破损、少发了什么配件或希望怎么处理...">${targetSess.buyerAfterSales?.note || "外箱挤压变形，拆封发现商品有明显划痕，希望尽快退款处理。"}</textarea>
      </div>
      <div class="field">
        <label>6. 上传问题实拍照片（破损/错漏发必传 ≥1 张，最多 3 张）*</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;" id="pddPhotoList"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-sm" id="pddAddScratch">+ 附带「商品划痕特写.jpg」</button>
          <button type="button" class="btn btn-sm" id="pddAddBox">+ 附带「外箱破损+快递面单.jpg」</button>
          <label class="btn btn-sm" style="cursor:pointer;">📁 选本地图片<input type="file" accept="image/*" id="pddLocalFile" style="display:none;"/></label>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
        <button class="btn" id="pddCancel">取消</button>
        <button class="btn btn-danger" id="pddSubmit">提交售后申请并转人工客服 →</button>
      </div>
    `, (root) => {
      const renderPhotos = () => {
        const box = root.querySelector("#pddPhotoList");
        if (!draftPhotos.length) {
          box.innerHTML = `<span style="font-size:12px;color:var(--red-text);">暂未上传问题实拍图（破损/故障/错漏发退款必须上传至少 1 张）</span>`;
          return;
        }
        box.innerHTML = draftPhotos.map((ph, i) => `
          <div class="evidence-thumb-wrap" style="position:relative;">
            <img src="${ph.dataUrl || getEvidenceImg(ph.kind, ph.label)}" class="evidence-thumb-img" alt="${ph.label}"/>
            <span style="font-size:11px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ph.label}</span>
            <button type="button" class="pdd-del-ph" data-i="${i}" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:11px;cursor:pointer;line-height:1;">×</button>
          </div>
        `).join("");
        box.querySelectorAll(".pdd-del-ph").forEach(b => b.onclick = () => {
          draftPhotos.splice(Number(b.dataset.i), 1);
          renderPhotos();
        });
      };
      renderPhotos();

      root.querySelector("#pddAddScratch").onclick = () => {
        if (draftPhotos.length >= 3) { toast("最多上传 3 张凭证照片", "warn"); return; }
        draftPhotos.push({ kind: "scratch", label: "商品划痕特写.jpg" });
        renderPhotos();
      };
      root.querySelector("#pddAddBox").onclick = () => {
        if (draftPhotos.length >= 3) { toast("最多上传 3 张凭证照片", "warn"); return; }
        draftPhotos.push({ kind: "box", label: "外箱破损+快递面单.jpg" });
        renderPhotos();
      };
      root.querySelector("#pddLocalFile").onchange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        if (draftPhotos.length >= 3) { toast("最多上传 3 张凭证照片", "warn"); return; }
        draftPhotos.push({ kind: "scratch", label: f.name });
        renderPhotos();
      };
      root.querySelector("#pddCancel").onclick = () => document.getElementById("modalRoot").innerHTML = "";
      root.querySelector("#pddSubmit").onclick = () => {
        const type = root.querySelector("#pddType").value;
        const goods = root.querySelector("#pddGoods").value;
        const reason = root.querySelector("#pddReason").value;
        const amt = Number(root.querySelector("#pddAmt").value);
        const note = root.querySelector("#pddNote").value.trim();
        const needPhoto = ["商品破损或划痕", "功能故障不能用", "发错货或尺码不符", "少件漏发"].includes(reason);
        if (!note) { toast("请填写问题补充说明", "error"); return; }
        if (!(amt > 0)) { toast("请填写有效的申请金额", "error"); return; }
        if (needPhoto && draftPhotos.length === 0) { toast("所选原因属于破损/故障/错漏发，必须附带至少 1 张买家问题实拍图", "error"); return; }

        targetSess.buyerAfterSales = {
          submitted: true, afterSalesType: type, goodsStatus: goods, reasonCategory: reason,
          amountUsd: amt, note, photos: draftPhotos, submittedAt: nowDateTimeStr()
        };
        targetSess.bizType = "售后退换赔";
        targetSess.intent = `${reason} · 申请${type} $${amt.toFixed(2)}`;
        targetSess.status = "待人工接管";
        targetSess.serviceMode = "WAIT_HUMAN";
        targetSess.handoffReason = `买家主动提交「${type}」申请（${reason}，${draftPhotos.length}张实拍图），已自动停用AI并转人工处理`;
        state.csTakeoverMap[targetSess.id] = { who: "待客服接管", at: "刚刚提交申请" };
        targetSess.msgs.push({
          who: "buyer",
          text: `[After-Sales Request] ${type} ($${amt.toFixed(2)}) · ${reason}. ${note}`,
          trans: `买家提交售后清单：${type} · ${goods} · 附 ${draftPhotos.length} 张实拍图`
        });
        targetSess.msgs.push({
          who: "ai",
          text: "熔断通知：收到买家退换货清单与凭证照片，智能客服已停言，正在排队等待人工客服接管。",
          trans: "已进入 M1-1 店铺待人工接管队列"
        });
        appendAuditLog(state, { sentence: `买家「${targetSess.buyer}」提交了「${type}」申请（$${amt.toFixed(2)}，${draftPhotos.length}张图），会话已转入待人工队列`, ok: true });
        document.getElementById("modalRoot").innerHTML = "";
        if (onDone) onDone();
        else rerender();
        toast("已提交买家售后清单并自动转人工队列", "success");
      };
    });
  };

  // ==================== M1-1: 多店铺客服分流调度台 & 人工接待工作台 (Option A 两页式) ====================
  if (pageId === "m1a") {
    const canCs = state.role === "cs";
    const isApproverReadonly = state.role === "approver";
    const viewMode = state.csViewMode || "queue";
    const active = state.csSessions.find(s => s.id === state.csActiveId) || state.csSessions[0];
    const tkInfo = state.csTakeoverMap[active.id] || { who: "智能客服自动接待", at: "刚接入" };
    const linkedOrdObj = state.orders.find(o => o.orderNo === active.linkedOrder);

    // 按店铺汇总智能自动对话数 / 待人工 / 人工接待中
    const shopNames = [...new Set(state.csSessions.map(s => s.shop))];
    const shopSummaries = shopNames.map(name => {
      const list = state.csSessions.filter(s => s.shop === name);
      return {
        shop: name,
        mode: list[0]?.mode || "REAL",
        total: list.length,
        aiAuto: list.filter(s => s.status === "智能自动接待" || s.status === "仅限联调演示").length,
        waitHuman: list.filter(s => s.status === "待人工接管").length,
        humanBusy: list.filter(s => s.status === "人工接待中").length,
      };
    });

    // -------------------- 第 1 页：分店铺会话调度台 --------------------
    if (viewMode === "queue") {
      const curShopFilter = state.csShopFilter || "ALL";
      const filteredSessions = state.csSessions
        .filter(s => curShopFilter === "ALL" || s.shop === curShopFilter)
        .slice()
        .sort((a, b) => {
          const rank = s => s.status === "待人工接管" ? 0 : s.status === "人工接待中" ? 1 : 2;
          return rank(a) - rank(b);
        });

      return {
        headerActions: [
          { label: "🛒 模拟买家提交退换货", primary: false, onClick: () => openBuyerAfterSalesForm(active) },
          { label: "导购与说明书知识库 →", primary: false, onClick: () => goPage("m1b") },
          { label: "售后主管审批台 →", primary: true, onClick: () => goPage("m1c") }
        ],
        html: `
          <div class="grid-${Math.min(4, shopSummaries.length + 1)}">
            <div class="shop-queue-card ${curShopFilter === "ALL" ? "active" : ""}" data-shop="ALL">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <strong style="font-size:13.5px;">全部接入店铺 (${shopNames.length} 家)</strong>
                <span class="pill p-blue">总 ${state.csSessions.length} 组</span>
              </div>
              <div style="display:flex;gap:10px;font-size:12px;flex-wrap:wrap;">
                <span>🤖 智能对话 <strong>${state.csSessions.filter(s => s.status === "智能自动接待" || s.status === "仅限联调演示").length}</strong></span>
                <span style="color:var(--red-text);">🚨 待人工 <strong>${state.csSessions.filter(s => s.status === "待人工接管").length}</strong></span>
                <span style="color:var(--blue-hover);">🧑 人工中 <strong>${state.csSessions.filter(s => s.status === "人工接待中").length}</strong></span>
              </div>
            </div>
            ${shopSummaries.map(sp => `
              <div class="shop-queue-card ${curShopFilter === sp.shop ? "active" : ""}" data-shop="${sp.shop}">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;">
                  <strong style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${sp.shop}</strong>
                  <span class="pill ${sp.mode==="MOCK"?"p-amber":sp.waitHuman>0?"p-red":"p-green"}">${sp.mode==="MOCK"?"沙盒联调":sp.waitHuman>0?`待人工 ${sp.waitHuman}`:"AI正常托管"}</span>
                </div>
                <div style="display:flex;gap:10px;font-size:12px;flex-wrap:wrap;">
                  <span>🤖 智能对话 <strong>${sp.aiAuto}</strong></span>
                  <span style="color:${sp.waitHuman>0?"var(--red-text)":"var(--text-soft)"};">🚨 待人工 <strong>${sp.waitHuman}</strong></span>
                  <span>🧑 人工中 <strong>${sp.humanBusy}</strong></span>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">
                ${curShopFilter === "ALL" ? "全店铺客服会话分流队列" : `${curShopFilter} · 会话队列`}
                <span class="pill p-gray">${filteredSessions.length} 组</span>
              </div>
              <div style="font-size:12px;color:var(--text-soft);">已将「待人工接管」优先置顶 · 点击右侧按钮跳转到第 2 页回复</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${filteredSessions.map(s => {
                const info = state.csTakeoverMap[s.id] || { who: "智能客服自动接待", at: "" };
                const isWait = s.status === "待人工接管";
                const isHuman = s.status === "人工接待中";
                const isMock = s.mode === "MOCK";
                return `
                  <div class="session-queue-row ${isWait ? "urgent" : isHuman ? "" : "ai-auto"}">
                    <div style="flex:1;min-width:260px;">
                      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;">
                        <span class="pill ${isWait?"p-red":isHuman?"p-blue":isMock?"p-amber":"p-green"}">
                          ${isWait ? "🚨 待人工接管" : isHuman ? "🧑 人工接待中 · AI已禁言" : isMock ? "🧪 仅限联调演示" : `🤖 智能自动接待 (${s.conf})`}
                        </span>
                        <span class="pill p-gray">${s.bizType || "常规咨询"}</span>
                        <strong style="font-size:14px;">${s.buyer}</strong>
                        <span style="font-size:12px;color:var(--text-soft);">· ${s.shop}</span>
                        ${s.buyerAfterSales?.submitted ? `<span class="pill p-amber">📎 买家售后单: ${s.buyerAfterSales.afterSalesType} $${Number(s.buyerAfterSales.amountUsd).toFixed(2)} (${s.buyerAfterSales.photos?.length || 0}图)</span>` : ""}
                      </div>
                      <div style="font-size:12.5px;color:var(--text-dark);margin-bottom:3px;"><strong>买家诉求：</strong>${s.intent}</div>
                      ${s.handoffReason ? `<div style="font-size:12px;color:var(--red-text);"><strong>转人工原因：</strong>${s.handoffReason}</div>` : s.kbHit ? `<div style="font-size:12px;color:var(--green-text);"><strong>命中知识：</strong>${s.kbHit}</div>` : ""}
                      <div style="font-size:11.5px;color:var(--text-soft);margin-top:2px;">当前接待：${info.who} (${info.at}) ｜ 关联订单：${s.linkedOrder || "暂未绑定"}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                      ${isWait ? `
                        <button class="btn btn-sm btn-danger q-takeover-go" data-id="${s.id}">✋ 接管并去回复 →</button>
                      ` : isHuman ? `
                        <button class="btn btn-sm btn-primary q-open-ws" data-id="${s.id}">进入人工工作台回复 →</button>
                      ` : `
                        <button class="btn btn-sm q-open-ws" data-id="${s.id}">查看AI对话 / 人工介入 →</button>
                      `}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `,
        bind: () => {
          document.querySelectorAll(".shop-queue-card").forEach(el => {
            el.onclick = () => { state.csShopFilter = el.dataset.shop; rerender(); };
          });
          document.querySelectorAll(".q-open-ws").forEach(b => {
            b.onclick = () => { state.csActiveId = b.dataset.id; state.csViewMode = "workspace"; rerender(); };
          });
          document.querySelectorAll(".q-takeover-go").forEach(b => {
            b.onclick = () => {
              const target = state.csSessions.find(s => s.id === b.dataset.id);
              if (!target) return;
              state.csActiveId = target.id;
              if (canCs) {
                state.csTakeoverMap[target.id] = { who: ROLE_PERSON_NAMES[state.role], at: nowTimeStr() };
                target.status = "人工接待中";
                target.serviceMode = "HUMAN";
                appendAuditLog(state, { sentence: `${ROLE_PERSON_NAMES[state.role]} 从分店铺调度台接管了「${target.buyer}」（${target.shop}）会话并禁言智能客服`, ok: true });
                toast(`已接管「${target.buyer}」会话（AI已禁言），进入第 2 页回复`, "success");
              } else {
                toast("当前岗位仅浏览会话工作台（接管建单请切至「客服」岗位）", "warn");
              }
              state.csViewMode = "workspace";
              rerender();
            };
          });
          const pddBtn = document.getElementById("qDemoPddBtn");
          if (pddBtn) pddBtn.onclick = () => openBuyerAfterSalesForm(active);
        }
      };
    }

    // -------------------- 第 2 页：人工坐席接待与售后处理工作台 --------------------
    // 实时三项回复内容检查
    const zhVal = active.draftZh || "";
    const enVal = active.draftEn || "";
    const zhNums = (zhVal.match(/\d+(\.\d+)?/g) || []).join(",");
    const enNums = (enVal.match(/\d+(\.\d+)?/g) || []).join(",");
    const numMatchOk = zhNums === enNums;
    const orderAmt = linkedOrdObj ? linkedOrdObj.amountUsd : null;
    const mentionNums = (zhVal + " " + enVal).match(/\$\s*(\d+(\.\d+)?)/g) || [];
    const amountWithinOk = !orderAmt || mentionNums.every(m => Number(m.replace("$", "").trim()) <= orderAmt);
    const otherDomains = state.csCatalog.filter(c => c.shop !== active.shop).map(c => c.domain);
    const wrongDom = otherDomains.find(d => (zhVal + " " + enVal).includes(d));
    const linkMatchOk = !wrongDom;
    const allReplyChecksOk = numMatchOk && amountWithinOk && linkMatchOk;

    // 建单用默认值（优先承接买家提交的拼多多式售后清单）
    const bAs = active.buyerAfterSales;
    const prodObj = linkedOrdObj ? state.masterProducts.find(p => p.sku === linkedOrdObj.sku) : null;
    const estCost = prodObj ? prodObj.cost : 4.50;
    const estReturnShip = prodObj ? +(Number(prodObj.freight || 2.5) + Number(prodObj.lastMile || 4.8) * 1.8).toFixed(2) : 14.20;
    const csDraftForm = active.csFormDraft || {
      afterSalesType: bAs?.afterSalesType || "仅退款（不退货）",
      goodsStatus: bAs?.goodsStatus || "已收到货（已拆封验货）",
      reasonCategory: bAs?.reasonCategory || "商品破损或划痕",
      liability: "物流运输破损",
      refundAmount: bAs?.amountUsd || (linkedOrdObj ? linkedOrdObj.amountUsd : 34.50),
      photos: bAs?.photos ? [...bAs.photos] : [{ kind: "scratch", label: "商品划痕特写.jpg" }],
      reviewSummary: bAs?.submitted
        ? `已核验订单 ${active.linkedOrder || "待绑定"}，买家提交「${bAs.afterSalesType}」并附 ${bAs.photos?.length || 0} 张实拍图属实；采购成本 $${estCost.toFixed(2)}、退回海外仓运费预估 $${estReturnShip.toFixed(2)}，建议按申请方案处理。`
        : "已核验买家反馈与订单信息，请结合商品成本与运费确认售后方案。"
    };
    active.csFormDraft = csDraftForm;

    const isHumanTaken = active.status === "人工接待中";
    const isWaitHuman = active.status === "待人工接管";

    return {
      headerActions: [
        { label: "← 返回店铺会话调度台", primary: false, onClick: () => { state.csViewMode = "queue"; rerender(); } },
        { label: "查看本店知识库 →", primary: false, onClick: () => goPage("m1b") },
        { label: "前往售后审批台 →", primary: true, onClick: () => goPage("m1c") }
      ],
      html: `
        <div class="banner ${isWaitHuman ? "banner-red" : isHumanTaken ? "banner-blue" : "banner-green"}">
          <span>
            <button class="btn btn-sm" id="wsBackQueueBtn" style="margin-right:8px;">← 返回第1页店铺队列</button>
            <strong>${active.buyer} · ${active.shop}</strong> ｜
            ${isHumanTaken ? `🧑 <strong>人工接待中（AI已禁言防抢答）</strong> · 接待人：${tkInfo.who}` : isWaitHuman ? `🚨 <strong>待人工接管</strong> · ${active.handoffReason}` : `🤖 <strong>智能自动接待</strong> · ${active.kbHit || active.intent}`}
          </span>
          ${!isHumanTaken ? `<button class="btn btn-sm btn-primary" id="csTakeoverBtn" ${!canCs?"disabled":""}>✋ 立即接管会话并禁言AI</button>` : `<span class="pill p-green">AI已锁止禁发 ✓</span>`}
        </div>

        ${isApproverReadonly ? `
          <div class="banner banner-amber">
            <span><strong>职责分离提示：</strong>当前以「主管 / 审批人」只读巡检此会话；一线回复与提交售后工单须由「客服」岗位执行（可在左侧切换「客服」体验完整建单）。</span>
          </div>
        ` : ""}

        <div class="cs-2col">
          <!-- 左栏：买家视角提示 + 对话流 + 双语回答 -->
          <div class="card">
            <div class="card-header" style="margin-bottom:8px;">
              <div class="card-title">第 2 页 · 对话详情与双语人工回复</div>
              <button class="btn btn-sm" id="wsBuyerApplyBtn">🛍️ 买家端：发起退换货并传图</button>
            </div>

            <div class="buyer-notice-strip">

const M4_MODES = {
  balanced: { key: "balanced", label: "均衡优选", wRev: 45, wTrend: 35, wMargin: 20, desc: "适合日常选品：平衡近2月销售额、近期涨势与毛利空间，优先推荐可投产单品" },
  revenue:  { key: "revenue",  label: "稳健经营", wRev: 60, wTrend: 15, wMargin: 25, desc: "适合稳现金流：优先挑选销额大、毛利率高、退货率与侵权风险低的老道品类" },
  growth:   { key: "growth",   label: "高增长",   wRev: 20, wTrend: 65, wMargin: 15, desc: "适合抓爆款窗口：优先挑选近8周销量快速攀升、竞品较少的新品机会" },
};

function calcM4NetSales(item) { return item.paidQty - item.refundQty; }
function calcM4NetRev(item) { return +(item.grossRev - item.discount - item.refundAmt).toFixed(2); }

function isProduceReady(item) {
  const reasons = [];
  if (item.srcCode !== "INTERNAL") reasons.push("外购估算数据（须内部实盘才能投产）");
  if (item.stage === "临时待核价") reasons.push("临时待核价（须复核正式采购价）");
  if (item.margin < 10) reasons.push(`毛利率 ${item.margin}% 低于 10% 底线`);
  if (item.riskLevel === "高风险") reasons.push("存在高风险隐患");
  return { ok: reasons.length === 0, reasons };
}

function calcM4Priority(item, maxRev, modeKey = "balanced") {
  const m = M4_MODES[modeKey] || M4_MODES.balanced;
  const revNorm = Math.min(1, calcM4NetRev(item) / (maxRev || 1));
  const trendNorm = Math.max(0, Math.min(1, item.trend / 60));
  const ready = isProduceReady(item);
  const marginVal = typeof item.margin === "number" ? item.margin : 10;
  const marginNorm = Math.max(0, Math.min(1, marginVal / 25));
  const rankVal = ((m.wRev / 100) * revNorm + (m.wTrend / 100) * trendNorm + (m.wMargin / 100) * marginNorm) * 100 + (ready.ok ? 8 : -10);
  return {
    rankVal,
    explain: `依据「${m.label}」策略：近2月销额贡献(${m.wRev}%) + 近8周涨势(${m.wTrend}%) + 预计毛利(${m.wMargin}%)`,
    missingNote: item.stage === "临时待核价" ? "外购估算暂按同类报价测算，复核正式报价后再投产" : ""
  };
}

              ["NEED_COST", `⏳ 缺成本待核价 (${quickCounts.NEED_COST})`, ""],

              <button type="button" class="btn btn-sm ${state.m4ViewMode==="card"?"btn-primary":""} m4-view-btn" data-vm="card">🃏 卡片</button>
            </div>

            <input id="m4SearchInp" class="input" style="width:170px;" placeholder="搜编码 / 品名..." value="${state.m4Search}"/>
            <select id="m4CatSel" class="select" style="width:125px;">
              ${allCats.map(c => `<option value="${c}" ${state.m4CatTab===c?"selected":""}>${c==="ALL"?"全部品类":c}</option>`).join("")}
            </select>
            <select id="m4RegSel" class="select" style="width:125px;">
              <option value="ALL">全部平台</option>
              <option value="Amazon US" ${state.m4RegionFilter==="Amazon US"?"selected":""}>Amazon US</option>
              <option value="TikTok US" ${state.m4RegionFilter==="TikTok US"?"selected":""}>TikTok US</option>
              <option value="Shopee TH" ${state.m4RegionFilter==="Shopee TH"?"selected":""}>Shopee TH</option>
            </select>
            <select id="m4SrcSel" class="select" style="width:135px;">
              <option value="ALL">全部来源</option>
              <option value="内部实盘选品" ${state.m4SrcFilter==="内部实盘选品"?"selected":""}>内部实盘选品</option>
              <option value="外购行业估算" ${state.m4SrcFilter==="外购行业估算"?"selected":""}>外购行业估算</option>
            </select>
            <select id="m4SortSel" class="select" style="width:155px;">
              <option value="priority" ${state.m4SortBy==="priority"?"selected":""}>排序：${activeMode.label}优先</option>
              <option value="rev" ${state.m4SortBy==="rev"?"selected":""}>排序：近2月销额 ↓</option>
              <option value="trend" ${state.m4SortBy==="trend"?"selected":""}>排序：8周增速 ↓</option>
              <option value="margin" ${state.m4SortBy==="margin"?"selected":""}>排序：预计毛利 ↓</option>
              <option value="refund" ${state.m4SortBy==="refund"?"selected":""}>排序：退货率低优先 ↑</option>
            </select>
            <label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer;margin-left:4px;">
              <input type="checkbox" id="m4MyCatChk" ${state.m4OnlyMyCats?"checked":""}/> 只看我负责的类目
            </label>
          </div>

          <!-- 展开面板：高级筛选、品类增速与可配置权重（默认收起，保持第一屏干净） -->
          ${state.m4ShowAdvPanel ? (() => {
            const w = state.m4Weights;
            const wSum = Number(w.demand) + Number(w.competition) + Number(w.profit) + Number(w.logistics) + Number(w.compliance) + Number(w.trend);
            return `
              <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;"/>
              <div class="grid-2" style="gap:12px;">
                <div>
                  <div style="font-size:12px;font-weight:700;margin-bottom:6px;">精细筛选与推荐策略</div>
                  <div class="grid-3" style="gap:6px;margin-bottom:8px;">
                    <select id="m4PriceSel" class="select" style="height:32px;font-size:12px;">
                      <option value="ALL">全部价格带</option>
                      <option value="<$15" ${state.m4PriceFilter==="<$15"?"selected":""}>&lt;$15</option>
                      <option value="$15-30" ${state.m4PriceFilter==="$15-30"?"selected":""}>$15-30</option>
                      <option value="$30-60" ${state.m4PriceFilter==="$30-60"?"selected":""}>$30-60</option>
                    </select>
                    <select id="m4LifeSel" class="select" style="height:32px;font-size:12px;">
                      <option value="ALL">全部生命周期</option>
                      <option value="新品期" ${state.m4LifecycleFilter==="新品期"?"selected":""}>新品期</option>
                      <option value="快速上升期" ${state.m4LifecycleFilter==="快速上升期"?"selected":""}>快速上升期</option>
                      <option value="成熟期" ${state.m4LifecycleFilter==="成熟期"?"selected":""}>成熟期</option>
                      <option value="衰退期" ${state.m4LifecycleFilter==="衰退期"?"selected":""}>衰退期</option>
                    </select>
                    <select id="m4RiskSel" class="select" style="height:32px;font-size:12px;">
                      <option value="ALL">全部风险</option>
                      <option value="低风险" ${state.m4RiskFilter==="低风险"?"selected":""}>低风险</option>
                      <option value="中风险" ${state.m4RiskFilter==="中风险"?"selected":""}>中风险</option>
                      <option value="高风险" ${state.m4RiskFilter==="高风险"?"selected":""}>高风险</option>
                    </select>
                  </div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${Object.values(M4_MODES).map(m => `
                      <button type="button" class="btn btn-sm ${state.m4Mode===m.key?"btn-primary":""} m4-mode-opt" data-mode="${m.key}">${m.label}</button>
                    `).join("")}
                  </div>
                </div>
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <strong style="font-size:12px;">⚖️ 6 维评分权重配置（总和须为 100%）</strong>
                    <span class="pill ${wSum===100?"p-green":"p-red"}">总和 ${wSum}%</span>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px;">
                    ${[["demand","需求"],["competition","竞争"],["profit","毛利"],["logistics","物流"],["compliance","合规"],["trend","趋势"]].map(([k,lbl]) => `
                      <div><span style="font-size:11px;color:var(--text-soft);">${lbl}%</span><input type="number" min="0" max="100" class="input m4-w-inp" data-k="${k}" value="${w[k]}" style="height:28px;font-size:12px;padding:2px 6px;"/></div>
                    `).join("")}
                  </div>
                  <button class="btn btn-sm btn-primary" id="m4ApplyWeightsBtn" ${wSum!==100?"disabled":""}>应用权重重排（高风险独立拦截）</button>
                </div>
              </div>
            `;
          })() : ""}
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
            <div class="utabs" style="margin-bottom:0;">
              ${tabs.map(t => {
                const cnt = afterQuick.filter(x => t.key === "ALL" || x.stage === t.key).length;
                return `<div class="utab ${state.m4Tab===t.key?"active":""} m4-utab" data-t="${t.key}">${t.label} <span class="utab-cnt">${cnt}</span></div>`;
              }).join("")}
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <button class="btn btn-sm btn-primary" id="m4OpenCompareBtn" ${compareItems.length < 2 ? "disabled" : ""}>横向对比 (${compareItems.length}/4)</button>
              <button class="btn btn-sm" id="m4BatchSubmitBtn" ${(!isSelector || compareItems.length===0)?"disabled":""}>批量送审</button>
              <button class="btn btn-sm" id="m4BatchHoldBtn" ${(!isSelector || compareItems.length===0)?"disabled":""}>标待核价</button>
              <button class="btn btn-sm btn-danger" id="m4BatchElimBtn" ${(!isSelector || compareItems.length===0)?"disabled":""}>批量淘汰</button>
            </div>
          </div>

          ${paged.length === 0 ? `<div style="padding:28px;text-align:center;color:var(--text-soft);">当前筛选条件下暂无符合要求的候选商品，请点击上方「全部候选」或放宽筛选条件。</div>` : state.m4ViewMode === "table" ? `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:28px;"><input type="checkbox" id="m4CheckAllPage" title="全选本页最多4款对比"/></th>
                    <th>商品实拍图与名称</th>
                    <th>来源 / 状态</th>
                    <th>售价 / 采购参考</th>
                    <th>近2月销额</th>
                    <th>8周趋势</th>
                    <th>毛利率</th>
                    <th>风险 / 退货</th>
                    <th>系统建议</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${paged.map(item => {
                    const netRev = calcM4NetRev(item);
                    const ready = isProduceReady(item);
                    const checked = state.m4CompareIds.includes(item.sku);
                    const maxBar = Math.max(...(item.trend8w || [1]), 1);
                    const prodImg = getProductImg(item.sku, item.name, item.category);
                    return `
                      <tr class="${checked?"row-selected":""}">
                        <td><input type="checkbox" class="m4-cmp-chk" data-sku="${item.sku}" ${checked?"checked":""}/></td>
                        <td style="min-width:210px;">
                          <div style="display:flex;align-items:center;gap:9px;cursor:pointer;" class="m4-detail" data-sku="${item.sku}">
                            <img src="${prodImg}" class="prod-thumb-img" style="width:42px;height:42px;" alt="${item.name}"/>
                            <div>
                              <strong style="color:var(--blue-hover);">${item.name}</strong>
                              <div style="font-size:11.5px;color:var(--text-soft);">${item.sku} · ${item.category} · ${item.platform}</div>
                            </div>
                          </div>
                        </td>
                        <td class="nowrap">
                          <span class="pill ${item.srcCode==="INTERNAL"?"p-green":"p-amber"}">${item.src==="内部实盘选品"?"内部实盘":"外购参考"}</span>
                          <div style="font-size:11.5px;color:var(--text-soft);margin-top:2px;">${item.stage}</div>
                        </td>
                        <td class="nowrap">
                          <strong>$${item.unitPriceUsd}</strong>
                          <div style="font-size:11.5px;color:${item.missing?"var(--amber-text)":"var(--text-soft)"};">${item.supplyChain.buyPrice}</div>
                        </td>
                        <td class="nowrap"><strong>$${netRev.toLocaleString()}</strong></td>
                        <td class="nowrap">
                          <span class="spark-row">${(item.trend8w||[]).map(v => `<span class="spark-bar" style="height:${Math.max(20, Math.round((v/maxBar)*100))}%;background:${item.trend>=0?"#60a5fa":"#fca5a5"};"></span>`).join("")}</span>
                          <strong style="color:${item.trend>=0?"var(--green-text)":"var(--red-text)"};">${item.trend>=0?"+":""}${item.trend}%</strong>
                        </td>
                        <td class="nowrap">
                          <strong style="color:${item.margin>=10?"var(--green-text)":"var(--red-text)"};">${item.margin}%</strong>
                          ${item.stage==="临时待核价"?`<div style="font-size:11px;color:var(--amber-text);">待核价</div>`:""}
                        </td>
                        <td class="nowrap">
                          <span class="pill ${item.riskLevel==="低风险"?"p-green":item.riskLevel==="高风险"?"p-red":"p-amber"}">${item.riskLevel}</span>
                          <div style="font-size:11px;color:var(--text-soft);">退货 ${item.riskDetail.refundRate}</div>
                        </td>
                        <td style="min-width:130px;">
                          <span class="pill ${item.sysAdvice.tone}">${item.sysAdvice.badge}</span>
                        </td>
                        <td class="nowrap">
                          <div style="display:flex;gap:5px;">
                            <button class="btn btn-sm m4-detail" data-sku="${item.sku}">透视</button>
                            ${(item.stage === "初筛候选" || item.stage === "临时待核价")
                              ? `<button class="btn btn-sm btn-primary m4-submit" data-sku="${item.sku}" ${!isSelector?"disabled":""}>${ready.ok?"送审→":"核价→"}</button>`
                              : `<span style="font-size:11.5px;color:var(--text-soft);">${item.stage}</span>`}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="grid-3">
              ${paged.map(item => {
                const netRev = calcM4NetRev(item);
                const ready = isProduceReady(item);
                const checked = state.m4CompareIds.includes(item.sku);
                const prodImg = getProductImg(item.sku, item.name, item.category);
                return `
                  <div class="prod-card" style="gap:8px;padding:12px;">
                    <div style="display:flex;align-items:center;gap:9px;">
                      <input type="checkbox" class="m4-cmp-chk" data-sku="${item.sku}" ${checked?"checked":""}/>
                      <img src="${prodImg}" class="prod-thumb-img" alt="${item.name}"/>
                      <div style="min-width:0;">
                        <strong style="font-size:13.5px;">${item.name}</strong>
                        <div style="font-size:11.5px;color:var(--text-soft);">${item.sku} · ${item.platform}</div>
                      </div>
                    </div>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;">
                      <span class="pill ${item.sysAdvice.tone}">${item.sysAdvice.badge}</span>
                      <span class="pill ${item.srcCode==="INTERNAL"?"p-green":"p-amber"}">${item.src}</span>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;">
                      <span>销额 <strong>$${netRev.toLocaleString()}</strong></span>
                      <span>涨跌 <strong>${item.trend>=0?"+":""}${item.trend}%</strong></span>
                      <span>毛利 <strong>${item.margin}%</strong></span>
                    </div>
                    <div style="display:flex;gap:6px;margin-top:auto;">
                      <button class="btn btn-sm m4-detail" data-sku="${item.sku}">看图与详情</button>
                      ${(item.stage === "初筛候选" || item.stage === "临时待核价")
                        ? `<button class="btn btn-sm btn-primary m4-submit" data-sku="${item.sku}" ${!isSelector?"disabled":""}>${ready.ok?"送审→":"核价→"}</button>` : ""}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);">
              <span>第 ${state.m4Page} / ${totalPages} 页 · 共 ${tabFiltered.length} 款</span>
              ${state.m4ViewMode === "table" ? `
                <select id="m4PgSizeSel" class="select" style="width:auto;height:28px;font-size:12px;">
                  <option value="15" ${pageSize===15?"selected":""}>每页 15 条</option>
                  <option value="30" ${pageSize===30?"selected":""}>每页 30 条</option>
                  <option value="50" ${pageSize===50?"selected":""}>每页 50 条</option>
                </select>
              ` : ""}
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm" id="m4PrevPg" ${state.m4Page<=1?"disabled":""}>← 上一页</button>
              <button class="btn btn-sm" id="m4NextPg" ${state.m4Page>=totalPages?"disabled":""}>下一页 →</button>
            </div>
          </div>
        </div>
      `,
      bind: () => {
        document.querySelectorAll(".m4-qf-btn").forEach(b => b.onclick = () => { state.m4QuickFilter = b.dataset.qf; state.m4Page = 1; rerender(); });
        document.querySelectorAll(".m4-view-btn").forEach(b => b.onclick = () => { state.m4ViewMode = b.dataset.vm; state.m4Page = 1; rerender(); });
        document.getElementById("m4SearchInp").oninput = (e) => { state.m4Search = e.target.value; state.m4Page = 1; rerender(); };
        document.getElementById("m4CatSel").onchange = (e) => { state.m4CatTab = e.target.value; state.m4Page = 1; rerender(); };
        document.getElementById("m4RegSel").onchange = (e) => { state.m4RegionFilter = e.target.value; state.m4Page = 1; rerender(); };
        document.getElementById("m4SrcSel").onchange = (e) => { state.m4SrcFilter = e.target.value; state.m4Page = 1; rerender(); };
        document.getElementById("m4SortSel").onchange = (e) => { state.m4SortBy = e.target.value; state.m4Page = 1; rerender(); };
        document.getElementById("m4MyCatChk").onchange = (e) => { state.m4OnlyMyCats = e.target.checked; state.m4Page = 1; rerender(); };
        const psSel = document.getElementById("m4PgSizeSel");
        if (psSel) psSel.onchange = (e) => { state.m4PageSize = Number(e.target.value); state.m4Page = 1; rerender(); };

        if (state.m4ShowAdvPanel) {
          document.getElementById("m4PriceSel").onchange = (e) => { state.m4PriceFilter = e.target.value; state.m4Page = 1; rerender(); };
          document.getElementById("m4LifeSel").onchange = (e) => { state.m4LifecycleFilter = e.target.value; state.m4Page = 1; rerender(); };
          document.getElementById("m4RiskSel").onchange = (e) => { state.m4RiskFilter = e.target.value; state.m4Page = 1; rerender(); };
          document.querySelectorAll(".m4-mode-opt").forEach(el => el.onclick = () => {
            state.m4Mode = el.dataset.mode; state.m4SortBy = "priority"; state.m4Page = 1; rerender();
            toast(`已切换选品策略：${M4_MODES[state.m4Mode].label}`);
          });
          document.querySelectorAll(".m4-w-inp").forEach(inp => inp.onchange = (e) => {
            state.m4Weights[inp.dataset.k] = Math.max(0, Math.min(100, Number(e.target.value) || 0));
            rerender();
          });
          const applyWBtn = document.getElementById("m4ApplyWeightsBtn");
          if (applyWBtn) applyWBtn.onclick = () => {
            const w = state.m4Weights;
            const sum = Number(w.demand) + Number(w.competition) + Number(w.profit) + Number(w.logistics) + Number(w.compliance) + Number(w.trend);
            if (sum !== 100) { toast(`权重总和必须等于 100%（当前 ${sum}%）`, "error"); return; }
            appendAuditLog(state, { sentence: `${ROLE_PERSON_NAMES[state.role]} 调整了 M4-2 选品评分权重`, ok: true });
            toast("已应用新评分权重", "success");
            rerender();
          };
        }

        document.querySelectorAll(".m4-utab").forEach(t => t.onclick = () => { state.m4Tab = t.dataset.t; state.m4Page = 1; rerender(); });
        document.getElementById("m4PrevPg").onclick = () => { state.m4Page -= 1; rerender(); };
        document.getElementById("m4NextPg").onclick = () => { state.m4Page += 1; rerender(); };

        const chkAll = document.getElementById("m4CheckAllPage");
        if (chkAll) chkAll.onchange = (e) => {
          if (e.target.checked) {
            state.m4CompareIds = paged.slice(0, 4).map(x => x.sku);
            toast("已快速勾选本页前 4 款用于横向对比或批量处理", "info");
          } else {
            state.m4CompareIds = [];
          }
          rerender();
        };

        document.querySelectorAll(".m4-cmp-chk").forEach(chk => chk.onchange = () => {
          const sku = chk.dataset.sku;
          if (chk.checked) {
            if (state.m4CompareIds.length >= 10) { chk.checked = false; toast("单次最多勾选 10 款", "warn"); return; }
            if (!state.m4CompareIds.includes(sku)) state.m4CompareIds.push(sku);
          } else {
            state.m4CompareIds = state.m4CompareIds.filter(id => id !== sku);
          }
          rerender();
        });

        document.getElementById("m4OpenCompareBtn").onclick = () => {
          const items = state.m4Pool.filter(x => state.m4CompareIds.includes(x.sku)).slice(0, 4);
          openModal(`候选商品横向对比（前 ${items.length} 款）`, `
            <div class="table-wrap" style="max-height:420px;">
              <table>
                <thead><tr><th>对比维度</th>${items.map(i => `<th><img src="${getProductImg(i.sku, i.name, i.category)}" style="width:40px;height:40px;border-radius:6px;display:block;margin-bottom:4px;"/>${i.sku}<br/>${i.name}</th>`).join("")}</tr></thead>
                <tbody>
                  <tr><td>品类 / 平台</td>${items.map(i => `<td>${i.category} · ${i.platform}</td>`).join("")}</tr>
                  <tr><td>系统建议</td>${items.map(i => `<td><span class="pill ${i.sysAdvice.tone}">${i.sysAdvice.badge}</span></td>`).join("")}</tr>
                  <tr><td>近2月销额</td>${items.map(i => `<td><strong>$${calcM4NetRev(i).toLocaleString()}</strong></td>`).join("")}</tr>
                  <tr><td>近8周涨跌</td>${items.map(i => `<td><strong>${i.trend>=0?"+":""}${i.trend}%</strong></td>`).join("")}</tr>
                  <tr><td>预计毛利率</td>${items.map(i => `<td>${i.margin}%</td>`).join("")}</tr>
                  <tr><td>竞品数 / 售价带</td>${items.map(i => `<td>${i.competition.competitors}家 · ${i.competition.priceRange}</td>`).join("")}</tr>
                  <tr><td>采购价 / 交期</td>${items.map(i => `<td>${i.supplyChain.buyPrice} / ${i.supplyChain.leadDays}</td>`).join("")}</tr>
                  <tr><td>风险与退货率</td>${items.map(i => `<td>${i.riskLevel} (${i.riskDetail.refundRate})</td>`).join("")}</tr>
                </tbody>
              </table>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:12px;">
              <button class="btn btn-primary" id="m4CmpClose">关闭对比</button>
            </div>
          `, (root) => { root.querySelector("#m4CmpClose").onclick = () => document.getElementById("modalRoot").innerHTML = ""; });
        };

        const runBatchOp = (opLabel, targetStage, isDanger) => {
          const selected = state.m4Pool.filter(x => state.m4CompareIds.includes(x.sku));
          commitAction({
            title: `二次确认：${opLabel}（共 ${selected.length} 款）`,
            danger: isDanger,
            summary: `即将把已勾选的 ${selected.map(x=>x.sku).join("、")} 批量流转为「${targetStage}」。`,
            confirmText: `确认${opLabel}`,
            fieldsHtml: `<div class="field"><label>批量操作原因（必填）*</label><input id="m4BatReason" class="input" placeholder="如：本批符合家居收纳秋季上新节奏"/></div>`,
            validate: (w) => w.querySelector("#m4BatReason").value.trim() ? [] : [{ el: w.querySelector("#m4BatReason"), msg: "请填写操作原因" }],
            onConfirm: (w) => {
              const rsn = w.querySelector("#m4BatReason").value.trim();
              selected.forEach(item => {
                item.stage = targetStage;
                item.submitter = ROLE_PERSON_NAMES[state.role];
                item.submitReason = rsn;
              });
              state.m4CompareIds = [];
              return { toastMsg: `已完成${opLabel}：共处理 ${selected.length} 款` };
            },
            audit: (w) => ({
              sentence: `${ROLE_PERSON_NAMES[state.role]} 批量将 ${selected.map(x=>x.sku).join("、")} 设为「${targetStage}」，原因：${w.querySelector("#m4BatReason").value.trim()}`,
              ok: true
            })
          });
        };
        document.getElementById("m4BatchSubmitBtn").onclick = () => runBatchOp("批量提交测款", "已提交待审", false);
        document.getElementById("m4BatchHoldBtn").onclick = () => runBatchOp("批量标为暂观望", "临时待核价", false);
        document.getElementById("m4BatchElimBtn").onclick = () => runBatchOp("批量淘汰", "已淘汰", true);

        document.querySelectorAll(".m4-submit").forEach(b => b.onclick = () => {
          const item = state.m4Pool.find(x => x.sku === b.dataset.sku);
          commitAction({
            title: `提交选品待主管终审 · ${item.sku} (${item.name})`,
            summary: `提交后将流转至 M4-3 由「主管 / 审批人」最终拍板。${item.stage !== "临时待核价" ? "" : "⚠️ 该款当前缺正式采购报价，主管页仅允许退回核价或淘汰。"}`,
            confirmText: "确认提交待审",
            fieldsHtml: `
              <div class="field"><label>初筛推荐理由与风险核查结论（必填）*</label><textarea id="m4SubReason" class="textarea" placeholder="写明推荐依据（近2月销额、近8周涨势、专利核查结论等）..."></textarea></div>
              <div class="field"><label>预计测款预算与首批数量（必填）*</label><input id="m4SubBudget" class="input" value="${item.budget}"/></div>
            `,
            validate: (wrap) => {
              const errs = [];
              const r = wrap.querySelector("#m4SubReason");
              const bg = wrap.querySelector("#m4SubBudget");
              if (!r.value.trim()) errs.push({ el: r, msg: "必须填写推荐理由" });
              if (!bg.value.trim()) errs.push({ el: bg, msg: "必须确认测款预算占用" });
              return errs;
            },
            onConfirm: (wrap) => {
              item.stage = "已提交待审";
              item.submitter = ROLE_PERSON_NAMES[state.role];
              item.submitReason = wrap.querySelector("#m4SubReason").value.trim();
              item.budget = wrap.querySelector("#m4SubBudget").value.trim();
              return { toastMsg: `${item.sku} 已提交至 M4-3 待主管终审` };
            },
            audit: (wrap) => ({
