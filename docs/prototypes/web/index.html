<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPilot · AI跨境电商智能工作台（SRS V6 · 27页完整交互版）</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="shell">
    <!-- Left Accordion Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">CP</div>
        <div>
          <div class="brand-name">CrossPilot</div>
          <div class="brand-sub">AI跨境电商 · SRS V6工作台</div>
        </div>
      </div>

      <div class="role-box">
        <label class="role-label">当前登录角色 (SRS §1.5 九大角色)</label>
        <select id="roleSelect" class="role-select">
          <option value="approver">主管 / 审批人 (approver)</option>
          <option value="manager">大屏浏览者 / 管理者 (manager)</option>
          <option value="planner">驾驶舱设计者 / 业务运营 (planner)</option>
          <option value="bi_analyst">数据分析 / BI 人员 (bi_analyst)</option>
          <option value="selector">选品研究员 (selector)</option>
          <option value="creator">内容创作 / 审核人员 (creator)</option>
          <option value="warehouse">采购 / 仓库 / 物流人员 (warehouse)</option>
          <option value="cs">客服 (cs)</option>
          <option value="mock_buyer">买家（模拟）(mock_buyer)</option>
        </select>
        <div id="roleHint" class="role-hint"></div>
      </div>

      <nav id="sidebarNav" class="nav-list"></nav>

      <div class="sidebar-footer">
        <div>对齐：SRS V1.0 (§1.5 九角色) · 27页</div>
        <div>§0.3 示例数值与规则常量已隔离标注</div>
      </div>
    </aside>

    <!-- Main Content Area (Plan A: No Subnav Bar, Full Width!) -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <div id="breadcrumb" class="breadcrumb">CROSSPILOT</div>
          <h1 id="pageTitle" class="page-title">加载中...</h1>
          <p id="pageSubtitle" class="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <div id="headerActions" class="header-action-btns"></div>
          <button id="toggleAnnoBtn" class="btn btn-anno-toggle" title="展开右侧 SRS 注释与来源台账抽屉">
            📖 SRS注释与来源台账
          </button>
        </div>
      </header>

      <main id="pageBody" class="page-body"></main>
    </div>
  </div>

  <!-- Slide-over SRS Annotation & Provenance Drawer (Hidden by default) -->
  <div id="annoDrawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="annoDrawer" class="slide-drawer hidden" aria-label="SRS注释与来源台账">
    <div class="drawer-head dark">
      <div>
        <div class="drawer-title" id="annoPageTitle">功能块注释</div>
        <div class="drawer-sub">1→2→3 对应 · SRS 依据 · 文字与数字来源台账</div>
      </div>
      <button class="btn btn-sm" id="closeAnnoDrawer">✕ 关闭</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-sec-label">📌 页面功能块注释（1→2→3 + SRS依据）</div>
      <div id="annoCards" class="anno-cards"></div>
      <div class="drawer-sec-label" style="margin-top:16px;">🧾 本页文字与数字来源台账</div>
      <div class="ledger-note" style="margin-bottom:8px;">严格区分：SRS规则 / 代码常量 vs §0.3 Mock / 示例展示值</div>
      <div id="ledgerGrid" class="ledger-list"></div>
    </div>
  </aside>

  <!-- Generic Detail Slide-over Drawer -->
  <div id="detailDrawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="detailDrawer" class="slide-drawer hidden" aria-label="业务详情抽屉">
    <div class="drawer-head">
      <div>
        <div class="drawer-title" id="detailDrawerTitle">详情</div>
        <div class="drawer-sub" id="detailDrawerSub"></div>
      </div>
      <button class="btn btn-sm" id="closeDetailDrawer">✕</button>
    </div>
    <div class="drawer-body" id="detailDrawerBody"></div>
  </aside>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
