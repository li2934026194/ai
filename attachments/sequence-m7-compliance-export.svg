<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><rect width="1600" height="850" fill="white"/>
<text x="50" y="60" font-family="Microsoft YaHei" font-size="32">M7 compliance-export 目标时序</text>
<rect x="50" y="110" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="157" font-family="Microsoft YaHei" font-size="26">1. UI → API：指定资产版本与区段送检</text>
<rect x="50" y="210" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="257" font-family="Microsoft YaHei" font-size="26">2. API → DB：读取规则版本与选中素材</text>
<rect x="50" y="310" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="357" font-family="Microsoft YaHei" font-size="26">3. API → DB：保存独立ComplianceCheck</text>
<rect x="50" y="410" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="457" font-family="Microsoft YaHei" font-size="26">4. Approver → API：真实权限版本理由审批，禁止自批</text>
<rect x="50" y="510" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="557" font-family="Microsoft YaHei" font-size="26">5. API → DB：保存审批与资产版本快照</text>
<rect x="50" y="610" width="1500" height="78" rx="10" fill="#eef5fb" stroke="#50718e"/>
<text x="75" y="657" font-family="Microsoft YaHei" font-size="26">6. API → UI：仅返回审批结果；版本变更旧审批失效</text>
<text x="50" y="800" font-family="Microsoft YaHei" font-size="24">PostgreSQL为事实来源；图示不代表现有代码已实现</text></svg>